# ui-chat — a message typed by a person in the UI on node A must ARRIVE in the
# UI transcript on node B.
#
# The mesh-repro `chat` scenario proves the same delivery over HTTP. This proves
# it through the SURFACE A PERSON USES: the contact is added in the UI, consent
# is given in the UI, the message is typed and sent in the UI, and the assertion
# reads node B's on-screen transcript. Everything between is the real substrate.
#
# THREE CONTAINERS, THREE NETNS. Each node is 127.0.0.1:4243 to its own UI, so
# the client's hardcoded LOCAL_NODE_URL (CIRISClient#26) is correct rather than
# merely tolerated, and no node needs its ports moved off the defaults.

x-test-anchor-env: &test-anchor-env
  CIRIS_TESTING_MODE: "true"
  # 15s announce instead of the 300s production cycle — rooting converges in
  # ~30s. test-anchor-fenced in compose.rs, so it cannot leak into a prod node.
  CIRIS_TEST_ANNOUNCE_SECS: "15"
  # ALL FIVE. Setting only the classical half boots a node that roots, arms its
  # gates, and then dies adopting its own blessed record:
  #   "adopt the test-root-blessed self record: scrub-signature verification
  #    failed: registration hybrid-verify: PQC signature without pubkey"
  # The hybrid record carries a PQC signature, so the PQC pubkey is not optional
  # — the optional-half class, and the error names it precisely.
  CIRIS_TEST_TRUST_ROOT: "ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="
  CIRIS_TEST_TRUST_ROOT_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SCRUB: "1LzFAFfuS+7JtBJ/q8bFcRn6L/fN0NZ+QarCsMOyVZ04niuwhgtbQOl+qJMsRLkGmf52hEYXVaWKRY+mwDCfDg=="
  CIRIS_TEST_TRUST_ROOT_SCRUB_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SEED: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
  CIRIS_TEST_CANONICAL_DIAL: "172.29.78.10:4242"

services:
  canonical:
    build: .
    image: ciris-uichat:latest
    environment:
      <<: *test-anchor-env
      UI_ROLE: "canonical"
      CIRIS_KEY_ID: "ciris-canonical-1"
      # The only node blessed as one. node-a/node-b are ordinary owner-claimed
      # nodes, which is what makes the delivery claim non-trivial.
      CIRIS_TEST_BLESS_CANONICAL: "true"
      RUST_LOG: "info,ciris_edge=debug"
    networks:
      mesh:
        ipv4_address: 172.29.78.10
    # A VOLUME, not tmpfs. The wizard's opt-in is boot-structural, so the harness
    # restarts the node to apply it — and a tmpfs home makes that restart wipe
    # the identity, the claim and the config the restart existed to apply. The
    # run then loops: every boot is a first boot.
    volumes: [canonical-home:/var/lib/ciris]

  node-a:
    build: .
    image: ciris-uichat:latest
    depends_on: [canonical]
    environment:
      <<: *test-anchor-env
      UI_ROLE: "node"
      CIRIS_KEY_ID: "node-a"
      # The synthetic canonical, injected as this node's dial set. Without it
      # `/v1/accord/canonical/servers` stays empty and nothing discovers anything.
      CIRIS_NODE_BOOTSTRAP_PEERS: '["172.29.78.10:4242"]' 
      CIRIS_TEST_BLESS_CANONICAL: "false"
      RUST_LOG: "info,ciris_edge=debug"
    ports:
      - "9101:9092"    # UI automation (via socat; the server itself is loopback-only)
      - "14243:4243"   # read API, for out-of-band assertions
    networks:
      mesh:
        ipv4_address: 172.29.78.11
    volumes: [node-a-home:/var/lib/ciris]

  node-b:
    build: .
    image: ciris-uichat:latest
    depends_on: [canonical]
    environment:
      <<: *test-anchor-env
      UI_ROLE: "node"
      CIRIS_KEY_ID: "node-b"
      # The synthetic canonical, injected as this node's dial set. Without it
      # `/v1/accord/canonical/servers` stays empty and nothing discovers anything.
      CIRIS_NODE_BOOTSTRAP_PEERS: '["172.29.78.10:4242"]' 
      CIRIS_TEST_BLESS_CANONICAL: "false"
      RUST_LOG: "info,ciris_edge=debug"
    ports:
      - "9102:9092"
      - "24243:4243"
    networks:
      mesh:
        ipv4_address: 172.29.78.12
    volumes: [node-b-home:/var/lib/ciris]

volumes:
  canonical-home:
  node-a-home:
  node-b-home:

networks:
  mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.78.0/24
