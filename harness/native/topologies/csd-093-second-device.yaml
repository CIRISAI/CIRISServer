# CSD-093/094 — a second device of one person: the owner carried, both claimed, one self room,
# a file written on the first opens on the second. The file relation is where CIRISEdge#716/#717 sit.
topology:
  roots:
    - {id: R, kind: key, holders: 1, custody: software_test, lifecycle: active}
  canonicals:
    - {id: C, holds: R, serves: [infra:serve, infra:attest]}
  nodes:
    - {id: D1, dials: [C],     accepts: R, announced: true}
    - {id: D2, dials: [C, D1], accepts: R, announced: true}   # the phone dials the first device directly
    - {id: X,  dials: [C],     accepts: R, announced: false}
  persons:
    - {id: one, owns: [D1, D2], accepts: R}
    - {id: eve, owns: [X],      accepts: R}
  relations:
    - {rel: peered, between: [D1, D2]}
    - {rel: room, kind: self, person: one}
    - {rel: file, person: one, device: D1, size: 4096, name: small.bin}
  actor: {person: one, device: D2}
  negatives:
    - {check: holds_no_row, node: X, dimension: "file:v1", person: one}
