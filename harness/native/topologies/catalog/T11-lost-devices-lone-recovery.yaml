# T11 — two lost devices: recovery by the lone path over the window (CC
# 3.3.6.3; catalogue v2). alice's roster holds three keys; A2 and A3 are lost
# for good (their processes stop). From A1 alone she evicts each by the lone
# path — the proposal applies after W_self (86400 s) unless a live key objects —
# leaving the genesis key only. No lone-path route exists and the server has no
# clock override for W_self, so both evictions are known red.
