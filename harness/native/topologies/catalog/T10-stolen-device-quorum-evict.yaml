# T10 — a stolen device: the owner evicts it by the quorum path (CC 3.3.6.3;
# catalogue v2, CC formal/roster). alice's genesis key is roster key one; two
# devices join by approval (T3's flow), so her roster holds three keys and both
# paths are open. A3 is stolen WITH its authentication (a staging: the key stays
# live, the model reads it as the thief's). A3's addition is itself a roster
# change from two keys, so A1's approval is HELD and A2 assents. A1 proposes
# the eviction and A2 co-signs it — the quorum path (CIRISServer#794).
catalog_id: T10
catalogue_version: 2
title: A stolen device — the owner evicts it by the quorum path
serves: [CSD-037]
promises: [key.holder.owner, key.holder.thief, key.membership.proposed_evict, key.membership.evicted,
           self.roster_size.three_more]
topology:
  roots:
    - id: HA
      kind: infrastructure
      founders: {seated: 3, conferrable: 1, node_bearing: 0}
      quorum: 2
      custody: software_test
      lifecycle: {recipe: {ceremony: final_genesis}, verdict: rooted}
  canonicals:
    - {id: C, holds: HA, serves: [infra:serve, infra:attest]}
  nodes:
    - {id: A1, dials: [C],     accepts: HA, announced: true}
    # Joined devices cannot announce until CIRISPersist#1099 (CIRISServer#793).
    - {id: A2, dials: [C, A1], accepts: HA, announced: false}
    - {id: A3, dials: [C, A1], accepts: HA, announced: false}
  persons:
    - {id: alice, owns: [A1, A2, A3], joins: [A2, A3], accepts: HA}
  relations:
    - {rel: peered, between: [A1, C]}
    - {rel: join_request, person: alice, device: A2, label: "Laptop"}
    - {rel: join_approve, person: alice, device: A2}
    - {rel: join_complete, person: alice, device: A2}
    # The joined device's peerings are owner acts on it (as T3; CIRISServer#793).
    - {rel: peered, between: [A2, C]}
    - {rel: peered, between: [A1, A2]}
    - {rel: join_request, person: alice, device: A3, label: "Phone"}
    - {rel: join_approve, person: alice, device: A3, held: true}
    - {rel: join_assent, person: alice, device: A3, by: A2}
    - {rel: join_complete, person: alice, device: A3}
    # The joined device's peerings are owner acts on it (as T3; CIRISServer#793).
    - {rel: peered, between: [A3, C]}
    - {rel: peered, between: [A1, A3]}
    - {rel: steal, person: alice, device: A3}
    - {rel: evict_propose, person: alice, target: A3, by: A1}
    - {rel: evict_cosign, person: alice, target: A3, by: A2}
  actor: {person: alice, device: A1}
  negatives: []
