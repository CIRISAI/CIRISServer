# T15 — a community's ceremony (CC 3.1.3.2, 4.5.4, 4.5.13; catalogue v2).
# Majority protocol, as T5: bob is seated by alice alone; erin and frank each by
# a quorum change bob co-signs. carol is INVITED (proposed) and accepts while
# the group's quorum is outstanding; dave declines; erin is removed; frank
# resigns. bob is appointed moderator; his duty lapses (the community then
# cannot federate), the room fails secure, and a member is promoted on merit —
# the lapse and the promotion have no route (CIRISServer#795, known red).
# Membership's door (steward 2026-10-18, CIRISConstitution#180): no single vote
# admits by silence at any size — invitations run the two-path policy with an
# approval floor, and a proposal holding one approval and no objections through
# its window ends DECLINED. No step here admits by silence: carol ACCEPTS while
# the group's quorum is outstanding, and dave declines in his own voice. gus is
# the ruling's own test: one approval (alice's proposal), no objections, the
# window ends below the floor → declined (CIRISServer#796 ships the window).
