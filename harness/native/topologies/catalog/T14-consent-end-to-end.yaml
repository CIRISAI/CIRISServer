# T14 — consent end to end (CC 3.3.1, 3.3.7; catalogue v2). The replication
# grant two peered nodes hold is withdrawn (consent.replication = none). The
# node's community_trust grant and its boundary (CIRISServer#790, known red);
# a subject's consent:state granted → revoked, granted again → expired
# (CIRISServer#182, known red: /v1/auth/consent also wants a hybrid request
# signature); the agent's decay ladder to complete (refused: an agent process).
catalog_id: T14
catalogue_version: 3
title: Consent end to end — grant, revoke, expiry, decay; replication grant and its withdrawal
serves: [CSD-053]
promises: [consent.state.granted, consent.state.revoked, consent.state.expired, consent.decay.identity_severed,
           consent.decay.patterns_anonymized, consent.decay.complete, consent.community_trust.granted,
           consent.community_trust.bounded, consent.replication.none]
