# mesh-repro — two ciris-server nodes on one isolated Docker bridge.
#
# Zero internet, zero NAT, zero packet loss — the confounds that made every
# remote read ambiguous are removed by construction. Both roles run the SAME
# published ciris-server wheel (CIRIS_SERVER_VERSION), so no cross-version skew.
#
#   canonical : the seed / fabric node — `ciris-server --key-id ciris-canonical-1`
#   agent     : dials the canonical (CIRIS_EDGE_BOOTSTRAP_PEERS=canonical:4242)
#               and drives the IdentityOccurrence federation-delivery round
#
# Run:  ./run.sh            (build + up + probe + verdict)
# or:   CIRIS_SERVER_VERSION=0.5.113 docker compose up --build

name: ciris-mesh-repro

# ── Where these six values come from, and why you must not transcribe them ──
# They are one synthetic trust root minted against THIS repo's persist + verify
# pins. persist builds the terminus envelope and verify checks the scrub over
# the stored bytes, so the two SCRUB values only verify under the pair they
# were minted against. Bump a pin that changes the envelope and every harness
# node roots `Advisory`, the Attestation plane goes dark, and the trace ladder
# reads `arrive=0`. `tests/anchor_block_verifies.rs` catches that in a second
# — run it after every substrate repin, before any mesh run.
#
# This repo no longer carries a generator (a third copy drifted and cost a day;
# CIRISEdge hit the mirror image transcribing OUR block, edge 82d8650). Mint
# with the substrate's generator — CIRISPersist#805 asks persist to ship it —
# and until it lands, CIRISEdge's `tests/anchor_block_generate.rs` prints the
# identical bytes ONLY while edge pins the same persist + verify as Cargo.lock
# here. Ed25519 is deterministic: if its SCRUB differs from the one below, the
# pins differ, and its block is not yours.
# (regenerate-and-paste is always safe; the ML-DSA signature is randomized but
# any emitted signature verifies).
x-test-anchor-env: &test-anchor-env
  CIRIS_TESTING_MODE: "true"
  # Harness-only announce cadence (test-anchor-fenced in compose.rs): rooting
  # converges in ~30s instead of waiting out the 300s prod announce cycle.
  CIRIS_TEST_ANNOUNCE_SECS: "15"
  CIRIS_TEST_TRUST_ROOT: "ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="
  CIRIS_TEST_TRUST_ROOT_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SCRUB: "ZOkeMQA9qWCJTjzCn9osJLwedBxvg0y+dusOp9bErJZKbZDouYSq3DWwGyXH3BpquFtBwRAeIb6502i+Ffi8Bg=="
  CIRIS_TEST_TRUST_ROOT_SCRUB_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SEED: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="

services:
  canonical:
    build:
      context: .
      args:
        CIRIS_SERVER_VERSION: ${CIRIS_SERVER_VERSION:-0.5.113}
    command: ["ciris-server", "--home", "/var/lib/ciris", "--key-id", "ciris-canonical-1"]
    environment:
      <<: *test-anchor-env
      # This node IS the harness canonical: test_bless claims `canonical,node`
      # (conferred via the untouched m-of-n gate, 1-of-1 over the test roster)
      # + a dial hint so the agent's canonical_bootstrap_hints() targets it.
      CIRIS_TEST_BLESS_CANONICAL: "true"
      CIRIS_TEST_CANONICAL_DIAL: "canonical:4242"
      RUST_LOG: "info,ciris_edge=debug"
    networks: [mesh]
    # Fresh home each run → deterministic, no stale-identity carryover. Drop
    # `tmpfs` and mount a named volume + drop a pre-provisioned keystore here for
    # full baked-identity fidelity (see README §Fidelity).
    tmpfs:
      - /var/lib/ciris:mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4243/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  agent:
    build:
      context: .
      args:
        CIRIS_SERVER_VERSION: ${CIRIS_SERVER_VERSION:-0.5.113}
    command: ["python", "/opt/harness/agent_boot.py"]
    depends_on:
      canonical:
        condition: service_healthy
    environment:
      <<: *test-anchor-env
      CIRIS_HOME: /var/lib/ciris
      CIRIS_KEY_ID: ciris-agent-harness-1
      CIRIS_EDGE_LISTEN_ADDR: "0.0.0.0:4242"
      # Dial the canonical container by service name on the shared bridge.
      CIRIS_EDGE_BOOTSTRAP_PEERS: "canonical:4242"
      CIRIS_AGENT_MODE: server
      CIRIS_FEDERATION_DELIVERY: "true"
      # Embedded-fold variant switch (run_embedded.sh, CIRISServer#264 must-have 2).
      CIRIS_HARNESS_EMBEDDED_FOLD: "${CIRIS_HARNESS_EMBEDDED_FOLD:-false}"
      # Lifecycle probe: print [DELIVERY-STATUS] JSON each poll (run_lifecycle.sh).
      CIRIS_HARNESS_LIFECYCLE: "${CIRIS_HARNESS_LIFECYCLE:-false}"
      RUST_LOG: "info,ciris_edge=debug,reticulum_core=debug,leviculum_core=debug,leviculum_std=debug"
    networks: [mesh]
    tmpfs:
      - /var/lib/ciris:mode=1777

networks:
  mesh:
    driver: bridge
