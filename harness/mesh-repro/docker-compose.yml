# mesh-repro — two ciris-server nodes on one isolated Docker bridge.
#
# Zero internet, zero NAT, zero packet loss — the confounds that made every
# remote read ambiguous are removed by construction. Both roles run the SAME
# published ciris-server wheel (CIRIS_SERVER_VERSION), so no cross-version skew.
#
#   canonical : the seed / fabric node — `ciris-server --key-id ciris-canonical-1`
#   agent     : dials the canonical (CIRIS_EDGE_BOOTSTRAP_PEERS=canonical:4242)
#               and drives the IdentityOccurrence federation-delivery round
#
# Run:  ./run.sh            (build + up + probe + verdict)
# or:   CIRIS_SERVER_VERSION=0.5.113 docker compose up --build

name: ciris-mesh-repro

# TEST-ANCHOR trust root (CIRISServer#258 / CIRISPersist#451) — one throwaway SW
# hybrid key. The SEED blesses (test_bless scrub-signs each node's own record);
# the PUBKEYS anchor (verify's `CIRIS_TEST_TRUST_ROOT` 1-of-N accord override +
# persist's PQC-complete `test-accord-holder-0` genesis row); the SCRUB pair is
# the root's sign_bound self-scrub over persist's pinned synthesized envelope,
# making the seeded terminus scrub-VERIFYING so persist's own `root_binding`
# Confirms through it. Both nodes root under this one SW root exactly as a prod
# canonical roots under an A1-scrubbed record — no operator YubiKey, and never
# touching the real trust key. ALL values below derive from the one SEED:
#   CIRIS_TEST_TRUST_ROOT_SEED=<seed> cargo run --release \
#     --example test_anchor_env --features test-anchor
# (regenerate-and-paste is always safe; the ML-DSA signature is randomized but
# any emitted signature verifies).
x-test-anchor-env: &test-anchor-env
  CIRIS_TESTING_MODE: "true"
  CIRIS_TEST_TRUST_ROOT: "ebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ="
  CIRIS_TEST_TRUST_ROOT_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SCRUB: "1LzFAFfuS+7JtBJ/q8bFcRn6L/fN0NZ+QarCsMOyVZ04niuwhgtbQOl+qJMsRLkGmf52hEYXVaWKRY+mwDCfDg=="
  CIRIS_TEST_TRUST_ROOT_SCRUB_PQC: ""
  CIRIS_TEST_TRUST_ROOT_SEED: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="

services:
  canonical:
    build:
      context: .
      args:
        CIRIS_SERVER_VERSION: ${CIRIS_SERVER_VERSION:-0.5.113}
    command: ["ciris-server", "--home", "/var/lib/ciris", "--key-id", "ciris-canonical-1"]
    environment:
      <<: *test-anchor-env
      # This node IS the harness canonical: test_bless claims `canonical,node`
      # (conferred via the untouched m-of-n gate, 1-of-1 over the test roster)
      # + a dial hint so the agent's canonical_bootstrap_hints() targets it.
      CIRIS_TEST_BLESS_CANONICAL: "true"
      CIRIS_TEST_CANONICAL_DIAL: "canonical:4242"
      RUST_LOG: "info,ciris_edge=debug"
    networks: [mesh]
    # Fresh home each run → deterministic, no stale-identity carryover. Drop
    # `tmpfs` and mount a named volume + drop a pre-provisioned keystore here for
    # full baked-identity fidelity (see README §Fidelity).
    tmpfs:
      - /var/lib/ciris
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:4243/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  agent:
    build:
      context: .
      args:
        CIRIS_SERVER_VERSION: ${CIRIS_SERVER_VERSION:-0.5.113}
    command: ["python", "/opt/harness/agent_boot.py"]
    depends_on:
      canonical:
        condition: service_healthy
    environment:
      <<: *test-anchor-env
      CIRIS_HOME: /var/lib/ciris
      CIRIS_KEY_ID: ciris-agent-harness-1
      CIRIS_EDGE_LISTEN_ADDR: "0.0.0.0:4242"
      # Dial the canonical container by service name on the shared bridge.
      CIRIS_EDGE_BOOTSTRAP_PEERS: "canonical:4242"
      CIRIS_AGENT_MODE: server
      CIRIS_FEDERATION_DELIVERY: "true"
      RUST_LOG: "info,ciris_edge=debug,reticulum_core=debug"
    networks: [mesh]
    tmpfs:
      - /var/lib/ciris

networks:
  mesh:
    driver: bridge
