ntityOccurrence coordinator per peer (the plane was never exchanged — only Attestation+Key) so anti-entropy carries occurrences both ways; (2) start_replication_runtime passes an occurrence_selector yielding the node key_id (publish-own). DIVISION (agent=node=one keypair): the AGENT derives the node content-enc keypair from the node Ed25519 seed at mint, publishes its self-occurrence via put_identity_occurrence, and uses the private halves in federation_session_respond; the SERVER only replicates (never holds content-enc keys / never seals). Once both ends run this, the agent resolve_peer_kex_pubkeys(canonical) flips None->Some, the trace seals, envelopes_sent>0. Arc: rootable(#397)->auto-dial(#296/#404)->survives-restart(#411/#299)->first-rootable(#301/#413)->agent-fold(#221)->advisory-durable(#416)->canonical-prime(0.5.98)->occurrence-KEX(#305). === PRIOR === 0.5.98 = CEG-NATIVE TRUSTED-PEER BOOT PRIME (CIRISServer#221 companion) — roots the explicit-hash canonical for OUTBOUND delivery. NO substrate change (edge v9.6.1 / persist v13.9.1 / verify v8.10.1 held); server-only. RCA: the explicit-hash canonical (ciris-canonical-1, v7.0.0, Leviculum ExplicitHashCannotAnnounce) is the OUTBOUND target the node dials at :4242 — it never self-roots via the inbound admit-advisory path (#301), so it must be rooted out-of-band via prime_peer. start_federation_delivery primed it on the embedded edge, but compose::serve_with_adapter (the seam the agent fold #221 runs) never did → in the folded node knows_peer(canonical)=false → anti_entropy_round coordinator error → envelopes_sent=0 (field-reported). FIX: compose now runs prime_trusted_peers on boot — CEG-native, NO hardcoded canonical: it primes EVERY transport_destinations row with BindingProvenance::Rooted (authoritative — federation-key-signed occurrence / root_binding-verified / self-published/replicated). Advisory rows (#301, routing hints) are skipped; an operator who untrusts a canonical/community withdraws the row → not