version = "0.5.186" # 0.5.186 = THE ADOPTION THAT CHASED THE AXIS TO ITS LAST DOOR. SUBSTRATE: persist v38.0.0 -> v38.2.0 (BOTH #760 asks shipped — signed-envelope cohort target at the write door + the decided chat:* registry row; put_community verdicts: identical re-put = Ok NO-OP, differing roster = typed Conflict/fork signal — our poisoned-roster 409 stays as defense-in-depth ABOVE that door, and the concurrency test re-pointed to the invariants: one room, one roster, first-accepted authority signature preserved, BOTH arrivals may honestly say freshly_created), edge v18.3.0 -> v18.4.0 (#522 door adoption; #523 person/node serve widening via owner_of + OwnerCache; #524 diagnostic half — the withhold WARN names its peer and the send-set size). ZERO source breaks from the jump itself (the E0308s were a duplicate-crate graph from a missed lens-core pin). FIVE SERVER FIXES, each one layer deeper than the last, every mechanism ladder-measured: (1) #472 grants resolve the CONTACT to their BOUND NODE (persist nodes_stewarded_by, filtered to NODE-role transport subjects — it deliberately includes U itself and U's phone, and owner_of walks only delegates_to, so an unfiltered grant listed the phone as a phantom contact); (2) a reconcile-tick CONSENT HEALER closes the add-before-binding race (add_contact at t=peering+e resolves nothing; the tick is idempotent and re-resolves every 30s); (3) the coordinator set is TRANSPORT-ONLY (a person-subject grant spawned six dialers for a key with no destination — measured as not-rooted WARN spam + §24 queue growth feeding edge#373 backpressure); (4) DEFAULT_GRANT_ATTESTATION_PREFIXES gains self:delegates_to: — owner-bindings RIDE THE ATTESTATION PLANE under that prefix, and without it in the default grant NO node ever served ANY binding: every person->node resolution walk on every other node starved one hop out; (5) the publish-own set names the node AND ITS RESOLVED OWNER (self-projected planes advertise only their own attester's rows; the owner-binding is attested by the USER key, so with only the node key in the provider every node kept its owner's records to itself — the last closed door before the wire). RESULT, measured: signer IS the attester; ALL THREE owner-bindings replicate; zero withholds; THE MESSAGE CROSSES THE WIRE — and is refused at v38.2's community door: scope_no_community_membership, class=retry_after_community_roster, A TRANSIENT THAT NEVER TRANSITIONS, because writer_admission resolves the OCCURRENCE axis (self-referential identity==occurrence==node, the #454 sealing shape) and never walks the delegates_to owner-binding where the node's authority actually lives. THE LAST SEAM = CIRISPersist#765 (resolve via occurrence OR owner_of — one accessor, one call away, the gap between #760's "AV-84 through ACTIVE bindings" sentence and the shipped resolution). The roster's residual is CONGESTION not policy (frames delivered then dropped at edge#373 channel-full; no refusal ever logged). AND THEN IT FLIPPED, same branch: persist shipped #765 as v38.3.0 and edge v18.5.0 (e86bcf9) carried the send-set person-resolution — the re-adopt cost ZERO breaks, and the ladder came back ARRIVED=1 HAMBURGER=1 on fresh state, twice: A's bytes in B's transcript with attester=the node and author=the owner VERIFIED ON THE REAL RECEIVE PATH. XFAIL_arrived and XFAIL_hamburger DELETED (required stages now); the success banner earned its held-back sentence; the stage-3 probe re-pointed to resolution-aware coverage (a routable contact grant names the bound NODE). ONE declared transient remains: one_sided (roster convergence races edge#373 backpressure in the bounded window — congestion, not policy, no refusal ever logged). ALSO: codex sweep 6 (all 8 fixed — conformance require_op wired on chat writes with a source-scoped pin; a committed consent widening never reports failed; the double money-grant claimed synchronously; contacts/chat follow the ACTIVE node not compile-time localhost — 15 refs, surgically, after a 107-ref first attempt was reverted; the session-epoch leak class closed in a third ViewModel; HA ingress sessions get the Fed-ID catch-up; the notifier cap bounds resolved garbage never pending truth) + iOS LogTail tail-read FIXED AND TESTED ON THE REAL macos-14 TOOLCHAIN (the extract-verbatim gate pattern in Swift, closes #473) + drift #34 (NFC manifest) + #35 (the Cargo-derived native package version — the re-vendor hardcoded "2.9.28", the SECOND time this defect shipped from a vendor sync, and MSI would refuse the next real 1.5.x as a downgrade). PyPI: the 10 GB TOTAL-project quota is the binding ceiling now (~19 releases fill it; 0.5.185 shipped half-published until the operator deleted old releases and skip-existing completed it — check headroom BEFORE tagging). PRIOR CUT (0.5.185) FOLLOWS: 0.5.185 = CONTACTS, USER CHAT, AND THE 2.9.28 RE-VENDOR — chat COMPLETE ON-NODE, cross-node delivery HELD one seam short and the seam is NAMED (#472). A contact IS a consent:replication:v1 grant; a chat IS a 2-member community with a DERIVED convergent id (chat:pair:v1: + sha256 of the sorted pair) so both nodes find the same room with no coordination; a message IS an attestation at the community tier rendered through the ONE CEG hamburger. THE ATTRIBUTION RULING, corrected twice by the substrate itself: a community-scope attestation is NODE-SIGNED BY CONSTRUCTION on persist v38 (put_attestation refuses every community row at the write gate — claimed_target_id=None can never membership-validate; promote re-seals with the engine), so messages ship in the CC-§8.1.12.7 on-behalf shape: the NODE attests (signer==attester passes every peer gate — LADDER-PROVEN, "signer IS the attester"), the SIGNED envelope carries on_behalf_of_key_id naming the human, the projection gains author (mine follows AUTHOR, never the attester — one field one question), and the exercised authority is the replicated INFRA owner-binding because CC 4.4.3.4.3 CRYPTOGRAPHICALLY forbids agency scopes on node-only keys (check_node_agency_admission refused our first attempt, correctly — the upgrade signer is the owner APP OCCURRENCE, the brain holds agency, the node stays infra). CONSENT: #458 BOTH WAYS — the guard answered "does a row EXIST" where the question was "is consent LIVE": narrow grants now WIDEN (grant-first-then-supersede, order load-bearing) and a withdrawn grant no longer poisons re-consent (A RIGHT YOU CANNOT AFFORD TO EXERCISE IS NOT A RIGHT). One folded door (standing_live_grant + live_grant_prefixes) feeds every reader; GET /v1/contacts TIGHTENED to peers you can actually MESSAGE. AUTHZ: every chat route names a capability verb — ChatAuthor NEVER-delegatable in the enum (a delegated signature outlives its delegation, #342 class), ChatRead/ChatCreate split so "read my messages" is grantable without "speak as me"; the wiring found POST /v1/contacts emitting the peering object with NO verb — closed. Concurrent room creation is an idempotent success (mutation-proven against the REAL race). THE ROSTER replicates (Community + MembershipRevocation coordinators, boot AND reconcile collapsed to one list — killing a three-claimed-four inline drift); StructuralPlane means zero consent-object changes. THE MESH LADDER (scenarios/chat.sh, 9 stages, 3 containers, CI matrix beside traceflow, CHAT_NODES parameterized for voting/video scale-out): 1-6 GREEN, dark GREEN (cohort projection holds against the best-positioned observer), arrived/one_sided/hamburger RED-EXPECTED with the MEASURED mechanism verbatim — the send-set names the contact PERSON, transport routes NODE keys (#472, the 0.5.186 headline; the XFAILs delete in the change that greens the stages). THE PERSIST ASK, exhaustive and evidence-backed: (1) cohort target through the write gate OR signature-preserving promote (owner-signed fidelity upgrade); (2) ONE decided chat:* registry row + bless on_behalf_of_key_id into the superset. Checked non-asks recorded: roster needed no persist change, subject-Pull recovery unaffected. CLIENT: re-vendored at agent 2.9.28; the three-way census (1683 files, 61 overwritten) recovered TWENTY-ONE drift restorations #11-#21/#23-#34 (#22 verified staleness, deliberately unburned) — the node launcher, OAuth claim adoption, USB inspect-then-confirm, EDT choosers, confer_duty (unreachable!), the NFC manifest block (YubiKey ceremonies), DirectoryPickerPurpose (the genesis-seed save was getting the USB chooser). Codex swept the PR FIVE times, 36 threads, ALL answered with fixes or filed deferrals (#466/#467/#468/#469): the wrong-room send closed TWICE (singleton reset + entryEpoch — a message is an attestation, there is no unsend), WA budget erasure (validateGrant against null headroom = silent no-op on the consent dialog precondition), defer/grant re-notify (3 sites), notifier first-use race (mutex, proven with a store that actually suspends), zero-request over-grant REJECTED, fixed-point money cannot wrap Long (exact bound, not a digit count), a recorded grant is never reported failed, cross-user approval-state leak on logout, HA ingress sessions get the approval watch, Play Integrity found posting to a dead port (#468). LOCALIZATION: 8 new keys in ALL 29 languages (localize-ui fan-out + one hand-translated after the session ceiling), check_localization_sync --strict FULLY GREEN, 0 drift over 107,380 compares; upstream inherits the WA/approvals fixes (anchors recorded in-file, #1086 pattern). SUBSTRATE UNMOVED: persist v38.0.0 / edge v18.3.0 / verify v13.6.1 / leviculum v0.23.0+ciris.1. PRIOR CUT (0.5.184) FOLLOWS:  0.5.184 = NO NODE WAS SEALABLE, AND EVERY TEST PASSED — plus #342, the owner-signing capsule the auditor review needs. #342 THE OWNER CAN NOW SIGN, WITHOUT THE KEY EVER LEAVING. The Engine could resolve the owner and sign as the NODE, but not sign AS the owner — so an agent recording a human authorization could not put the authorizing human's own signature on it. The shipped approximation was delegate-signs / record-names-the-root, which is a real delegation chain but cannot show an external reviewer the owner's OWN signature, and that is the difference an auditor asks about. owner_signer_capsule::acquire runs the HTTP owner gate's checks and then goes through compose::resolve_user_signer — the ENFORCED choke point — rather than reaching for the seed, so there is still exactly ONE place the fed-ID is released. The capsule holds the signer privately and offers one verb: sign these bytes. No accessor, no Deref, no Serialize; a source gate fails if any appears. It does NOT canonicalize for the caller — a signer that reshapes its input decides what was signed, and the point is that the bytes an auditor verifies are the bytes the caller meant. A DELEGATE MAY NOT OBTAIN IT: resolve_bearer hands a dgrant: token the owner's role AND FullAccess by design, so role alone cannot tell the owner from someone acting for them; the actor check runs FIRST so the strongest condition cannot be lost to a reordering. Both mutations proven to red — deleting the guard, and swapping the order. THE GATE FOR THAT WAS WRONG FIRST AND IT IS RECORDED: it searched the whole FILE for the guard, which also appears in the module doc explaining the rule, so deleting the real check left the prose and the test passed. It measured the comment describing the check. Now scoped to acquire()'s body. — plus the leviculum v0.23 adopt that ends the #508 arc. SUBSTRATE: edge v18.2.0 -> v18.3.0 (9686141), persist v37.1.0 -> v38.0.0, leviculum v0.20 -> v0.23.0+ciris.1, verify v13.6.1 unmoved, SERVE_ADVERTISE_POLICY_HASH unchanged from v18.2.0. THE LIVE-LINK EVICTION IS GONE: leviculum v0.23 contains ZERO occurrences of "evicted live link", the warning that ran continuously on the wedged production canonical (CIRISEdge#508 / leviculum#56-#59). v0.20 still had it — 0.5.182 and 0.5.183 carried the flood fix but not this, and the commit messages said so. This is the cut where the mechanism is actually fixed rather than given headroom. NO RE-GENESIS ACROSS THE v38 MAJOR EITHER: genesis_bundle_validate passes 7/7. persist#748 removed recursion_depth from trust_score — checked, and it does not reach us: this tree implements no TrustScoring and names neither symbol. Two v38 breaks, both small and both meaning something: peer_quota.observation stopped being Copy (borrow, never consume, when READING a cause off a state), and remove_peer_record now demands a `reason` and the delegation acted under — peer removal is an accountable act, so the test says why rather than passing a blank string into an audit trail built to carry meaning. #454 — publish_self_identity_occurrence signed an envelope carrying identity_key_id, occurrence_key_id, transport_destination, encryption_pubkeys and asserted_at, but NOT attesting_key_id. That value was set as a top-level field on SignedIdentityOccurrence instead, so the SIGNATURE NEVER COVERED IT. ciris-verify-core has required it inside the signed bytes since v13.1.0, and refused every publish: "signed bytes do not carry `attesting_key_id` — refusing, an absent binding is skippable by omission". The node then logged "peers cannot seal to this node until it is admitted". FOUND IN PRODUCTION ON BOTH NODES: the canonical AND ciris-status, zero successful publishes, one refusal each per boot. NOT A REGRESSION from the substrate jump — verify v13.1.0 introduced the requirement and we were on v13.3.1 before 0.5.182, so this had been failing on every boot since whichever cut first pinned v13.1.0+. The operator's read was right and my first framing was wrong to imply otherwise. WHY IT SURVIVED, AND THE PART WORTH KEEPING: tests/occurrence_kex_e2e.rs BUILT ITS OWN ENVELOPE — and its copy INCLUDED attesting_key_id. Its comment says it does "what compose::publish_self_identity_occurrence does at boot". It did not. A correct re-implementation sat beside a wrong producer and went green for months. That is precisely the failure this tree wrote down in oauth_state_matrix.rs the same week: a matrix that mocks the thing under test proves the mock. THE FIX IS STRUCTURAL, not the one line: self_occurrence_envelope() is now the ONE builder, called by the producer and by the test through test_support_self_occurrence_envelope. The test can no longer be right while production is wrong — that difference is the only thing worth testing. The new gate asserts our envelope against verify's OWN projection (TransportBinding::subject_binding(), which verify exposes for exactly this), never a hand-listed key set that would keep passing the day verify adds a third requirement. Mutation-proven: removing the key reproduces the live error verbatim — Err(Missing { context: "transport binding", member: "attesting_key_id" }). NOTHING FAILED WHILE THIS WAS BROKEN. The node booted, served HTTP, answered its health check and replicated. It simply never published the row that lets peers seal to it, and said so in one WARN per boot among thousands of lines — the silent-consequence shape of #365 (nine mesh_config keys, zero consumers): operable, and not EFFECTIVE. Substrate unmoved: persist v37.1.0 / edge v18.2.0 / verify v13.6.1. PRIOR CUT (0.5.183) FOLLOWS: EDGE v18.2.0, AND SCOPE-NATIVE ADDRESSING IS ARMED. The adopt in CIRISServer#451 turned out FAR smaller than the issue assumed: it says "server is currently at edge v16.1.0 / persist v31.2.0", written before 0.5.182 landed, and v18.2.0 pins the SAME persist v37.1.0 and verify v13.6.1 we already carry — so this is an EDGE-ONLY hop, v18.0.2 -> v18.2.0. v18.1.0 was never tagged. (A) SCOPE-NATIVE ADDRESSING ARMED. Group addresses derive from directory state and are NEVER announced (CC 5.4.6, default-deny for unregistered destinations). Edge ships the scope gates DEFAULT-OPEN and is explicit that the arming event is the SERVER's call — so leaving it unarmed was itself a decision to keep every scope addressed by one linkable sha256(fed_pubkey)[..16]. THE TRADE IS REAL AND THIS NODE IS ON THE PAYING SIDE: a node that is NOT federation-visible is point-to-point anyway and gains unlinkable per-context addresses for free, while a VISIBLE node — this one — moves its scoped flows off the federation plane onto one-hop delivery. That is why edge keeps this separate from federation_visible rather than riding it. Armed deliberately because the fleet upgrades together before trace testing, so no window exists where an armed node and an unarmed peer disagree about where a scoped flow is addressed. Convergence = edge's DEFAULT_CONVERGENCE_WINDOW (300s), taken rather than invented because we have no measurement to justify a different number. (B) SERVE_ADVERTISE_POLICY_HASH mirrored 328d73b0 -> 20499cab...f22d74, which clears the 6 cohab conformance jobs red on server-skew since v16.3.0. Edge's account is that the manifest now states the TRUE constant projections for five planes and no serve behaviour moved — the manifest stopped lying. That is also what a genuine relaxation would look like if someone edited a manifest to match a change they had already made, so the E3 invariant was re-checked DIRECTLY against edge's source rather than trusted: serve_policy.rs still reads "trace:* -> capability:infra:serve; else public". (C) HYBRID IS NOW MANDATORY BY TYPE. PeerKexPubkeys::mlkem768_pub stopped being Option (CIRISEdge#458), so a classical-only peer is no longer EXPRESSIBLE — the retirement moved from a runtime refusal to a type-level impossibility. OwnKexKeys keeps its Options (a node may lack its own PQC half); the asymmetry is the point. Two refusal tests were RE-POINTED rather than deleted: an EMPTY key is the closest still-expressible case AND the shape an attacker actually has (they cannot delete a wire field, only strip its bytes). Their assertions widened from the exact variant to the two safe grounds, because pinning the variant redded them for a change that STRENGTHENED the guarantee — which is how a safety test gets deleted for being noisy. (D) #450 RESOLVED BY FORCE: the bench's classical arms are gone. They were the overhead-comparison BASELINE, and a baseline that cannot run is not slow — it is a comparison against something that no longer exists. Hybrid numbers stand as absolute cost, the only honest framing once there is one algorithm. NO UI for any of this, per the plan: wire and prove, consolidate UI after the agent adopts. PRIOR CUT (0.5.182) FOLLOWS: THE SUBSTRATE JUMP AND THE SIGN-IN MATRIX. (A) SUBSTRATE: persist v32.3.0->v37.1.0, edge v17.4.1->v18.0.2, verify v13.3.1->v13.6.1, carrying leviculum v0.16->v0.20 (where the completion-mirror + lock-contention work behind the live-canonical wedge lands, CIRISEdge#508 / leviculum#56-#59). NO RE-GENESIS: both re-genesis mentions in persist v37 are GUARDS not triggers, accord_root is write-door-only, no signature preimage moved — and genesis_bundle_validate passes 7/7 on the new triple. Persist independently re-validated on BOTH backends and FALSIFIED it (one flipped base64 char in the charter signature reds the install gate), and established the span is v31.2->v37.1, correcting our own recalled estimate. 30 new WithholdReason variants classified across Policy/Fault/Integrity from edge's documented semantics — the load-bearing line being "I cannot judge" (Fault) vs "the signer is not seated" (Policy), which CIRISPersist#713 wrote a mutation to protect. --lib was GREEN while --all-targets was RED on the NAT fixture, exactly the trap v37's changelog documents. (B) #448 A PRE-PROVISIONED HUMAN IS NOT A STRANGER. resolve_oauth_user matched only (provider, external_id), so a person an owner ADDED IN USERS was refused on the node they were added to — the node ignoring its own operator. An owner knows an ADDRESS and can never know a Google `sub`. An active cert carrying that email with no pair yet is now a provisioning slot: the verified pair is stamped on first sign-in and the weaker handle stops being load-bearing. THE SECURITY LINE DID NOT MOVE — this matches an email an OWNER WROTE onto a cert, never one a caller asserts; an unprovisioned address still matches nothing, a cert already naming an identity can never be rebound by address, and two slots for one address refuse rather than pick. (C) #432 CLOSED FROM THE DIRECTION THAT WORKS. POST /v1/self/oauth-link was not merely uncalled, it was UNCALLABLE: it demanded an external_id no human can look up. It now accepts an EMAIL and has a real client caller (preprovisionOAuthEmail). The generated UsersApi path /v1/users/{id}/oauth-links is the AGENT's spec surface and was never ours to route. (D) THE REMEDY SENTENCE IS BACK, and ONLY because the action now works — it came out at 0.5.177 because naming an impossible remedy is the #387 lesson. If that path is removed, the sentence comes out in the same commit. (E) tests/oauth_state_matrix.rs — 15 rows over a SYNTHETIC provider driving the real router, real resolve path, real store. MANAGED NODES ADMIT ANYONE AS AN OBSERVER and that is now pinned by ROLE, not just by admission: mutating determine_role to Authority reds both managed rows. The managed logic is CORRECT in code, so a managed deployment that refuses is an is_managed() DETECTION fault — it is a majority-of-five needing TWO indicators, and a container setting only CIRIS_MANAGED=true is still classified personal while looking configured. Two of my own defects are recorded in the file: CIRIS_MANAGED is process-global and leaked across rows (three refusals red, the email row GREEN — the pass being the dangerous half), and two adjacent &str params in authorize_url were swapped, which compiled perfectly and put the redirect_uri where the state belonged. PRIOR CUT (0.5.181) FOLLOWS: A CHECK THAT CANNOT FAIL READS AS CONFIRMATION. Four changes, one theme. (1) #445 A BROWSER SIGN-IN COULD STILL NOT COMPLETE, and the cause was ONE LINE in /login: `Some(redirect_uri).filter(|r| r != "/")` collapsed TWO states onto None — "no redirect_uri given" and "the destination IS the site root" — and the callback reads None as "serve the desktop hand-off page", which is LOOPBACK-ONLY. A plain /login is the front door of every managed deployment, so the arm that broke was the NORMAL case, not the stray one: authentication succeeded every time, the session was parked where the browser could not reach it, and ZERO redemption codes were minted in six hours on a node answering web_signin:true. Now collapsed only when app_nonce is present (a desktop app polls the loopback hand-off; a redirect to / would be noise). Deliberately NOT keyed on ConnectInfo: a managed node behind a reverse proxy sees the PROXY's loopback address, so "is this caller local" is unanswerable at the callback — it is answerable at /v1/auth/signin-state, where the caller connects directly, which is why session_delivery lives there. Every existing test drove the flow with an explicit redirect_uri; there was a D3 case for /dashboard and NONE for the front door. (2) #445 THE LOG LINE THAT SENT THE REPORT UPSTREAM. "NO app_nonce: … a stray tab … claimable only via the loopback-gated recent slot" diagnosed the CALLER instead of describing the flow, and led a careful reader to the wrong branch entirely — the callback never branched on app_nonce at all. It now says what actually happens. (3) #352 THE EVIDENCE MANIFEST PARSED AS ZERO COVERAGE — the same defect class, in the compliance layer. The Constitution's check_claims.py strips # lines and hands the rest to csv.DictReader, which took our first DATA row as the header; every later row then lacked a decimal_id and was SILENTLY skipped. Vendoring the file added a manifest that resolved nothing and reported nothing. Now emits the canonical header row, spelled EXACTLY as CIRISPersist spells it (decimal_id, not our comment's older cc_section) because the consumer keys on those names and two spellings is how two files drift. 0 usable rows -> 12, all with decimal_id. (4) THE RELEASE GATE NOW DRIVES THE FRONT DOOR, because #445 WOULD HAVE PASSED IT AS WRITTEN — it asserted the surface SHAPE (web_signin is present) and never that a browser can actually sign in. Two of its own drafts failed before it worked, both recorded because they are the same disease: under set -euo pipefail a grep matching nothing killed the script mid-assignment so it printed NOTHING and read as a pass; and the first working draft reported a 200 from /login as "skip — no provider configured" and exited 0, which would have passed the very release it was written for. It now asks the providers list to tell an unconfigured node from a broken one. All four branches exercised: healthy redirect passes, the #445 shape FAILS, nothing-listening FAILS, genuinely-unconfigured SKIPS loudly. Substrate unmoved: persist v32.3.0 / edge v17.4.1 / verify v13.3.1. PRIOR CUT (0.5.180) FOLLOWS: THE GATE THAT BROKE A RELEASE, FIXED. THE 0.5.179 GITHUB RELEASE IS INCOMPLETE (27/30 assets, zero linux-x86_64) AND THIS CUT REPLACES IT. Its PyPI wheels published fine (9 files), so pip users were never affected; anyone pulling the linux binary from the GitHub release was. CAUSE: the release-surface gate I added in 0.5.179 failed the linux lane on a bug of its OWN. It discovered the port by grepping the boot log for listen_addr. That was wrong TWICE: (1) the node's stderr is BLOCK-buffered into a file, so while the process LIVES the log is EMPTY — the gate only ever "worked" locally because the node CRASHED there, and exiting flushed the buffer; its happy path had NEVER ONCE EXECUTED and it was wired to fail the build regardless. (2) net.listen_addr (:4242) is the RETICULUM transport; the node's entire HTTP interface is :4243 (compose.rs — "this one listener also carries /v1/identity, auth, setup/claim, config, ingest"). FIX: no discovery step remains — readiness IS the endpoint under test answering, with stdbuf keeping the diagnostic log usable while the process lives (0.5.179 reported an EMPTY log, which is why nothing could be diagnosed from it). WHILE TESTING THE FIX THE GATE CAUGHT ITSELF COMMITTING #410: a fake binary that died instantly still "verified", because an UNRELATED node was already serving :4243 and answered the readiness probe. A 200 from a port is not proof it is YOUR node — in CI that silently greenlights a broken artifact against someone else's healthy one, the worst possible failure for a gate whose whole job is proving what THIS build serves. Now nothing may already answer before boot, and our PID must still be alive when it does. ALL FOUR BRANCHES ARE NOW EXERCISED: happy path (exit 0), assertions bite (exit 1 against a live 0.5.173 node lacking the fields), stranger-on-port (exit 1, 0s), boot-death (exit 1, 1s, log actually dumped). ONE branch still cannot be tested off-CI — a real binary booting and serving — because the dev host holds 4242/4243. So the step is REPORT-ONLY this release: blocking on a branch that has never run is precisely what produced 0.5.179. Its job now is to ANSWER whether the shipped artifact serves web_signin and managed, which the release log answers either way. Flip continue-on-error off once it comes up green on a real boot. Substrate unmoved: persist v32.3.0 / edge v17.4.1 / verify v13.3.1. PRIOR CUT (0.5.179) FOLLOWS: THE SIGN-IN STATE CUT. (A) #439 A NODE CAN NOW BE ASKED WHAT WILL HAPPEN BEFORE YOU WALK INTO IT. GET /v1/auth/signin-state returns claimed / managed / web_signin / callback_base / providers plus new_identity{outcome, reason_id, remedy}. Sign-in has TEN distinct outcomes across desktop, browser, mobile, managed and personal nodes and no client could ask which one it was in, so every surface guessed and guessed DIFFERENTLY: the GUI pattern-matched a hostname, the desktop client asked the BRAIN about a fact only the node holds, a refused user saw a JSON wall or a spinner. The refusals were all CORRECT; what was missing was any way to see the state first. outcome is computed from the SAME two predicates resolve_oauth_user gates on, so it cannot drift from the behaviour it describes. The remedy is asserted PERFORMABLE — the gate fails if it says "link"/"settings", because #432 leaves both link surfaces dead and printing an impossible remedy is the ProviderUnavailable mistake this tree already paid for. (B) ANSWERED FOR THE CALLER, NOT IN THE ABSTRACT. The same node truthfully tells a loopback desktop app and a remote browser different things about how a session reaches them (loopback_handoff vs exchange_code) — collapsing those is HOW the loopback-only parking became invisible to browsers. caller_is_loopback() is extracted from require_loopback so the gate and the thing REPORTING the gate read one predicate. The node-wide facts (claimed/managed/web_signin) are asserted NOT to vary by caller: splitting the axis without that would invite the opposite bug. (C) THE RELEASE NOW ASKS ITS OWN ARTIFACT WHAT IT SERVES. 0.5.178 published and an afternoon went into arguing whether the binary contained web_signin — both sides running `strings`, a PROXY, because nothing could answer the only question that mattered. release.yml built, stripped, signed, uploaded and published without ever asking its output to respond. scripts/verify_release_surface.sh boots the STAGED STRIPPED binary (the exact uploaded bytes) and asserts every documented key on /v1/auth/oauth/providers and /v1/auth/signin-state; a release that cannot serve its own documented surface FAILS before publishing. It earned its place immediately: run against the shipped 0.5.178 binary it correctly reported a boot failure rather than passing silently. (D) CORRECTED: 0.5.178's own note described `managed` as PATH-derived while the code in the same tag used deployment::is_managed(). The note was written before the correction and never revisited — the second consecutive release whose note lagged its code. Substrate unmoved: persist v32.3.0 / edge v17.4.1 / verify v13.3.1. PRIOR CUT (0.5.178) FOLLOWS: THE SIGN-IN CUT. No substrate change (persist v32.3.0 / edge v17.4.1 / verify v13.3.1 unmoved) — every item is ours. (1) #439 A WEB SIGN-IN COULD NOT COMPLETE. The callback redirected the browser to its destination carrying NOTHING: the sign-in had succeeded, the session was parked on a loopback-only route a remote browser cannot reach, and the page could not tell "no session came back" from "the provider refused" — so CIRISGUI reported oauth_failed on a SUCCESSFUL sign-in. The destination now carries a SINGLE-USE redemption code redeemed at POST /v1/auth/oauth/exchange, session in the response BODY. The old contract is NOT restored: a live 24h bearer in a URL lands in history, in Referer, and in every proxy log on the path. A code authenticates nothing alone, dies on first redemption, expires in 60s — the OAuth authorization-code pattern applied to our own issuance. The exchange route is deliberately NOT loopback-gated and the reason is recorded AT the route: the desktop hand-off gives a bearer to anyone who asks so the network boundary protects it; this gives nothing without a 256-bit single-use code, so the code IS the authorisation. Unknown and spent codes share ONE refusal — distinguishing them confirms a real code to a prober. (2) #439 THE NODE STATES ITS DEPLOYMENT SHAPE. CIRISGUI decided managed-ness with hostname === "agents.ciris.ai", so every other hosted node was classified unmanaged and built its API base wrong. A client cannot derive this; the node knows it at boot. /v1/auth/oauth/providers now returns callback_base / managed / web_signin / exchange_query_key, with managed being deployment::is_managed() — an AUTH-POLICY fact (does this deployment admit MULTIPLE logins) and NOT a URL shape. A first draft derived it from whether the callback base carried a PATH; that was a routing question wearing the name of a policy one, and a client-visible LIE, since a path-prefixed personal node would have told CIRISGUI it admits strangers while refusing them. It is the SAME predicate resolve_oauth_user gates admission on, so what a client is told cannot drift from what the node does. Its gate is an INDEPENDENCE, not a value: four callback bases of different shapes must report the SAME posture. (3) #439 FIRST-RUN STOPPED LYING ABOUT A CLAIMED NODE. "Is this a first run?" depends on TWO stores and the client read one — the brain answers from its own config while the NODE knows whether it has been claimed. Observed live: brain setup_required=true beside node setup_required=false with a standing owner binding. The user got the first-run login, a Google sign-in there was correctly REFUSED (auth.oauth.no_local_identity, the owner being a local credential with no OAuth identity), and the node looked broken while being right every time. nodeHasOwner() and its reasoning were ALREADY in the file, in the degrade branches — the happy path was the one place the rule was missing. It now also SAYS so, in all 29 languages. ALSO RECORDED HERE, because 0.5.177 shipped them after its own comment was written: #434 the provider ID TOKEN now reaches the desktop app (Google returns it in the SAME response the node already parsed for access_token; desktop CIRIS_PROXY was configured with an EMPTY api_key via googleIdToken ?: ""), and #435 a deployment can DECLARE its callback base before boot (writing the config key needs an owner session, which needs a sign-in, which is what the key configures — precedence is one-directional: stored config -> environment -> loopback default).
edition = "2021"
# MSRV floor is set by the substrate: ciris-verify v5.2.0 requires 1.86
# (persist v6.0.1 is 1.83). Build with the higher of the two.
rust-version = "1.86"
authors = ["Eric Moore <eric@ciris.ai>"]
description = "The fabric node — the federation's headless cohabitation runtime (registry + lens [+ node] over one shared substrate). agent = fabric node + brain. Shipped as both the ciris-server binary and a PyO3 abi3 wheel CIRISAgent consumes. See MISSION.md."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISServer"
readme = "README.md"
publish = false

# CIRISServer is ONE cohabitation composition in TWO shapes (MISSION.md §1.2/§6):
#   - [lib] cdylib  → the PyO3 abi3 wheel CIRISAgent pip-installs (the agent is
#                     pure Python; it consumes ciris-server, not the cores).
#   - [lib] rlib    → so the ciris-server binary links the same composition.
#   - [[bin]]       → the headless fabric node deployment.
# The composition lives in src/lib.rs; src/main.rs is a thin entry point.
[workspace]
# lens-core is absorbed in-tree (CIRISLensCore repo retired); the root package
# composes it as a path dep. node-core folds in here the same way at Server 1.0.
members = ["crates/ciris-lens-core"]
resolver = "2"

[lib]
name = "ciris_server"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ciris-server"
path = "src/main.rs"

[features]
# pkcs11 (the YubiKey / PKCS#11-PIV custody backend) ships in DEFAULT so the
# published wheel + the `ciris-server` binary carry the hardware fed-ID + accord
# custody path out of the box (no special build). `python`/`extension-module` are
# deliberately NOT default — the binary must never link libpython; maturin turns
# them on for the wheel (pyproject [tool.maturin]). TPM/postgres hardware backends
# are auto-on per-target on Linux (see the [target.*] tables below).
default = ["pkcs11"]
# HARNESS-ONLY: forwards to verify-core's test-anchor. Feature unification then
# applies it to the ONE verify instance persist's root_binding uses, so a SW
# test root can anchor the local mesh. NEVER in the prod wheel (CIRISServer#258).
test-anchor = ["ciris-verify-core/test-anchor", "ciris-persist/test-anchor", "ciris-edge/test-anchor"]
# `python` pulls the PyO3 bindings (for the wheel). The binary builds WITHOUT it,
# so a plain `cargo build` never links libpython.
# ONE-WHEEL RE-EXPORT (CIRISServer#4): `python` ALSO turns on the substrate
# crates' OWN pyo3 surfaces (`ciris-persist/pyo3`, `ciris-edge/pyo3`) so their
# `#[pyclass]`es compile into THIS cdylib — one `.so`, one PyO3 type registry,
# so the persist `Engine` handed to edge is the SAME type both sides see (the
# CIRISPersist#109 cross-wheel type-identity bug CANNOT occur). persist names its
# feature `pyo3` (not `python`); edge likewise, and edge's `pyo3` already pulls
# `ciris-persist/pyo3` transitively — both listed for explicitness. verify is
# deliberately ABSENT: it is a ctypes wheel (libciris_verify_ffi.so via
# ctypes.CDLL), not a `#[pymodule]`, so it cannot be a pyo3 submodule.
python = [
    "dep:pyo3",
    # Fold the verify FFI C surface into `_native.so` (CIRISServer#232) — only the
    # wheel the agent loads needs it, so it rides the `python` feature, not the bin.
    "dep:ciris-verify-ffi",
    "ciris-lens-core/python",
    "ciris-persist/pyo3",
    "ciris-edge/pyo3",
]
# `extension-module` is what maturin builds the wheel with (tells PyO3 not to
# link libpython). The bin must NOT enable it. See pyproject.toml [tool.maturin].
# Propagated to the substrate crates so THEIR pyo3 surfaces also skip linking
# libpython (each crate gates `extension-module` as its own feature).
extension-module = [
    "python",
    "pyo3/extension-module",
    "ciris-persist/extension-module",
    "ciris-edge/extension-module",
]
# `pkcs11` turns on the YubiKey (PKCS#11 / PIV) custody backend for the USER
# federation identity (`ciris-server identity create --backend pkcs11`). OFF by
# default: a plain `cargo build` never links `cryptoki`, and the Pkcs11 backend
# honestly returns NotSupported without it. It flips `ciris-keyring/pkcs11` on
# (operator hardware; Linux). The YubiKey path is hardware-validated by the
# operator — there is no token in CI, so it is gated + flagged, not unit-tested.
# Like the per-target `tpm` posture, it is NOT in `default`; build it explicitly
# (`--features pkcs11`) on a Linux box with a token attached.
# `pkcs11` (the YubiKey custody path) pulls `ciris-keyring/pkcs11` directly and
# GLOBALLY: CIRISVerify v6.12.0 made cryptoki build on ALL targets (feature
# parity), so it no longer breaks the macos/android/ios wheels. The ciris-server
# pkcs11 source compiles wherever this feature is on (gated on `feature = "pkcs11"`,
# no target_os restriction). At runtime a target with no PKCS#11 module (e.g.
# android, which reaches a YubiKey over NFC via YubiKit instead) returns
# NotSupported — present everywhere, hardware-validated where a token is attached.
pkcs11 = ["ciris-keyring/pkcs11"]
# NOTE: hardware key custody (TPM/SE/StrongBox) is wired per-TARGET below, not as
# a cargo feature — TPM (tss-esapi) is Linux-only, so a top-level `tpm` feature
# made `--all-features` drag tss-esapi onto Windows/macOS (where it can't build).
# The `[target.'cfg(target_os = "linux")']` table enables keyring/tpm + persist
# postgres on Linux only; runtime auto-detects hardware and degrades to encrypted
# software when absent (`is_hardware_backed()` reports the posture). This mirrors
# the substrate crates' per-target keyring/postgres gating.

# ----------------------------------------------------------------------------
# Dependencies — CIRISServer AUTHORS NO PRIMITIVES. It composes the core
# libraries over ONE shared persist Engine (registry + lens read/write the same
# corpus in-process; per-slice views via Engine::from_shared).
#
# Substrate floor (SHIPPED): persist v8.6.0 / edge v4.5.0 / verify-family v5.11.0
# (ciris-keyring + ciris-crypto + ciris-verify-core), CEG 1.0-RC12. The composition
# root pins the singleton construction; the in-tree ciris-lens-core co-bumps in
# lockstep (MAJOR caret pins persist "8" / edge "4"). edge v4.2.0 ships the relay
# outer-open primitive (`open_av_outer`, CIRISEdge#149) → multi-tier ALM chains
# (benches/alm_chain.rs). All additive; no composition-root API change. pyo3 0.29.
# ----------------------------------------------------------------------------
[dependencies]
# Pinned to the SAME minor persist uses (its Cargo.toml: h3o = "0.7") so the
# lockfile resolves ONE h3o. Two versions would mean two CellIndex types and a
# cell this crate mints could fail persist's own parse — the duplicate-dep
# shape the 2026-07-03 audit flagged, in the one place where it would surface
# as a signed row persist refuses.
h3o = "0.7"
# The composed cores (authority + observation; node folds in at Server 1.0).
# ciris-registry-core — re-added at Server 0.5, co-bumped to the 6.6/edge-3.2 floor
# (CIRISRegistry#76). Held OUT of the 0.1 graph: registry-core@main still pins the
# OLD floor (persist 5.5.5 / edge 2.2.2 / verify 5.1.3) and would drag a second
# persist+edge rev into the build. The compose_registry() scaffold stays in
# src/compose.rs; this dep returns once registry co-bumps.
ciris-lens-core     = { path = "crates/ciris-lens-core" } # ABSORBED in-tree (workspace member); CIRISLensCore repo retired
# ciris-node-core   — folds in at Server 1.0 / agent 2.9.10 (a substrate gen behind: persist 4.10).

# The substrate trio (also pulled transitively by the cores; pinned here so the
# composition root owns the singleton construction).
# sqlite on all platforms; postgres is Linux-only (libpq/openssl don't link
# cleanly on the macOS/Windows runners — same posture as persist's own CI). The
# `[target.linux]` table below adds postgres.
# `cirislens_wa_cert` + `cirislens_service_token_revocation` expose the auth
# substrate the fabric absorbs (CIRISServer#9, src/auth): the agent's `wa_cert`
# table (users/WA/OAuth/api-keys) + the `revoked_service_tokens` table.
ciris-persist     = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v38.3.0", features = ["sqlite", "scrub", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
ciris-edge        = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v18.5.0", features = ["transport-reticulum", "transport-http", "transport-packet-radio", "ffi-uniffi"] }
# Founder-quorum verification + key-id fingerprint at the composition root
# (threshold:: module path — NOT re-exported at the crate root).
# LOCKSTEP: persist v9.4.0 transitively pins verify-core v6.6.x — the whole
# verify family (verify-core/keyring/crypto) MUST ride the SAME tag or cargo
# resolves two ciris_verify_core crates with incompatible ThresholdMember/keyring
# types. v6.6.1 (CIRISVerify#89) adds the create_federation_identity `seal_alias`
# arg the #247 user-key-derived fix consumes. (6.4–6.6 are HUMANITY_ACCORD + STH
# stack — the accord-genesis surface CIRISServer#41 consumes.)
#
# ── THIS PIN IS NOT OURS TO MOVE (CIRISServer#340, measured 2026-08-02) ──────
# The LOCKSTEP note above is stronger than it reads: it is not advice, it is a
# CEILING. persist v24.2.0 and edge v15.9.1 — the LATEST tag of each — both pin
# verify at `tag = "v10.6.3"`, and a cargo git `tag` is part of the SOURCE ID,
# not a semver range. Bumping the verify pins (seven here, three more in
# crates/ciris-lens-core) to v10.9.0 therefore does not upgrade verify; it FORKS
# it — one of them alone is enough. The graph carries two `ciris_keyring` +
# `ciris_verify_core` crates, and every substrate type that crosses the seam
# (`HardwareType`, `PlatformAttestation`, `ThresholdMember`, `SignedCegObject`)
# becomes two incompatible types. Measured: 19 lib + 24 lib-test type-mismatch
# errors, all of the form "expected `ciris_keyring::types::HardwareType`, found
# `ciris_keyring::HardwareType`".
#
# There is no in-repo escape. `[patch."https://github.com/CIRISAI/CIRISVerify"]`
# is rejected by cargo 1.97 — "patches must point to different sources" — for
# ANY entry on the same canonical URL, `tag` or `rev` alike (probed, not
# assumed). `[replace]` requires an identical version and 10.9.0 != 10.6.3. The
# only honest fixes are upstream: persist and edge repin verify, then we follow.
# Until then this line moves ONLY as part of a persist+edge co-bump.
#
# What that ceiling costs us is recorded where it bites, not here:
# src/hardware_attestation.rs (CIRISServer#339 / CIRISVerify#199).
ciris-verify-core = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1" }
# The hybrid crypto primitives (Ed25519 + ML-DSA-65 software signers) — used by
# the portable software identity occurrence to build a `HybridSigningIdentity`
# over two software seeds. Same tag as the rest of the verify family.
ciris-crypto = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", features = ["pqc-ml-dsa", "self-enc"] }
# Hardware-backed transport-identity keystore (verify v5.2.0 #68 / edge #99).
# Base = software keystore + byte-identical migration of an existing .rid (works
# everywhere, no libtss2). The real TPM-2.0 / SE / StrongBox backend rides the
# `tpm` feature; runtime auto-detects hardware and falls back to software.
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", features = ["software", "pqc-ml-dsa"] }
# The verify FFI (C ABI) — folded into `ciris_server._native.so` (CIRISServer#232)
# so the agent drops its standalone `ciris-verify` wheel and rides us for verify
# too (kills the v9.0.0-vs-v5.1.3 wire/canonical-hash skew, CIRISAgent#917). v9.0.1
# added `rlib` to its crate-type so we can link it; v9.0.2 added
# `ciris_verify_ffi_link_anchor()` (CIRISVerify#189) — we reference it via `#[used]`
# in src/lib.rs so `--gc-sections` cannot dead-strip the ~84 `ciris_verify_*` C
# symbols out of our cdylib. Same tag as the rest of the verify family → the folded
# FFI version == the bundled substrate version by construction (no skew possible).
# Default features (secp256k1, key-grant, hybrid-kex) + the crypto features unify
# with ciris-crypto's above (self-enc, pqc-ml-dsa) across the graph.
ciris-verify-ffi = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", optional = true }

# PyO3 bindings for the abi3 wheel — optional, gated behind the `python` feature
# so the binary never links them. 0.29 matches the persist/edge family floor.
pyo3                = { version = "0.29", features = ["abi3-py310"], optional = true }

tokio   = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
anyhow  = "1"
fs2       = "0.4"   # available-disk check for realistic-minimum feature gating
# GET /v1/identity (the fabric-node identity surface) — merged onto the lens
# read-API listener. axum pinned to lens-core's 0.8 so the merged Router unifies.
axum       = "0.8"
base64     = "0.22"
serde      = { version = "1", features = ["derive"] } # holonomic scoreboard model (benchmarks::)
serde_json = "1"
# Cosmetic v4 attestation-ids (the content hash is the integrity anchor). Direct
# dep at the same major persist already pins transitively — no new resolution.
uuid       = { version = "1", features = ["v4"] }
# Auth subsystem (src/auth, CIRISServer#9): timestamps on the absorbed wa_cert
# rows, SHA-256 for api-key / service-token hashing, hex for the digest wire form.
# All three already in the lock as substrate-transitive deps (no new resolution).
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"
hex        = "0.4"
# Auth gap-close (CIRISServer#9, src/auth): the byte-compatible password KDF +
# the OAuth/native/device-auth outbound-HTTP + JWKS-verify halves. All already in
# the lock as substrate-transitive deps (reqwest/jsonwebtoken via edge+verify;
# pbkdf2/hmac/ed25519-dalek via the crypto family) — pinned here so the auth
# subsystem owns them directly, no new resolution.
# - pbkdf2: reproduce the agent's PBKDF2-HMAC-SHA256(100k) password hash
#   (auth_service.py `_hash_password`/`_verify_password`) byte-for-byte via
#   pbkdf2::pbkdf2_hmac::<Sha256> — the hmac crate is NOT used directly (#152).
# - ed25519-dalek: verify the ROOT mint signature (the agent's `verify_root_signature`).
# - jsonwebtoken: Apple Sign-In RS256 JWKS verification.
# - reqwest (rustls): Google tokeninfo / OAuth code→token / Apple JWKS / Portal HTTP.
# - urlencoding: build the provider authorize-URL query string (matches urlencode).
pbkdf2     = { version = "0.12", default-features = false }
hmac       = "0.12"  # CIRISServer#394 — the session-token MAC (the agent bcrypt-verifies its API keys; a self-verifying MAC is the stateless analogue)
subtle     = "2"     # constant-time password-hash compare (the agent's hmac.compare_digest)
ed25519-dalek = "2"
# Already in the locked graph transitively (ed25519-dalek, the ML-KEM/DSA stack and
# rustls all pull it); a DIRECT dep so the transient authorizer open in identity.rs
# can WIPE the portable seeds it read rather than trusting the optimizer not to
# elide a hand-written overwrite. Zero new supply-chain surface — same crate, same
# version the lock already pins.
zeroize       = "1"
jsonwebtoken  = "9"
urlencoding   = "2"
async-trait   = "0.1"  # the ProviderClient HTTP seam (async fn in trait)
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Mesh control-plane relay (#128 Phase D, src/mesh_relay.rs): the RNS responder
# dispatches a verified control op into the node's OWN axum Router in-process via
# `tower::ServiceExt::oneshot` (the same-handlers guarantee, RNS_CONTROL_RELAY.md
# §5.4). Already in the lock as axum's own dependency (and a dev-dep) — promoting
# it to a runtime dep adds no new resolution.
tower      = { version = "0.5", features = ["util"] }
# The /v1/federation/events/{channel} SSE bridge (CIRISServer#261,
# src/federation_surface.rs): stream combinators (iter/chain/unfold/map) over
# the edge event-bus broadcast receivers into axum's Sse. Already in the lock
# as axum's own dependency — promoting it adds no new resolution.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2     = "1"     # read the gz'd legacy-trace dump (import-traces subcommand)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking rolling file sink for the node log (so a headless node launched by
# the desktop app logs RELIABLY to <home>/logs/, not just the captured console).
tracing-appender = "0.2"

# Linux-only hardware + Postgres: cargo UNIONS these onto the base deps above.
# - persist `postgres` (libpq/openssl) — Linux deployment + the postgres
#   conformance lane; macOS/Windows stay sqlite-only.
# - keyring `tpm` (tss-esapi / TPM 2.0) — the real hardware backend; needs
#   libtss2 (Linux build dep). Other targets keep the software keystore.
[target.'cfg(target_os = "linux")'.dependencies]
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v38.3.0", features = ["postgres", "scrub", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
# keyring `tpm` (TPM-at-rest, Linux-only via tss-esapi). `pkcs11` is no longer
# per-target — it rides the global `pkcs11` feature now that cryptoki builds on all
# targets (CIRISVerify v6.12.0).
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", features = ["tpm-plugin"] }

# Android (arm64/arm32/x86_64): the keyring `android` backend (JNI → Android
# Keystore/StrongBox); sqlite bundles, no postgres/tpm. Mirrors persist/edge.
[target.'cfg(target_os = "android")'.dependencies]
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", features = ["android"] }

# serialport (the RNode LoRa driver dep, src/radio.rs) pulls libudev-sys on Linux,
# which only resolves where libudev exists: desktop/server Linux (gnu, x86_64 or
# aarch64), macOS, Windows. It does NOT cross-compile for armv7 / musl (no libudev
# in the cross sysroot — the release armv7+musl legs panicked on it) and isn't
# usable on android/ios. Gate to exactly the serial-capable targets — the SAME
# predicate guards `pub mod radio` (lib.rs) + the edge attach (compose.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
# scrub-ner (persist) lives HERE and not in [dependencies], because it pulls
# `tokenizers` -> `onig_sys` (oniguruma, a C library) and that fails to link on
# iOS arm64: `Undefined symbols: ___chkstk_darwin, referenced from _match_at in
# libonig_sys`. The wheel-size cost was measured (+4.18 MiB) and the LINK was
# not — the iOS lane found it.
#
# The absence is already handled rather than fatal: `crate::scrub::EgressScrubber`
# checks `ner::is_configured()` per batch, so a platform without NER scrubs
# `full_traces` at Detailed and RELABELS the trace `detailed`, loudly. A mobile
# node therefore never ships content claiming a scrub it did not receive; it
# simply cannot offer the NER tier.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v38.3.0", features = ["scrub-ner"] }
serialport = "4"

# libsqlite3-sys (pulled by persist's `sqlite` feature) links the SYSTEM libsqlite3
# by default — which the musl / armv7 CROSS sysroots don't provide, so the release
# legs failed at LINK: `unable to find dynamic system library 'sqlite3'`. Compile
# sqlite FROM SOURCE (`bundled`) for exactly those two cross triples — `zig cc`
# builds the C in, statically, no dynamic dependency. Scoped per-triple so every
# mainstream target keeps linking its system sqlite (smaller; matches persist's
# non-mobile default). SAME libsqlite3-sys 0.28 the `sqlite` feature already locks,
# so it UNIFIES to one crate (one `links = "sqlite3"`, no collision).
[target.aarch64-unknown-linux-musl.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[target.armv7-unknown-linux-gnueabihf.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# Test-only — the two-node replication integration test (tests/replication.rs)
# builds + signs CEG batches with the same primitives persist verifies against.
# ed25519-dalek MUST match persist's locked 2.x (the SigningKey type crosses the
# Engine::with_signer / put_public_key API boundary).
[dev-dependencies]
# Generate the mock YubiKey PIV attestation chain (root → f9 → 9c, Ed25519, with
# the Yubico firmware/touch/FIPS extension OIDs) the CC 4.2.2.1 hardware-class
# gate test drives (tests/hardware_class_admission.rs, CIRISServer#159). Nobody
# can mint a cert under the REAL pinned Yubico Attestation Root 1, so proving
# "a valid attestation admits at the claimed class" requires generating a chain
# under a test root — the same way CIRISVerify tests `verify_yubikey_piv_attestation`.
# Already in the locked graph at 0.13.2; dev/test only, no substrate pin touched.
rcgen         = "0.13"
ed25519-dalek = "2"
base64        = "0.22"
chrono        = { version = "0.4", features = ["serde"] }
serde_json    = "1"
criterion     = { version = "0.5", features = ["async_tokio"] }
# Tamper-side raw SQLite handle for the audit hash-chain conformance gate
# (tests/audit_chain.rs): opens the engine's file-backed DB on a SECOND
# connection to corrupt one stored row, the only way to land a tampered entry
# (record_entry validates + rejects, so a broken row can't go in through the
# trait). Pinned to persist's locked 0.31 + same features (NO `bundled` — links
# the platform libsqlite3, matching persist's non-mobile target so the two
# `links = "sqlite3"` crates unify to one symbol set).
rusqlite      = { version = "0.31", features = ["chrono", "serde_json"] }
# Drive the merged axum Router in-process for the HTTP trace-ingest test
# (tests/ingest_http.rs): `ServiceExt::oneshot` + read the response body. tower
# 0.5 / http-body-util 0.1 match axum 0.8's floor (already in-tree transitively).
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
# The PQC primitives the realtime-A/V E2E bench drives directly: hybrid KEX
# (X25519 + ML-KEM-768) for the per-Link transit key, AES-256-GCM for the
# two-layer chunk seal. Same pin/features edge composes (tag parity).
ciris-crypto  = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v13.6.1", version = "13", features = ["hybrid-kex", "aes-gcm", "pqc-ml-dsa", "self-enc"] }
# Enable edge's OWN fountain codec (`codec-fountain`, L1-A) for the survival-floor
# proof — dev/test ONLY (feature unification applies to test/bench builds; the
# shipped wheel stays codec-free, since a relay forwards sealed symbols opaquely
# and never encodes/decodes). This lets tests/chaos_mesh.rs exercise the SUBSTRATE
# codec (`fountain_encode`/`fountain_decode`) directly — a real MEASURED proof,
# not a reference stand-in.
ciris-edge    = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v18.5.0", features = ["codec-fountain"] }
# Enable persist's TEST-ONLY genesis-seam (`test-genesis-seam`, CIRISPersist#387) for the
# accord ceremony tests (tests/accord.rs): `Engine::with_signer_pre_genesis` yields a clean
# engine with the HUMANITY_ACCORD genesis seed SKIPPED, so those tests can stand up their OWN
# custom-holder family via the assemble ceremony.
#
# persist v31.0.0 REMOVED the `test-genesis-seam` feature that used to fence this (it was
# `with_signer_no_genesis_seed`). Not a relaxation — the reverse: v31 is the binary that RUNS
# the genesis ceremony producing the root a later cut bakes, so it must be able to start
# without one. Pre-genesis is now a supported boot mode, not a test seam, and an Engine built
# that way reports `GenesisPosture::PreGenesis` while every ROOT_REQUIRING_GATES gate refuses
# with `NoConstitutionalRootYet`. A node that trusts nothing is not a node that checks nothing.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v38.3.0" }

# The QA runner exercises the family/accord ceremony surfaces against a
# CONTROLLABLE roster — holders it can sign as. persist v31.0.0 made roster growth
# require an `AdmitSpec`: hybrid signatures over the GROWN record, by a registered
# authority. Producing one needs persist's `cohort::test_support` signing helpers,
# which live behind `test-anchor`.
#
# So the example is gated rather than softened. The alternative — an unsigned or
# stubbed spec — would make the QA runner exercise a path production cannot take,
# which is worse than not building it by default.
[[example]]
name = "qa_runner"
required-features = ["test-anchor"]

# PQC realtime-A/V streaming E2E benchmark (CIRISEdge#62 realtime_av profile).
[[bench]]
name = "pqc_av_streaming"
harness = false

# Replication / corpus-ingest throughput (the CEG-RC5 receive spine).
[[bench]]
name = "replication_ingest"
harness = false

# Multi-tier ALM relay chain (CIRISEdge#149 open_av_outer) — per-hop + per-depth
# cost; the E2E byte-survival invariant is gated in tests/alm_chain.rs.
[[bench]]
name = "alm_chain"
harness = false

# Sustained multi-stream seal throughput — measures the actual core-fraction to
# seal N blob streams @30fps in a real loop (promotes the page's "2,000 blob
# streams ≈ 6-10% of a core" from arithmetic to MEASURED).
[[bench]]
name = "stream_fanout"
harness = false

# N_eff capacity-scoring microbench — the lens constraint eigenspectrum pipeline
# (ciris_server::scorer::n_eff). Feature-matrix build + Jacobi eigendecomposition
# + PR/entropy derivation: the per-agent per-cadence-tick CPU cost of
# `capacity:sustained_coherence:v1`. CI-runnable (pure arithmetic, no network,
# no database).
[[bench]]
name = "n_eff_scoring"
harness = false

# Erasure-survival bench — EMPIRICAL reconstruction rate against the real substrate
# fountain codec (edge codec-fountain / RaptorQ). Encodes a blob into H holders, drops
# holders by a per-availability-tier Bernoulli(q) coin, runs many real decode trials,
# and writes the measured p_reconstruct per tier to target/erasure_survival.json (read
# by the scoreboard). `harness = false` — survival is a rate, not a latency. Codec is
# dev-only, so this measurement lives in a bench. `cargo bench --bench erasure_survival`.
[[bench]]
name = "erasure_survival"
harness = false

# Signature-overhead micro-bench — per-event sign+verify latency for classical
# (Ed25519-only) vs hybrid (Ed25519 + ML-DSA-65, the production provenance signature),
# using the substrate's REAL ciris_crypto primitives. The scoreboard derives the honest
# "+N%" post-quantum overhead from the two criterion medians. `cargo bench --bench sig_overhead`.
[[bench]]
name = "sig_overhead"
harness = false

# Chat throughput + MEMORY PRESSURE — the four-phase bench behind
# .github/workflows/chat-bench.yml, modelled on CIRISAgent's memory-benchmark.yml
# (cold start / 100-message warm / 1000-message burst / idle tail, RSS sampled at
# every boundary). Drives the REAL `contacts_chat::router` over a bound listener
# against an in-memory engine — no criterion, because what is being measured is a
# SHAPE across phases, not a distribution around one operation. `harness = false`
# and one JSON object per phase on stdout (jsonl).
# `cargo bench --bench chat_throughput`.
[[bench]]
name = "chat_throughput"
harness = false

# Mesh-propagation benchmark — N in-process software-key nodes; ONE group-A
# publisher advertises a synthetic "video" and a FountainSwarmRuntime per node
# converges the holding-claim to its cohort ONLY. Measures propagation latency /
# fan-out / group isolation / throughput over an in-memory bus (swarm LOGIC +
# cohort gate, not wire transport). `cargo run --example mesh_propagation`.
[[example]]
name = "mesh_propagation"
path = "examples/mesh_propagation/main.rs"

[profile.release]
# panic strategy stays "unwind" (the Win7 build-std lane relies on this being
# pinned here, not on the build-std crate list — see release.yml win7 lane).
panic = "unwind"
strip = false   # release workflow strips per-target after build

# ── CIRISServer#378 — thin LTO + one codegen unit ────────────────────────────
# This cdylib statically links the ENTIRE substrate (persist + edge + verify),
# so the default 16 codegen units duplicate and under-inline across a very large
# graph. Thin LTO plus `codegen-units = 1` is the standard fix.
#
# It was tried once in 0.5.158 and reverted, for a reason worth keeping: the
# measurement compared a CI `extension-module` build against a plain
# `cargo build --lib`. Different feature sets, not comparable, so the reported
# win was meaningless. This time both sides are the SAME `maturin build
# --release --strip` wheel, same features, same box, same command:
#
#   before  97.32 MiB      after  90.13 MiB      -7.19 MiB (-7.4%)
#
# Against the 99 MB CI gate that binds hardest on Windows (98 MB at 0.5.165 —
# one megabyte of room), that buys back roughly seven releases of the ~1 MB-per-
# cut drift the gate exists to catch. It does NOT retire #379: 45.95 MiB of
# identical .class still ships in all nine wheels.
#
# THE REAL HAZARD IS NOT SIZE, IT IS SILENCE. Everything reachable only through
# FFI — the ~88 `ciris_verify_*` C symbols and the five `PyInit_*` entry points
# — is, to the linker, correctly unreachable: nothing in Rust calls them. An
# optimizer given more freedom can conclude exactly that. The failure then ships
# GREEN: the wheel builds, it is smaller, it imports fine, and the missing symbol
# surfaces at a call site on whichever platform inlined hardest.
#
# So the gate is symbol SURVIVAL, not the size number:
# `tests/release_gates/ffi_symbols.rs` asserts the full exported inventory, and
# build-wheels.yml re-asserts it against the built artifact on every target.
# `#[no_mangle] pub extern "C"` already implies `used`, and cdylib exports are
# GC roots — this is belt-and-braces against a future flag (`--gc-sections`,
# `-Zbuild-std`) that changes what the linker considers a root.
#
# "thin" rather than "fat" deliberately: near-identical results on a graph this
# size, without fat LTO's single-threaded whole-program link, which on this
# 31 GiB box is a memory risk (see the [profile.dev] guardrail below).
lto = "thin"
codegen-units = 1

# ── Build-memory guardrail (do NOT remove without reading this) ───────────────
# `cargo test` does not build one binary — it links the ~32 integration-test
# binaries in tests/*.rs, and EACH statically links the FULL substrate (persist +
# edge + verify + the pyo3 cdylib and all their deps). At the dev/test default of
# full DWARF (`debug = true`) that is ~2-3 GB of peak RSS per link, and cargo runs
# `nproc` jobs by default (32 on this box) → ~32 simultaneous multi-GB links, tens
# of GB over the 31 GiB of RAM. The kernel does not OOM-kill it (no `oom-kill` in
# the log); it swap-THRASHES and the machine goes unresponsive. That is exactly
# what happened once — hence this pin.
#
# `line-tables-only` keeps file:line in panic backtraces (all the suite actually
# needs) while dropping the local-variable DWARF that dominates link memory —
# roughly a 5-10x cut in per-link RSS, so even full-width parallelism fits. It
# also makes CI links faster and lighter, so it is safe on small runners (unlike a
# `[build] jobs` cap, which would OVER-subscribe a 4-core runner).
#
# Stepping through code in a debugger? Override per-invocation, don't edit this:
#   cargo test --config 'profile.dev.debug=2' --config 'profile.test.debug=2'
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"


