olves the x25519 → KEX → envelopes ship. THE TRACE-FLOW ARC IS COMPLETE END TO END: rootable (#397) → auto-dial (#296 + :4242 #404) → survives-restart (#411/#299) → first-rootable (#301/#413) → agent-fold (#221) → advisory-durable (#416). 0.5.96 = AGENT-FOLD SEAM (CIRISServer#221) — the last domino for trace-flow. NO substrate change (edge v9.6.0 / persist v13.9.0 / verify v8.10.1 held). serve_with_adapter (the seam `serve_with_python_adapter` folds the Python brain onto for the federation/self/accord routes on 4243) now REUSES the agent's in-process embedded engine + edge instead of building fresh: (1) build_engine → if current_rust_engine() is Some (the brain installed the persist process-singleton via Engine(config)), reuse it — the prior with_hardware_signer_hybrid opened a SECOND connection pool + sweeper on the same SQLite DSN (WAL-safe but SQLITE_BUSY-prone under a bursty cognitive loop); (2) build_edge → if embedded, reuse current_edge() (the running Arc<Edge> from init_edge_runtime) instead of binding a SECOND Reticulum transport on :4242 (a hard address-in-use conflict with the agent's transport); (3) the edge.run() spawn is SKIPPED when embedded (the agent already owns the run loop). Gated on the `python` feature + current_rust_engine()==Some, so the standalone binary (serve → NoopAdapter) is byte-for-byte unchanged (embedded=false → build fresh). Slices attach + read-API mount unchanged (&Arc<Edge> deref-coerces to &Edge; routing registries edge reads live per inbound frame). This lets CIRISAgent's BrainAdapter + main.py → serve_with_python_adapter fold in cleanly and additively — /v1/federation/announce on 4243 → announce → root → KEX → envelopes. CI: bundles PR #218 (sccache wired into the linux wheel legs — they were cold, no compiler cache; now ~86% warm like windows, ~15-20 min compute saved). NB caveat (boot-test verifies): several slices are documented "MUST run BEFORE edge.run()"; in the fold they run after the agent's run() — replication routing