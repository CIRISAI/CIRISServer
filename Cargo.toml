version = "0.5.126" # 0.5.126 = THE DELIVERY-COMPLETE CUT — adopt edge v13.4.0 (leviculum v0.9.4+ciris.1): the third and final delivery root. #353 ask #2 / leviculum#27: reverse-path replies that hit a BUSY link now ship as LINK PACKETS, interleaving the in-flight resource transfer instead of contending and losing the 8s window (field-proven on canonical-1/0.5.125: link stayed BUSY through all 16 attempts/8s → NAT-blocked fallback dial → trace never landed). Both channel + raw link-data receive paths route through ONE shared attribution helper so they cannot diverge; reproduced-then-fixed with a test that fails without the fix (the e2e caught that send_on_link arrives as MessageReceived not LinkDataReceived). Completes the three-way delivery investigation, each resolved at its true root + reproducible: keepalive death (#363, v13.3.0), silent frame destruction (leviculum#25, v13.3.1), resource-transfer contention (#353 ask#2 / leviculum#27, v13.4.0). Substrate edge v13.4.0 / persist v17.8.0 / verify v10.5.0. Node A repins this -> every mobile-path failure mode is fixed AND observable (delivery_status() from 0.5.125). Open: whether #353 was THIS trace-hujqnp62x7 blocker or the mobile push is agent-side — parallel session closes with the mobile outbound log; the contention fix was necessary regardless. === PRIOR === 0.5.125 = THE TROUBLESHOOTABILITY CUT — adopt edge v13.3.1 (leviculum v0.9.3+ciris.1) + delivery_status() (CIRISServer#294). (1) edge v13.3.1 / leviculum#25: the driver silently DESTROYED in-flight frames on an interface disconnect — dispatch_output returns () and drops result.errors (edge backoff correct but unreachable), AND retry_queues.remove(iface_id) deleted queued frames uncounted. Root cause of the delivery-park saga: a NAT rebind churns the accepted socket ~60s, killing iface:12 with 8 frames in flight — destroyed at the driver, invisible to every layer above (misrouted debugging across 3 repos on a truncated-grep false premise). leviculum v0.9.3+ciris.1 adds FramesDropped; edge v13.3.1 WARNs on it {iface_id,count,reason}. Server ruled out (accept-only, bootstrap_peers:[], cannot re-dial a NAT peer); initiator ruled out (re-dialed in 4.4s, forever/5s). (2) delivery_status() PyO3 accessor — one-shot JSON {delivery_started, edge_up, node_key_id, transport_present, canonical_targets, peers:[{key_id, knows_peer, kex_present, deliverable}]} so "why isnt the trace sailing for peer X" is one query not log archaeology (same pattern as first_run_claim_pin/compose_status). knows_peer=false=>never primed; deliverable=true+no delivery=>driver frame loss (grep FramesDropped). Substrate edge v13.3.1 / persist v17.8.0 / verify v10.5.0. Node A repins this -> next mobile trace runs with every failure mode on the path visible. === PRIOR === 0.5.124 = THE DELIVERY-UNBLOCK CUT — substrate edge v13.3.0 / persist v17.8.0 (verify v10.5.0) + the #288 restart seam. (1) edge v13.3.0 #363: the advisory-admitted canonical link now holds a 30s keepalive (60s stale = 2x anti-entropy cadence) instead of dying ~16s, so it SURVIVES long enough to exchange canonical's Key + IdentityOccurrence planes — which is what promotes an advisory peer to a KEX'd delivery target (the first-mobile-trace blocker; RCA CIRISEdge#363, NAT-exonerated by the no-NAT container twin). Both server ReticulumTransportConfig sites (compose + lens-core ret_relay) set link_keepalive: Some(30s). (2) persist v17.8.0 #362: LAN-announced peers surface in /v1/federation/peers as non-canonical/untrusted bookmarks via the seeder bridge (no admission, invisible to authority paths). (3) CIRISServer#288 reprime_federation_delivery(): the mobile in-process restart reuses the edge singleton + start_federation_delivery is is_started()-guarded, so the canonical prime never re-fires (peer_count_canonical: 0); the new primitive re-drives ONLY prime_canonicals (extracted, DRY) on the held runtime — no ReplicationRuntime rebuild (edge replication_registry is set-once). Agent wires one call into node_fold shutdown_node() -> re-serve. Residual: ask-3 (Node A acks 1/3 keepalives under load) is server-side, follow-up. Node A upgraded to this -> the sealed #922 trace sails to trace_events. === PRIOR === 0.5.123 = THE CRYPTO-DRY CUT — substrate repin to the DRY-adopting triple (edge v13.2.0 / persist v17.6.0 / verify v10.5.0, single checkout) + all CIRISServer-side CIRISVerify crypto-DRY findings (#283) actioned. (1) RNG facade (findings 2+4): every getrandom::fill routed through the fail-secure ciris_crypto::random::fill and the SP 800-90B latch ARMED once at boot (init_rng_health) — the ignored-Result let _ = sites (constitutional-halt nonce accord.rs, API-key, PBKDF2 salt, session/device/grant tokens, mesh nonce, OAuth CSRF, occurrence suffix, claim PIN) now degrade CLOSED (expect) instead of silently emitting zeros; seed mints (compose/identity) route through the facade too; direct getrandom dep DROPPED. (2) hybrid composer (finding 3): lens-core signing/event.rs (RLib) now calls LocalSigner::sign_hybrid directly instead of re-deriving canonical‖ed25519_sig; the PyO3-boundary sibling (ffi/pyo3.rs) is BLOCKED on an Engine local_sign_hybrid verb → filed CIRISPersist#470. (3) trace-verify DRY (finding 5): seal.rs verify_trace_signature routed through ciris_crypto::Ed25519Verifier::verify_strict (raw-bytes param, strict RFC-8032 matching persist floor); ed25519-dalek demoted to a dev-dep (test-only fixtures) — no dalek at runtime. (4) KMP finding 1: HybridFederationSigner.signHeaders now signs the PQC half over body‖ed25519_sig (the bound rule Strict requires), not the raw body. 175 lib + 356 lens-core + release-gates green. edge#357 announce hygiene + the real-PQC accord bench ride in via the substrate. === PRIOR === 0.5.122 = THE RESTART CUT — bundles #276 + edge v13.1.2 (#353 follow-up). (1) #276 shutdown_node(): serve_with_python_adapter blocked until ctrl-c/process-death only, so a mobile setup-complete RESUME raced — the prior node held :4243 while the new serve collided EADDRINUSE for the whole ~100s bind window (the ~4min rebind the field saw). New src/node_control.rs: a process-global watch<bool> latch serve_with_adapter selects on alongside ctrl-c + the bound read-API addr recorded at bind. ciris_server.shutdown_node(timeout_secs=30) PyO3 fn signals stop AND blocks until :4243 is bindable again (direct poll-bind postcondition test; idempotent no-op when not serving; GIL released) — the local-shutdown-and-wait the agent already does for :8080. arm() at read_api_serving, disarm() after read.shutdown() joins the accept task. (2) edge v13.1.2 (9e9d29d) — the #353 busy-link follow-up (reverse-path reply when the inbound link is mid resource-transfer, instead of the NAT-blocked fallback dial). Repin across the workspace incl. lens-core 1.4.4 (attach_handler now takes &Edge from the single edge version); single-edge-version graph. (3) mesh-repro #353 harness: run_353.sh + docker-compose.353.yml + agent_boot NAT-sim (iptables initiator-only) + busy-link generator (real trace resource-transfers via import_traces) → REPRO on pre-fix wheel, FIXED on this one. Triple verify v10.3.0 / persist v17.5.2 / edge v13.1.2. Agent floors this -> setup-complete restart frees :4243 fast -> filmstrip sails -> first mobile trace_events -> 2.9.7. === PRIOR === 0.5.121 = THE WEDGE CUT (#279 root causes NAMED AND FIXED, both) — the android x86_64 "compose completes but 4243 never binds" hang was TWO designed silences stacked: (1) THE GATE: caps.lens_store (free disk >= 5 GiB, DEFAULT_LENS_STORE_MIN_GIB) gated the ENTIRE read-API block — on a stock emulator (~2-4 GiB free) `let read = if caps.lens_store` was simply None: no bind, no error, no panic, and the whole fabric surface (/v1/identity, auth, setup/claim, config, ingest) died with it — the app could never talk to its own node. FIX: the read API + fabric surface now serve UNCONDITIONALLY; only the corpus-GROWTH tiers (scorer/holonomic/replication) stay disk-gated; loud WARN when lens-store is off. (2) THE SWALLOW: lens-core read_api_with_extra bound INSIDE the spawned task and swallowed bind errors into a log line (dark on the fold) — the caller got a "successful" handle with no listener. FIX (lens-core 1.4.4): bind SYNCHRONOUSLY before spawning; bind failure is now the caller's error (compose fails loudly, e.g. AddrInUse); a returned handle GUARANTEES the port is bound; new read_api_serving compose stamp after the bound milestone. (3) SINK part 2 (first_write_ok=false in the field): the held-FD tracing_appender rolling writer fails to WRITE on Android while the .boot std::fs append always lands — replaced with SyncDailyMakeWriter: every event opens the dated file append-mode, writes, closes (the proven primitive; no held FD across the Chaquopy lifecycle, daily rolling from the filename). Same triple verify v10.3.0 / persist v17.5.2 / edge v13.1.1. Agent floors this -> emulator serves 4243 (or names the bind error in the RuntimeError) -> filmstrip -> first mobile trace_events -> 2.9.7. === PRIOR === 0.5.120 = #279 OBSERVABILITY CUT — the compose hang on android_24_x86_64 becomes a one-line RCA. (1) compose_status(): 21 phase stamps through serve_with_adapter (halt_gate -> federation_signer -> engine -> config_resolution -> root_bootstrap -> claim_pin -> edge_runtime -> ... -> read_api_bind -> adapter_start) + complete(); new in-process PyO3 accessor returns JSON {completed, current{phase,elapsed_s,stuck,stuck_warnings}, history[{phase,ms}]} — on a hang, current.phase IS the wedged seam (the #277 accessor pattern; the only channel proven alive on the fold). Record-and-continue watchdog (plain OS thread, works even if tokio is wedged): stuck at 60s, re-WARN each 15s, never aborts. (2) THE DARK FILE SINK FIX (ask 1, RCA-verified): py_init_tracing/init_tracing_with lost the try_init race to any earlier subscriber (the agent's bare init_tracing() or a Chaquopy process-reuse survivor) and `let _` swallowed it — the file layer was BUILT (eagerly creating the dated file = the 0-byte signature) but never INSTALLED. Now the file sink lives behind a process-global reload handle: first call installs reload(file)->filter->fmt, later calls hot-swap the slot — bare-then-dir, re-serve, and process-reuse all end with a LIVE sink; only a FOREIGN subscriber is unfixable and that is now reported, not swallowed. init_tracing returns {fresh_subscriber, file_layer_attached, first_write_ok, log_path} — dark-sink detection at t=0 (the [RUST-SINK] sentinel gets its verdict up front) — and a first-write probe emits a marker event and verifies the dated file grew. tests/tracing_sink.rs reproduces the exact Android bare-then-dir sequence and locks the retrofit. Same triple verify v10.3.0 / persist v17.5.2 / edge v13.1.1 — no upstream wheels. Agent floors this -> compose_status() names the hang phase on the first boot. === PRIOR === 0.5.119 = #277 UNBLOCK — the embedded-fold first-run claim PIN is now retrievable IN-PROCESS by the embedding host. On the Android/Chaquopy topology the app IS the console (it launched the node via serve_with_python_adapter) but the console-only OWNERSHIP banner never became observable bytes (0-byte rust file sink at compose; nothing in logcat or <home>/logs/*), so log-scrape capture always failed -> self-claim impossible -> the wizard<->Login nav loop. Fix: compose stashes the minted PIN in a process-static the instant announce_ownership_unclaimed runs, exposed via the new `ciris_server.first_run_claim_pin()` PyO3 accessor (in-process only, non-consuming, NEVER over HTTP — preserves the console-only model since the host IS the console). Also eprintln! breadcrumbs on BOTH mint/skip branches so the bootstrap outcome is visible on stderr/logcat when the tracing sink is dark (answers the #277 "does an unconfigured embedded home wrongly report a ROOT owner" question on-device). Pure CIRISServer-side — SAME triple verify v10.3.0 / persist v17.5.2 / edge v13.1.1, no new upstream wheels. The agent floors this, polls first_run_claim_pin() after serve, self-claims -> reliable Android first-run -> first mobile trace_events row -> 2.9.7 -> 0.6. === PRIOR === 0.5.118 = THE MOBILE CUT — clears the LAST fold-boot blocker: verify v10.3.0 carries the CIRISVerify#204 ciris-keyring block_on reentrancy shield (android.rs:94/816/860 — the ~12-site inventory), so serve_with_python_adapter no longer panics `Cannot start a runtime from within a runtime` one layer down in the keyring on the agent-embedded topology (CIRISServer#264). Triple verify v10.3.0 / persist v17.5.2 / edge v13.1.1 (edge#353 reverse-path already in 13.1.0; 13.1.1 re-pins the keyring fix). persist v17.5.2 also fixes list_attestations dimension_exact no-op (#461). This is the cut the fold-ON 5-step acceptance runs on -> first mobile trace_events row on canonical-1 -> 2.9.7 -> 0.6. === PRIOR === 0.5.117 = THE LAST 0.5.x CUT (CIRISServer#264 substrate checklist, all items) — (1) MUST-FIX: the tokio runtime-reentrancy panic (`Cannot start a runtime from within a runtime`) that was THE root cause of the entire configured-home/mobile fold saga: rt_block_on now detects an ambient runtime (Handle::try_current) and HOPS to a dedicated OS thread with a fresh runtime — no ambient context there, so the nested-runtime rule cannot fire, topology-independent by construction, shielding every inner persist/lens sync helper reached from the wheel's entries (the agent-embedded path — live asyncio + reused current_rust_engine — hit this on EVERY mobile boot; 0.5.116's catch_unwind made it visible, this removes it). (2) MUST-HAVE 3: process-wide panic hook captures location+backtrace into the RuntimeError payload AND eprintln!s it immediately — a field panic now names file:line on every platform, even when the exception is swallowed upstream (tonight's diagnosis took four instrumented boots for want of this line). (3) MUST-HAVE 4: sync_file_layer — the <home>/logs/ciris-server.log appender is now SYNCHRONOUS (no non_blocking worker thread; under Chaquopy/JNI the worker never flushed and mobile shipped a 0-byte log every boot) + a writability probe + boot marker; wired into BOTH init_tracing_with and ciris_server.init_tracing(log_dir=,filter=). (4) MUST-HAVE 2: harness/mesh-repro EMBEDDED-FOLD variant (run_embedded.sh + agent_boot CIRIS_HARNESS_EMBEDDED_FOLD): live in-process Engine+Edge, THEN serve_with_python_adapter on the same process — the reentrancy topology run_configured.sh structurally cannot reproduce; PASS = 4243 binds. MUST-KEEPS confirmed: fold-independent edge delivery (intentional, stable) + all three android ABIs in the publish matrix. FIELD NOTE (the night this shipped): the first mobile agent ROOTED at canonical-1 over live Reticulum and its rounds were SERVED — the remaining leg is CIRISEdge#353 (responder reply must ride the inbound link to a NAT-ed initiator-only peer; fresh outbound dials to phones time out 30s forever). Edge repin lands the hour #353 tags; agent floors 0.5.117 per the #264 acceptance run → 2.9.7 → 0.6. === PRIOR === 0.5.116 = THE CONFIGURED-HOME CUT (CIRISServer#264, ALL five asks) — unblocks the FIRST MOBILE TRACE (a sealed 16-event CEG trace exists on-device on 0.5.115; only delivery was gated). ROOT CAUSE of the deterministic configured-home fold hang: init_tracing_with used .init(), which PANICS when a global subscriber exists; the panic crosses pyo3 as PanicException (a BaseException node_fold's `except Exception` never catches) -> serve_with_python_adapter died SILENTLY pre-first-log -> 4243 never bound. Fresh wizard boots had no subscriber (bind ~10s); configured boots had the agent's ciris_server.init_tracing() (CIRISAgent#919, delivery path = configured-only) installed first; in-process restarts had the FIRST serve's. One bug, all three #264 repro rows. FIXES: (1) try_init + graceful fallthrough (regression test tests/tracing_reinit.rs panics on the old code); (2) first-breath eprintln in serve_with_python_adapter before ANY blockable call + a config-resolved line before the blocking serve (ask 1 — a field hang is now attributable to a phase, never silence); (3) catch_unwind around the blocking serve so ANY future rust panic surfaces as a catchable RuntimeError, never a silent BaseException thread-death; (4) init_tracing(log_dir=None, filter=None) params (ask 5 — the ONE host-installed subscriber can carry the <dir>/ciris-server.log file sink + an explicit filter, since a later serve cannot retrofit either onto an existing subscriber, and Android env whitelists can drop RUST_LOG); (5) android_24_x86_64 wheel leg (ask 4 — emulators are x86_64; no more ndk_translation variable in every mobile repro); (6) harness/mesh-repro CONFIGURED-home variant (ask 3): run_configured.sh + docker-compose.configured.yml — named-volume homes, boot-to-configured then RESTART both roles on the same homes, assert rebind + re-seed; the class the fresh-node SUCCESS verdict structurally cannot catch. === PRIOR === 0.5.115 = TRACE-DELIVERY UNBLOCKED — edge v13.0.9 / persist v17.3.0 (pin-currency: persist's ResolveEncryptionKeys composite reaches the directory-ops proxy, closing CIRISServer#260/CIRISPersist#329: resolve_peer_kex_pubkeys returned None-forever on every embedded/pyo3-path consumer because the v14 revocation-aware seal lookup called list_identity_occurrence_revocations_for, which the proxy had no DirectoryOp for — so sealed-envelope trace delivery shipped 0 envelopes fleet-wide while anti-entropy rounds worked; the fourth candidate nobody had). VERIFIED in harness/mesh-repro: KEX-GATE PRESENT after 45s, sealed-envelope path UNBLOCKED. PLUS CIRISServer#261: serve the 7 agent federation routes on 4243 (peers appearance/trust/sas sideband, content/{id}, events/{channel}, metrics, federation-identity) so the CIRISAgent wave-2 DRY purge deletes its Python copies without 404s. Harness: agent_boot KEX gate (polls resolve + dumps the local occurrence row — the instrument that named #260's root cause in ONE run), CIRIS_TEST_ANNOUNCE_SECS (test-anchor-fenced announce_interval() override; 45s convergence vs 300s), pack_wheel purges stale wheels (two wheels in the dir had pip silently install YESTERDAY'S substrate — run invalidated, guard added). === PRIOR === 0.5.114 = THE MESH-WORKS CUT — coherent triple verify v10.2.0 / persist v17.2.0 / edge v13.0.8, END-TO-END PROVEN by the new harness/mesh-repro QA runner (CIRISServer#258, verdict SUCCESS): two fresh nodes on one zero-loss bridge root BOTH ways, links establish+identify, and the anti-entropy round completes for ALL THREE kinds (responder report InSync) — the first fully-proven #235 end-to-end frame path. Closes the last two silent seams of the saga at edge: v13.0.7 (CIRISEdge#348: the factory responder was never DRIVEN) + v13.0.8 (the agent inbound loop skipped the CRPL pre-dispatch, so round-opens never routed to the responder); both now share one code path + the whole transport->ingest hop logs loudly (frame-crossed / routed-to-responder / bounded drop lines). SHIPS IN PROD WHEEL: the triple bump, spawn_event_bus_logger (subscribe_all tap over EVERY edge event — AnnounceSent/Received, Link Established/Dropped, Path, SignatureFailure — the instrument that found both seams), and ciris_server.init_tracing() (pyfunction; a Python-embedded host finally gets RUST_LOG-filtered rust logs — the agent had NONE). COMPILE-FENCED OUT of the prod wheel (feature `test-anchor`, NEVER in maturin features — the inert-twin wall, CIRISServer#258/persist#451/verify#202): src/test_bless.rs (SW-test-root self-bless + optional canonical,node claim via the untouched m-of-n gate), the two /v1/federation/test-* routes, examples/test_anchor_env.rs (derives the 4-env anchor block from one seed), and harness/mesh-repro/ (Dockerfile+compose+agent_boot+pack_wheel — the ~7-min deterministic runner; pack_wheel exists because maturin mis-detects edge v13 uniffi symbols and refuses -b pyo3). Saga index 0.5.108->0.5.114: #238 boot-prime / announce-MTU / #336 routing / #340 identify / #342 re-key / #348 responder-drive+ingest-route. === PRIOR === 0.5.113 = ADOPT edge v13.0.3 — TWO independent blockers atop the (fixed) routing saga: (1) the #66 RE-KEY establish-wait (CIRISEdge#342, diagnosed here from both-sides-0.5.112 field: 0 Data to canonical / 87 elsewhere). transport send gated send_resource behind wait_until(established_links.contains(connect_link_id)), but a Codeberg-#66 establishment RETRY re-keys the link_id; LinkEstablished fired under the re-keyed id while send waited on the original -> establish-wait timed out -> send_resource never reached -> 0 Data -> idle keepalive death. ONLY on retried (lossy/remote) links, so canonical-specific + byte-identical across .0/.1/.2 (none touched the wait); Node B (local, no retry) sent fine. v13.0.3 resolves the link_id through the #66 alias table in the establish-wait -> send_resource fires -> Data flows. (2) HEAL CADENCE: the explicit->named route heal fired only on the 2nd announce cycle (~5min); v13.0.3 announces on link-up -> heals in seconds (grounded in markqvist RNS/Sideband source). Both independent of routing (#336) and identify (#340). Edge patch bump, substrate UNCHANGED (persist v17.0.1 / verify v10.1.1), no API change. Expected: heal in seconds -> link establishes -> Data transmits over the re-keyed link -> IdentityOccurrence round COMPLETES -> CIRISServer#235's first real end-to-end frame, to KEX; any further stall now surfaces ONE LAYER ABOVE the transport. 370 tests / 37 suites green. === PRIOR === 0.5.112 = ADOPT edge v13.0.2 — the initiator now IDENTIFIES the link, closing the LAST precondition of the #336/#235 delivery saga. Diagnosed from Node A live logs (SSH, 0.5.111): #336 fixed (routing heals, 42 links establish @ 8-15ms), yet every inbound CRPL frame dropped source_key_id=None (SkippedNoSourceKeyId, #317). Settled it was NOT the resource race (30 frames of 62/200/1925B reassembled + reached replication) NOR rooting (Node A rooted the agent with transport_identity_hash=f5d4342c) NOR #314 attribution (correct + form-agnostic) -- the link was ANONYMOUS: edge link_open did connect+wait but NEVER called Node::identify_link, so NodeEvent::LinkIdentified never fired, link_to_peer_key_id stayed empty, source_key_id=None. Filed CIRISEdge#340; this also explains why #235 shipped-but-never-verified (attribution machinery correct, but its precondition -- an identified link -- was never met in the field). v13.0.2: link_open now identifies the link with the node's own transport identity after establish -> responder fires LinkIdentified -> #314 resolves source_key_id -> the frame reaches dispatch_inbound. Edge patch bump, substrate UNCHANGED (persist v17.0.1 / verify v10.1.1), no API change; +a route_table_e2e regression test. Expected: the IdentityOccurrence round completes end-to-end -- CIRISServer#235's FIRST real frame, straight to KEX. 370 tests / 37 suites green. === PRIOR === 0.5.111 = ADOPT edge v13.0.1 — the #336 BELT FINALLY HEALS. edge v13.0.0 shipped the belt STRUCTURALLY UNREACHABLE: it gated the explicit->named heal on incoming==Rooted, but a boot-primed peer's genuine healing announce arrives ADVISORY (CC 3.3.6.2), so the #337 hijack gate refused it FIRST (Rooted+Advisory->HijackRefused, before the epoch/verified_reroute checks). Diagnosed from the field result + the edge code (route_supersession_decision reticulum.rs:3415) and posted to CIRISEdge#336; the belt's own unit test had passed on incoming==Rooted, an assumption the runtime violates. v13.0.1 SEPARATES IDENTITY (owns_key, derived from the rooting verdict's rejection reason) FROM TRUST (provenance): the hijack gate now refuses only an IDENTITY SPOOF (PubkeyMismatch/UnknownKeyId), while the OWNER's own Advisory reroute HEALS the routing dest explicit(1fc232)->named(81cabc). This ALSO fixes the link-proof second layer (same root cause: 1fc232=sha256(fed_ed25519) is not a dest Node A serves on; it serves on 81cabc, so once the send targets 81cabc the proof verifies too). Substrate UNCHANGED from 0.5.110 (persist v17.0.1 / verify v10.1.1); edge patch bump only, no API change. Expected: a replication round to the boot-primed canonical now completes -- first true end-to-end frame + first real exercise of CIRISServer#235, straight through to KEX. 370 tests / 37 suites green. === PRIOR === 0.5.110 = ADOPT edge v13.0.0 + persist v17.0.1 (two majors). (1) edge v13 ENDS THE AV-42 ROOTING SAGA (CIRISEdge#336, root-caused here): a boot-primed peer was pinned to its un-announceable EXPLICIT-HASH dest sha256(fed_ed25519) while only reachable on its NAMED dest sha256(name_hash("ciris","edge")||identity_hash) -- two different address derivations, so replication LINK_REQUEST_TX aimed at a dest with no route and silently 30s-timed-out. rooting != routing; my boot-prime conflated them (comment corrected in compose.rs). v13 BELT: a verified announce at equal epoch with a different dest heals explicit->named. v13 GUARD (#337): replication apply authenticates SignedTransportDestination -- bare/unsigned routes refused (confused-deputy closed). WIRE BREAK: route replication is signed-only; both peers must be on edge v13. (2) persist v17 (CIRISPersist#443) TransportDestination gains epoch (durable monotonic supersession counter -- the edge-side RootedPeer.epoch finally durable) + retired_at (replicated tombstone); supersession is (epoch, asserted_at)-lex so a replayed older frame can never clobber a newer binding. All 4 construction sites set epoch:0/retired_at:None (initial self assertions). (3) #253 ADOPTED: persist v17 carries the CC 3.4.9 co-steward roles (registry/verify identity_type members, accord-conferred, self-authenticating) ON the key record, so compose_policy.rs licensure_cap retires its by-pin CoSteward workaround (#159) -- compose_for_key now resolves via persist has_effective_role in its async phase (pure compose stays sync; pin_co_steward kept for unit tests only). (4) persist v17 made accord-holder attestation_evidence MANDATORY at registration (was lenient in v16); production A1 holders are FIPS YubiKeys carrying a real chain, but 3 software test fixtures (accord_admit_node, federation_admin, mesh_seed_keyplane_e2e) seeded the A1 anchor with none -> now supply a minimal structurally-valid ExternalSecureElement evidence (persist checks field PRESENCE; real chain validation is the CC 4.2.2.1 consumer job). 370 tests / 37 suites green. === PRIOR === 0.5.109 = ADOPT edge v12.0.0 — THE ATTESTED ANNOUNCE FITS FOR THE FIRST TIME EVER (CIRISEdge#333, root-caused here). WIRE BREAK: both peers must be on edge v12 for announces to interoperate; the fleet rolls together. THE BUG: an attested announce was 404 B of JSON into a ~300 B app_data budget (MTU 500 - header 19 - ifac 1 - pubkey 64 - name_hash 10 - random_hash 10 - ratchet 32 - sig 64), so `pack()` overflowed a fixed [0u8; MTU] buffer and the announce NEVER TRANSMITTED. Not a 0.5.108 regression -- the AnnounceAttestation shape is byte-identical in edge v10.1.2 and v11.1.2; it has never worked. It produced a CATCH-22: a node WITH a federation signer attested and its announce could not leave the box; a node WITHOUT one sent an empty-app_data announce that transmitted fine, installed an RNS path (so ROUTING worked) but carried no attestation, so it could never be ROOTED -- routable-but-unrootable, which looks healthy and is not. THIS IS THE ROOT CAUSE OF THE ENTIRE AV-42 ROOTING SAGA (the "30 admitted but NOT rooted", rooting_unknown_key_id, "every announce rejected"): an attested announce never went out on the wire, so no peer could ever root another by announce. Every downstream symptom followed from that one line. It only became VISIBLE in 0.5.108 because our #238 deterministic boot-prime fixed DIRECTORY rooting from the baked KeyRecord (admitted-but-not-rooted 30 -> 0, canonical rooted in 5s), which UNMASKED the transport failure underneath -- it surfaced as `transport timeout after 30s` on a peer the directory said was Rooted. (That also makes #238 a half-fix, ours: it seeds the federation directory key_id -> dest_hash but NOT the RNS routing table dest_hash -> next-hop.) THE OVERFLOW WAS PURE DUPLICATION: build_announce_payload already does `payload.extend_from_slice(&public_key)` -- the packet CARRIES the transport identity ed25519(32)||x25519(32) in BINARY -- and the attestation then re-encoded those SAME 64 bytes as two base64 JSON fields, costing ~140 B, MORE than the 104 B overflow. edge v12 binds the transport pubkeys BY SIGNATURE instead of re-sending them (the verifier reads them from announce.public_key(); AV-42 gets STRONGER -- an adversary cannot edit a field, it must announce from the destination, which is what verification checks), goes binary (~150 B), adds a COMPILE-TIME size gate (const assert + a budget-derived MAX_FEDERATION_KEY_ID_LEN, so the next field added fails the BUILD, not the mesh), and DELETES the unattested-announce branch (signer: None is now a hard config error). Verified no CIRISServer path builds the transport signer-less (compose.rs + lens-core ret_relay both pass signer: Some). 370 tests / 37 suites green. === PRIOR === 0.5.108 = TRIPLE-MAJOR (persist v15.1.2->v16.1.0 / verify v9.0.2->v10.1.1 / edge v10.1.2->v11.1.1) + the v3 AGGREGATION HARD FORK. (1) verify v10.1.1 KILLS THE 0.5.107 WINDOWS BLOCKER (CIRISVerify#197, filed by us): ciris-verify-ffi installed a `#[no_mangle] extern "system" fn DllMain` (release-only, hence green in debug CI) that called early_verify() -> built a Tokio runtime and block_on'd an HTTPS fetch UNDER THE WINDOWS LOADER LOCK. Harmless while it lived in the standalone DLL; once 0.5.107 folded the FFI rlib into ciris_server._native.pyd it became _native's DllMain and deadlocked `import ciris_server` (CI: python hung 25min, killed). v10.1.1 deletes the DllMain AND the macOS #[ctor::ctor] twin -> the load path is now uniformly inert, early_verify is lazy-triggered from ciris_verify_init(). Caught by the #232 fold smoke BEFORE publish -- exactly what it exists for. (2) persist v16.0.0 (#421) CLOSES THE GAP 0.5.100 REFUSED TO SHIP: the wire IdentityOccurrenceRevocation was UNSIGNED (any consented peer could kill any identity's sealability = permanent-DoS forgery), so we held #227 S2 back and filed it. v16 splits the primitive into a SIGNED gate ({attesting_key_id, signed_envelope, signature} + signer_acts_for §11.7.4 single-vouch-for-self, the REPLICATED path) and put_identity_occurrence_revocation_local (trusted-local, NULL sig columns, excluded from the signed replication read, unreachable from the replication apply). src/auth/occurrence.rs takes the _local path: it is an owner-authenticated, LOCALLY-PRODUCED revocation over HTTP -- byte-for-byte today's behaviour minus the forgery surface. We do NOT synthesise a signature (we hold no mandate to sign as an arbitrary identity_key_id; faking one re-opens the very DoS the gate closes). The SIGNED replicating carriage (#227 S2, now finally possible via list_signed_identity_occurrence_revocations_for) is tracked separately. (3) THE v3 AGGREGATION HARD FORK (verify v10 §19.7.1.3 / CIRISVerify#191, CC 6.1.2.1.2 R9; CIRISServer#239): AggregationMetaV1 gains SIGNED max_source_multiplicity + mass_commitment. We are hard-forked onto version 3 -- no v1/v2 producer, no flag-day window, no legacy tolerance (the mesh is still SEEDING; there is nothing to be backward-compatible WITH), and v1/v2 fail CLOSED at the gates. This closes the R9 residual n_eff provably CANNOT see: 900 NEAR-DUPLICATE contents folded as 900 distinct members at EQUAL MASS are mass-honest (n_eff == N exactly, so the dominance gate admits them) yet the composite blur IS the data subject -- only max_source_multiplicity catches it. tests/noise_floor.rs test (d) INVERTED from a gap-characterisation into a positive rejection pin: it used to assert a 900/1000-dominated fold verifies indistinguishably from a balanced one, and was meant to "fail loudly when the surface lands" -- but it pinned version:1, which is bl