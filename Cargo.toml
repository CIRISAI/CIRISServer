me, NOT a wire refusal -- refusing at admission would violate CC 2.4.1.1's MUST-admit); src/compliance.rs (CC 4.5.2.2 machine-readable statute->doc->SHIPPING-SYMBOL map with anti-fabrication tests). CAUGHT ON THE WAY: BUILD_PROFILES declares CCC, which CC 4.4 conditions on implementing Policy A -- WHICH DID NOT EXIST. We would have shipped a conformance surface that over-claimed on its first release; Policy A now makes the declaration true. (5) THE EVIDENCE PACK SHRANK BECAUSE IT BECAME HONEST: 100 claimed-resolved -> 91 resolved / 22 open. A 3-way skeptical audit of all 137 resolved rows found 53% WRONG (29 mis-assigned, 44 weak, 0 link-rot -- the rot is SEMANTIC): rows cited a struct/const that CARRIES a field where the CC demands an ENFORCER (3.3.5 cited `pub const SUBJECT_KIND` -- a discriminator string -- while the admission rules sat 700 lines away), two rows were literally SWAPPED (3.1.2.1/3.1.9.1), one was a homonym match (5.3.3.7 "Framing" -> LoRa encode_frame; the CC means a stream is its own transparency-log instance). Every re-point re-verified against the live pins. Behind the false citations were REAL holes, now filed: unsigned trust-root discovery (#248 -- /v1/accord-holders serves the Policy A bootstrap set as bare JSON, which CC 5.3.4 requires a consumer verify before promoting to a trust root), no family_id / membership_basis / delivery_receipt gates, substrate_edge identity_type does not exist, and a folded key {accord_holder, agent} is WRONGLY REJECTED (scalar != instead of set_contains). Also RETRACTED one of my own security issues (CIRISEdge#331): the auditor claimed the MLS Welcome had no sender authentication; it does -- wrap_welcome signs, unwrap_welcome verifies. The real defect is narrower (TOFU fallback to a SENDER-SUPPLIED verifying key on a directory miss) and the issue was corrected rather than left standing. Stale crate@version annotations refreshed (89 rows cited persist v13.3.1 / verify v8.9.0 / edge v9.1.4). (6) #243 ADOPTED on persist v16.1.1 -- see the commit; the fold is deleted (-210 lines) and the blanket-revoke safety property is now pinned against the REAL substrate resolver. 370 tests / 37 suites green. === PRIOR === 0.5.107 = VERIFY-FFI FOLD + CANONICAL BOOT-PRIME (triple persist v15.1.1->v15.1.2 / verify v9.0.1->v9.0.2 / edge v10.1.1->v10.1.2; 0.5.106 shipped v15.1.0/v9.0.0/v10.1.0). TWO server changes: (1) CIRISServer#232 — the agent now RIDES US for verify: ciris-verify-ffi (v9.0.1 added rlib crate-type, #187/#188) is FOLDED into ciris_server._native.so, so the ~84 ciris_verify_* C symbols live in THIS wheel's .so (no separate libciris_verify_ffi.so). Gated behind the `python` feature (only the wheel needs it, not the headless bin). The linker would --gc-sections-strip every symbol (nothing in our Rust calls them — the agent reaches them via ctypes at runtime), PER-PLATFORM-SILENTLY; kept alive by referencing verify v9.0.2's ciris_verify_ffi_link_anchor() (CIRISVerify#189) from a `#[used]` static + a black_box call in _native init. python/ciris_server/__init__.py exposes verify_ffi_path()->_native.__file__ for the agent's ffi_bindings ctypes loader. Version-skew impossible by construction (folded FFI tag == bundled substrate tag). CIRISAgent#917 then drops the standalone ciris-verify pin (kills the v9.0.0-vs-v5.1.3 wire/canonical-hash skew). VERIFIED on the actual artifact: nm -D the release cdylib lists the full ciris_verify_* surface (never trust cargo-green). (2) CIRISServer#238 — canonical boot-prime: prime_trusted_peers primes from Rooted transport_destination ROWS, but the baked canonical seed carries only a KeyRecord + an IP dial hint, no such row, so the canonical was NEVER boot-primed and rooted only via its slow announce (~130-200s, or never). An explicit-hash peer needs just (dest_hash, ed25519), BOTH deterministically derivable from the fed Ed25519 pubkey the seed already carries: dest_hash = reticulum_destination_for_pubkey(fed_ed25519) = sha256(fed_ed25519)[..16], signing_key = that same fed Ed25519 (transport+federation share the Ed25519 half; the v10.1.0 split was the unused X25519). New compose::prime_canonical_bootstrap_peers looks up each canonical's KeyRecord (lookup_public_key), derives both, and inject_rooted_peer_for_test — deterministic <30s root at boot, no announce dependency, no seed change (persist#428 closed as wrong-premise). RCA correction: I first thought priming needed the transport Ed25519 baked into the seed; the user corrected that the key is deterministically derivable from the fed key, confirmed against edge reticulum.rs (inject_rooted_peer_for_test takes no X25519). Runs in BOTH the standalone node and the agent fold. === PRIOR === 0.5.106 = TRACE DELIVERY FIX (edge v10.0.2->v10.1.0). THE delivery wheel. Minor edge bump; persist v15.1.0 / verify v9.0.0 UNCHANGED; clean pin bump (start() API stable); NO server source change. CIRISEdge#317 FIXED at the source: the announce now carries the signed TRANSPORT x25519, so the receiver admit reconstructs sha256(transport_x25519||transport_ed25519)[..16] = the EXACT identity the RNS link proves. RCA (0.5.104/0.5.105 self-diagnosing wheels): the announce advertised the node FEDERATION identity (AV-42 rooting key) but the RNS link authenticates under the TRANSPORT identity (same ed25519 signing half, different x25519 enc half), so #314 attribution compared two different keypairs -> source_key_id=None -> SkippedNoSourceKeyId -> binary CRPL hit serde_json -> schema_invalid -> Node A never replied -> 0 envelopes. NOT agent config (the announce is edge init_edge_runtime, not the serve_with_python_adapter key_id tag). Also CIRISEdge#318 (bounded peers map). END TO END: source_key_id=Some -> route_inbound_bytes -> #312 responder answers the IdentityOccurrence round -> agent resolve_peer_kex_pubkeys(canonical)=Some -> KEX PRESENT -> seals -> envelopes_sent>0 -> traces land -> CUT 2.9.7. Agent bumps ciris-server>=0.5.106 (one line) + qa_runner safety_battery --federation-delivery. FOLLOW-UP (NOT bundled, to keep this delivery wheel clean): CIRISServer#232 (ship the verify FFI so the agent drops the standalone ciris-verify pin) ships as the next wheel — a per-platform linker-symbol-export change not worth risking on the 2.9.7-critical wheel; the standalone verify at v9.x is fine meanwhile. Full suite 309/309; clippy(default+python)/fmt/gate green. === PRIOR === 0.5.105 = #317 ADMIT DISAMBIGUATOR (edge v10.0.1->v10.0.2). Patch on the 10.x line; persist v15.1.0 / verify v9.0.0 UNCHANGED; clean pin bump; NO server source change. STILL A DIAGNOSTIC WHEEL (not the delivery fix). edge v10.0.2 (CIRISEdge#317 / CIRISServer#235): the conclusive admit-time disambiguator — logs ed25519_halves_match at admit, deciding 2a (federation-identity vs transport-identity SOURCE split) vs 2b (send-vs-announce dest split) in one line. It also surfaced that EDGE LACKS THE TRANSPORT X25519 at admit (it captures the announce/federation identity, which is why the stored hash != the link-proven RNS transport identity hash sha256(x25519||ed25519)[..16] — confirming the RCA refinement: leviculum compute_hash IS combined, so the gap is the identity SOURCE, not the derivation). A rerun on 0.5.105 will still 0-envelope BUT print the verdict -> scopes the aligned-admit fix to one of three shapes (plumb transport x25519 / capture link identity / agent single-identity). THEN edge ships the fix and I adopt it + bundle CIRISServer#232 (verify FFI) in that wheel. Full suite 309/309; clippy(default+python)/fmt/gate green. Open: #317 (fix pending verdict), CIRISEdge#318 (peers-map bound). === PRIOR === 0.5.104 = SELF-DIAGNOSING edge attribution (edge v9.10.1->v10.0.1, #317 observability). Edge major 9->10; persist v15.1.0 / verify v9.0.0 UNCHANGED; clean pin bump (ReplicationRuntime::start API unchanged across v10; the v10.0.0 major is internal per-dimension replication policy realizing CIRISPersist#425). NO server source change. THIS IS A DIAGNOSTIC WHEEL, NOT THE DELIVERY