[package]
name = "ciris-server"
version = "0.5.144" # 0.5.144 = ROOTED. The production trust root is BAKED and every fresh node boots rooted to it — the arc that started with an empty bundle-shaped placeholder is closed. SUBSTRATE: persist v24.0.0->v24.1.0 + edge v15.6.0->v15.6.1. THE ARTIFACT: canonical_seed.json IS the 2026-07-31 re-minted ceremony bundle, sha256 f9662fdc201b66490f237bfee423bcd426786c1db01f542b1609368b6e99fdff, verified byte-identical to what the ceremony emitted on this machine. THE TWO GATES THAT WERE RED BY DESIGN ARE GREEN: `baked seed: infra:serve -> root humanity-accord via FamilyQuorum (drill Green, kind Family)` and all four infra scopes resolving on BOTH conferral planes (delegation ✓ co-scrub ✓ for serve/attest/store/transport). They asserted the TARGET state through three cuts and were never weakened to match a stale artifact; that discipline is why the bake was verifiable the moment it landed rather than argued about. ROOT PROPERTIES NOW TRUE: the root is the keyless FAMILY, not a seat (A1 alone roots to A1; A1+B1 roots to humanity-accord), the charter is 2-of-2-required over a 3-seat roster, every genesis attestation carries its 2-of-3 co-scrub INTO the graph so a replicated row proves its own quorum, and the drill band is GREEN at genesis because the heartbeat attests the family rather than the signing holder. No single seat can produce, re-root, or betray it. THREE DEFECTS FIXED FROM THE CEREMONY LOG: (1) stage 1 aborted the WHOLE install on ONE pre-existing key record — engine construction seeds the baked genesis, so any node that had booted already held the canonical row, a re-mint re-blesses it, persist rightly refuses to replace an anchored row, and that conflict was ?-propagated so the charter and grants NEVER LANDED; a node came up with no trust root because it had booted before. Conflicts are now stepped over, other errors still fail. (2) verify_bundle warned "carries no accord heartbeat" on a bundle whose heartbeat was exactly right: one variable `root` answered TWO questions — "is the signer a seated holder" (attester, correct) and "is there a drill about the root" (must be the attested family) — which diverge under family rooting. Split into charter_signer / trust_root. THIRD instance of attester-vs-attested in that one file. (3) an INFO line contradicting its own payload every five seconds: "RNS announce rooted (peer now reachable): announce IGNORED: app-data is not a CIRIS attestation". Reticulum is a SHARED network and non-CIRIS neighbours announce constantly; now DEBUG and says what it is. RETIRED: the CIRISPersist#547 characterization pin. It asserted the BROKEN behaviour (adopt_scrub_upgrade mutating federation_keys without maintaining signed_wire_index, so a node advertised a Key ref it could not serve until restart) and started FAILING the moment v24.1.0 fixed the three mutators — which is exactly the signal a good pin exists to give. Restored to the direct expectation. NOT a defect, checked because it looked like one: 30 localization files load 29 locales; the 30th is manifest.json. Prior: 0.5.143 = THE PICKER CRASH FIX — the ceremony was blocked by the CLIENT, not the server. Selecting the USB folder to mint the trust root threw IndexOutOfBoundsException out of DefaultRowSorter (via FilePane.doDirectoryChanged <- JFileChooser.setCurrentDirectory) and took the whole node down: "Shutting down node..." with the YubiKeys out, mid-ceremony. ROOT CAUSE: DirectoryPicker.desktop ran the ENTIRE JFileChooser lifecycle inside withContext(Dispatchers.IO). Swing may only be touched from the Event Dispatch Thread, and setCurrentDirectory on an already-constructed chooser fires a PropertyChangeEvent straight into a live FilePane, which re-sorts and re-lays-out its list — off the EDT that races its own DefaultRowSorter. THREE fixes, because any one alone leaves the others latent: (1) everything runs on the EDT via SwingUtilities.invokeAndWait; (2) the start directory is a CONSTRUCTOR argument — JFileChooser(File) sets it before any UI exists, so no property change is delivered to a live FilePane at all, which is the sturdier spelling even on the EDT; (3) a picker failure is a CANCELLED PICK, never a crash — choosing a folder is a convenience and a look-and-feel quirk on some desktop must never terminate a node holding an in-progress hardware ceremony (the holder can still type the path). SAME BUG IN THE SIBLING: FilePicker.desktop (chat attach) also ran JFileChooser under Dispatchers.IO. Fixed with the correct SPLIT rather than by moving everything: the chooser runs on the EDT, the file READ stays on IO, because a multi-MB attachment must not be read on the event thread. Found by auditing for the pattern rather than the instance. Server-side: NOTHING changed. 0.5.142 remains correct — this is the client half of the same cut. Prior: 0.5.142 = THE BOTH-PLANES FIX — one predicate, so the ceremony confers every scope on BOTH conferral planes. Cut because the genesis_3 candidate (the first real family-rooted mint) came out RIGHT on the delegation plane and WRONG on the co-scrub plane: all four scopes resolved via capability_roots_to_trusted_root with root_kind=Family and plane=FamilyQuorum, every attestation carried 2-of-3 [A1,B1], trust:accepts named humanity-accord — and registration_envelope.roles still said ["infra:serve"] alone. ROOT CAUSE: the re-bless gate asked `carries_infra_serve`, ONE scope. A canonical blessed by an older ceremony carries infra:serve, so the predicate declared it already-blessed and reused the record VERBATIM; because `roles` lives inside the scrub-SIGNED registration_envelope, the other three scopes could never enter it. The delegation plane is minted fresh every ceremony so it got all four — hence right on one axis, wrong on the other, from a single one-question predicate. Same shape as the defect this whole arc has been about, one layer further in: a check that asks about one member of a set and reads as a verdict on the set. FIX: carries_all_serve_scopes (over SERVE_NODE_SCOPES, the same constant both planes already read) replaces carries_infra_serve at the re-bless gate; carries_scope generalizes the three-surface read. A1 now re-scrubs the record with all four, producing a 1-of-N partial that B1 completes in cosign — the same two YubiKey taps, no extra ceremony. FOUND BY THE GATE, NOT BY REVIEW: tests/genesis_bundle_validate.rs now asserts EVERY scope on BOTH planes plus root_kind=Family and plane=FamilyQuorum per scope, against a real candidate via CIRIS_GENESIS_BUNDLE. The delegation-only check that shipped in 0.5.141 would have passed genesis_3 clean. Prior: 0.5.141 = THE THRESHOLD-ROOT CUT — the cut that lets the production trust root be minted CORRECTLY, so the ceremony runs once. SUBSTRATE: persist v23.1.0->v24.0.0 + edge v15.5.1->v15.6.0. BOTH remaining blockers were OUR issues and persist fixed both: #557 (the root is a THRESHOLD, not a seat) and #556 (Attestation.additional_scrubs). WHAT WE FOUND, and how: the 0.5.140/141 baked root conferred infra:serve ALONE — infra:attest/store/transport all resolved None on BOTH conferral planes. Nothing caught it because every test in the tree asked for infra:serve: edge hardcodes SERVE_CAPABILITY and our own validator looped serve_nodes asking for the literal "infra:serve". A suite that asks one question cannot fail the others and it reads as a general verdict — the test was even NAMED ..._makes_a_fresh_node_serve and then reported as "the bundle is valid". THE FOUR SCOPES, each a different authority a canonical exercises at 1.0 (registry+node folded in): infra:serve = answer requests (trace ingest, API, manifests); infra:attest = VOUCH — the registry does not just hand you a manifest, it attests the manifest is authentic, a separate authority from serving the bytes; infra:store = hold bulk content for the mesh (Wikipedia and friends), custody of data that is not its own attestations; infra:transport = relay OTHER nodes traffic, load-bearing for a canonical since it carries the transport_hints every new node dials (and edge v15.7.0 will gate on it FAIL-CLOSED, so it MUST be in the mint). Still excluded and a real boundary: infra:network_presence and hold_*_membership are OWNER-granted, never root-granted — a root that could confer presence would make un-trust unsurvivable. One constant (SERVE_NODE_SCOPES) feeds BOTH planes: grant_envelope (delegation) and all 3 ScrubTarget.roles sites (co-scrub). A node resolving a scope on one plane and not the other is the axis split this project keeps paying for. #557 AS SHIPPED: the charter attests the keyless FAMILY (delegates_to A1->humanity-accord) in the ABOUT set — the roster charters the family, so no single seat declares itself the mesh root — and counts only once its verified scrub set reaches the family threshold. The GRANT is unchanged (A1->canonical): the family is DERIVED from the verified signer set, never named, because a keyless family cannot sign and a granter field naming it would be attribution-by-CLAIM. Reaching the threshold IS the family act. A1 alone roots to A1; A1+B1 roots to the family. TWO LIVE DEFECTS FOUND IMPLEMENTING IT: (1) seed_accord_family had ZERO callers in this tree, so lookup_family returned None, resolve_family_root yielded None, and a correctly family-chartered bundle would have degraded SILENTLY to a single-seat root — the exact transition risk we raised on #557, live in our own boot path; now run in stage 1 ahead of the install per the holders->family->rest ordering contract, with verify_family_seeded as the fail-secure check. (2) charter_of matched attesting==attested (a self-loop), which stops finding the charter the instant it is family-shaped — and "no charter" is a LOUD SKIP at boot, so a mis-shaped mint would have read as an UNMINTED mesh. Now keyed on the charter attestation id, in the code and the harness probes. THE COSIGNER NOW CO-SCRUBS every genesis attestation (idempotent per holder, same canonical bytes as scrub #1 via the same sign_bound primitive, authorization_digest untouched since it covers attestation_envelope and never the scrub set) — without it a family charter can never reach threshold. ACCEPTANCE, per persist: root_kind: Family AND conferral_plane: FamilyQuorum asserted explicitly, because solo 1-of-1 roots stay valid ON PURPOSE — a mis-shaped family charter yields a WORKING single-key root, so silent success is the failure mode and intent must be declared in the test. Those two gates are #[ignore]d RED BY DESIGN until the re-mint; they assert the target, not the stale artifact. CI now builds --features test-anchor: ci.yml ran clippy on default + python only, so a struct-shape change behind that gate compiled green through the whole pipeline and broke exactly when someone built the QA wheel — the audience least able to diagnose it. The agent team hit it and flagged it before we tagged. VALIDATED on 0e98ada by the agent team independently: traceflow exit 0 (seal->consent->converge->arrive->summarize-> SCORED); genesis_seed exit 22, 6 unmet, family_row=1 stable across 49 ticks — the newly reachable RootKind::Family path has no regression, and every red is downstream of the stale baked seed the ceremony will replace. Prior: 0.5.140 = THE SEED CUT — everything needed to mint the production trust root from the UI and hand the seed to persist. SUBSTRATE: persist v22.0.1->v23.0.0 (CIRISPersist#551, the NAMING cut) + edge v15.4.2->v15.5.0. THE SEMANTIC CHANGE, bigger than the renames: `lifecycle_active` LEFT `trust_root_valid` — `valid = edge_exists && root_self_declares && charter_has_recovery && !halt_latched`, and liveness became a banded `drill_freshness` reported BESIDE the verdict. Five conjuncts became four, and the one removed is exactly the one that gave a baked artifact a shelf life. A seed is now valid until revoked/withdrawn/superseded, never until it expires. `edge_exists` survives, so the operator un-trust lever is intact. Renames (clean breaks, no aliases): has_effective_role->has_accord_conferred_role, KeyRecord.roles->capability_roles (ScrubTarget.roles is a VERIFY type and did NOT rename), ACCORD_LIFECYCLE_DIMENSION->ACCORD_HEARTBEAT_DIMENSION, canonical_genesis_records()->canonical_genesis_bundle(). STAGE 1 IMPLEMENTED (the missing half of the happy path): install_trust_root_records + accept_trust_root + install_baked_trust_root, wired into BOTH boot paths because the embedded agent never runs serve_with_adapter. Until now nothing installed a baked bundle and nothing wrote the node trust edge, so a node that did not MINT had edge_exists=false and withheld every trace; the test fixture had been substituting by minting a trust root locally on every node, which is why traceflow proved stages 2-3 and NOTHING about genesis. A charter-less bundle is a LOUD SKIP at boot, not an error — an unminted mesh is a legitimate state and should say so once rather than be inferred from withheld frames 200 rounds later. ONE BUNDLE TYPE, ONE DIGEST: persist v23 owns GenesisBundle/GenesisAuthorization/authorization_digest (its doc credits "producer construction (CIRISServer mesh_genesis)"), so we re-export instead of redeclaring. The compiler forced it and the digest was the dangerous half — holder signatures are taken OVER that digest, so two implementations drifting by a byte would silently invalidate a ceremony quorum. Verified byte-identical before deleting ours. THE SEED SAVES ITSELF: the node writes <cfg.home>/mesh-genesis.json on ceremony completion and returns seed_path. Client-side saving was never robust — the desktop picker opens at USB mount roots and writeTextFile is a hard false on Android/iOS, so on mobile the seed could be displayed and never saved (#310); and it now lands under the CONFIGURED home, not a compiled-in /var/lib/ciris (#309). Best-effort: the bundle is returned regardless, because losing a completed hardware ceremony to a full disk is worse than losing a convenience. 5 pins incl. byte-for-byte round-trip, since that file IS the hand-off to persist. UI DRY: deleted produceGenesis (client + ViewModel) and the orphaned genesisBundleJson state — it called POST /v1/accord/genesis/produce, a route the server does not serve and no screen invoked, left from a 4-step flow that collapsed into 2. The remint path needed no change: genesis/propose -> genesis/cosign, pre-filled from genesis/remint-source, feeding ONE mint. VOCABULARY LOCKED (FSD/NAMING_THE_TRUST_ROOT.md) + the happy path written end to end (FSD/GENESIS_TO_SCORE.md). 54 suites, 452 passed. Prior: 0.5.139 = THE FIRST-CAPACITY-SCORE CUT — the trace plane crosses END TO END for the first time: seal -> consent -> converge -> offer -> attribute -> serve -> fragment -> admit -> materialize -> summarize -> SCORED, by a distinct sovereign identity (anti-Goodhart satisfied by construction, which is why the constitution refused self-attestation). Evidence, on the real wire and independently reproduced by the agent team (TRACEFLOW-SUCCESS, exit 0): canonical trace_events=15, trace:complete:v1 x3 @federation, `emitted capacity:sustained_coherence:v1 attested=ciris-agent-harness-1-... samples=3`. SUBSTRATE: persist v21.17.0->v22.0.1 (safe mesh genesis) + edge v15.2.2->v15.4.2, BOTH local [patch] overrides dropped (the tree builds from tags again). v22.0.1 carries CIRISPersist#545, a v22.0.0 regression WE caught on adoption: the test-anchor genesis synthesizer emitted {tier:SoftwareOnly_TEST,test_anchor:true} while the hardware-attestation type required a non-optional platform_attestation, so persist REFUSED ITS OWN synthesized accord holders as `malformed` (7 trust_root_qa failures). We did NOT paper over it by fabricating platform evidence in the fixture -- that is precisely the fabricated-hardware-claim the synthesizer's own comment forbids, and a fixture that fakes hardware evidence silently certifies the custody path as working (the same shape as the AV-77 bug). v22.0.1 makes the marker an explicit variant with a TYPED refusal. CARRIER RCA (CIRISPersist#541, fixed upstream + our regression pin shipped in v22): the UNSIGNED put_transport_destination preserved the signature columns (#515) while still overwriting FOUR columns the signed envelope covers (asserted_at/epoch/binding_provenance/retired_at) -- #515 modelled "material content" as 3 columns, the verifier checks 9. Corrupt BY CONSTRUCTION, not a race: the monotonic guard REQUIRES asserted_at to advance for the write to apply, so every accepted liveness refresh desynced the row from its own signature -> every peer refused it -> edge's #393 item-2 gate found no hybrid-verified binding -> EVERY inbound frame from that peer dropped, with no error at the drop site. Class, not occurrence: put_identity_occurrence_local had it unguarded too. ADOPTION (#329): AV-77 in-band peer de-admission ARMED on BOTH entry points through one self-proving helper that reads the value back and FAILS BOOT on mismatch -- load-bearing because the embedded agent never runs serve_with_adapter (it boots via federation_delivery::start_and_hold), so arming only the composed path would have left every agent node's sanction gate dormant while the composed node's looked fine, i.e. persist's own "wired but no host could reach it" bug one layer up; AV-78 tier-now-persisted exercised green by the ceremony; AV-75 conferral model CONFIRMED against FSD/TRUST_ROOT_CAPABILITY_GATE.md (DelegatedFromTrustRoot for routine capability -- and their rejected accord-co-scrub answer is not merely an outage but structurally wrong here, since infra:serve is deliberately dual-rooted: a personal node's serve authority roots to its OWNER, a canonical's to the accord). TRACE-GATE LEG B (closes CIRISServer#307): test_bless conferred the serve ROLE (leg A, key-record `roles`) but never the GRANT -- leg B is a delegates_to GRAPH walk (capability_roots_to_trusted_root -> trust_root_valid, a FIVE-conjunct AND: edge_exists && root_self_declares && charter_has_recovery && lifecycle_active && !halt_latched) and nothing built it. Now a miniature trust-root ceremony mints all four rows (charter w/ pre_rotation_commitment, self->root trust edge, accord:lifecycle:v1 liveness score, and on the canonical the replicating serve grant), ALL at tier:federation (mandatory -- counts_in_capability_walk gates on it and list_attestations_by/for SQL-filter it), shared by both entry points, idempotent via graph-state existence checks, with a TrustRootVerdict self-check that logs WHICH conjunct failed. RECIPROCAL CONSENT: consent is directional -- the agent granted the canonical but the canonical never granted back, so its send-set was empty and it withheld its WHOLE attestation plane (#396 item 1); test-admit now emits the reciprocal grant and asserts the list_consent_peers PROJECTION, not the row (a row that exists without its consent_peer_set projection reads as consented and darkens the plane). CC#46 (new in v22): a capacity:* claim about S is refused unless a live `analyze` consent from S covers the attester -- the subject now grants it and we assert the RESOLVED STANCE via resolve_scoped_consent, never the row's existence. FILED FROM THIS ARC: CIRISEdge#425 (9 confirmed silent/effectively-silent refusals + two choke points; fixed in v15.4.0), CIRISEdge#426 + CIRISPersist#543 (the bootstrap/Sybil audit: the receive plane is peer-blind BY DESIGN and that is the bootstrap deadlock-breaker, so the cure is hardening put-gates, not fusing consent onto receive). HARNESS: run_traceflow2.sh is the standing regression gate -- a 7-stage ladder keyed on direct-DB ground truth with a final re-sample, replacing a verdict that printed NO-CARRIER against a working pipeline (it sampled before the scorer's next pass; that false negative cost two full cycles). KNOWN, for the next cut: capacity rows accumulate one per scorer pass instead of superseding on (attester, subject, dimension) -- wants an upsert semantic. Prior: 0.5.138 = THE ONE-NODE-IDENTITY CUT — close the identity-fork class (CIRISServer#315 owner-op 403 + the residual self-record signing fork), QA'd exhaustively so this is the last turn at it. The 0.5.137 field run verified the config reader fix (write->resolve->republish loop alive for the first time) but the owner session's PUT /v1/config/scorer.* 403'd "no responsible party" while /v1/setup/owned-nodes reported is_self:true in the same breath — the #312/#313 disease relocated to the owner-binding gate. RCA: in the embedded fold the reused agent Engine signs every CEG row under local_derived_key_id(), but cfg.key_id was derived from the COMPOSE-path federation signer — two keys for one node. The owner claim / NodeCode / owned-nodes bound under cfg.key_id; the config gate (0.5.137) read local_derived_key_id() -> an owned node 403'd its OWN owner-op. FIX AT THE SOURCE: cfg.key_id now derives from engine.local_derived_key_id() (serve_with_adapter + open_engine_for_cli), a no-op standalone and, in the fold, making cfg.key_id == local_derived_key_id() == emit_attestation_self attester == edge.signer_key_id() by CONSTRUCTION -- every plane reading cfg.key_id (claim, NodeCode, owned-nodes, self-publish) realigns at once. A 3-lens exhaustive identity audit then confirmed single-identity on ALL string planes in both builds (crux edge.signer_key_id()==cfg.key_id proven by #312 delivering on-device) and found ONE residual fork on the SIGNING axis: build_self_key_record signed the node's self-record with a re-opened compose seed (federation_signer(cfg)) while labeling it with the engine id -- a phantom-key masked in the live fold only by the agent pre-registering the correct row + register_self_key swallowing the resulting Conflict. It now signs through an EngineSelfSigner (over Engine::sign_hybrid, the identical bound construction), removing the seed-sameness invariant: the register becomes a clean idempotent match. A 3-lens exhaustive identity audit traced the fold's ACTUAL seed paths (agent CIRIS_HOME/data/local_signing.seed vs server-compose CIRIS_HOME/identity/ed25519.seed -- divergent by construction, phantom minted every fold boot) and confirmed the signing fork is LIVE, not latent. The self-IDENTITY-OCCURRENCE producer is DEFERRED to CIRISServer#313: fixing only its signature would make it publish while carrying PHANTOM content-tier encryption_pubkeys (from SelfEncKeys, a SEPARATE keypair the fold node cannot open content sealed to) -- a worse reverse-path failure than the clean-None it has today. The occurrence needs BOTH halves fixed together (engine signature + enc pubkeys derived from the engine seed), which requires a persist engine.self_enc_pubkeys() accessor (filed). REGRESSION NET (permanent): tests/ownership.rs pins the owner binding found under local_derived_key_id() and NOT the base alias (the 403 encoded) + owned-nodes agreeing with the gate; compose.rs proves a self-record built with alias!=derived-key passes the REAL admission gate signed by the engine identity (boot can't break AND the phantom-key path is gone). Remaining for #313: the occurrence's content-tier encryption_pubkeys (SelfEncKeys, a separate keypair) -- the reverse-path KEX half, does not block outbound first-trace. Acceptance: the filmstrip probe, SHIP CONFIRMED on envelopes_sent>0, now unblocked (owner admitted -> hot knobs -> 30s emit).
edition = "2021"
# MSRV floor is set by the substrate: ciris-verify v5.2.0 requires 1.86
# (persist v6.0.1 is 1.83). Build with the higher of the two.
rust-version = "1.86"
authors = ["Eric Moore <eric@ciris.ai>"]
description = "The fabric node — the federation's headless cohabitation runtime (registry + lens [+ node] over one shared substrate). agent = fabric node + brain. Shipped as both the ciris-server binary and a PyO3 abi3 wheel CIRISAgent consumes. See MISSION.md."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISServer"
readme = "README.md"
publish = false

# CIRISServer is ONE cohabitation composition in TWO shapes (MISSION.md §1.2/§6):
#   - [lib] cdylib  → the PyO3 abi3 wheel CIRISAgent pip-installs (the agent is
#                     pure Python; it consumes ciris-server, not the cores).
#   - [lib] rlib    → so the ciris-server binary links the same composition.
#   - [[bin]]       → the headless fabric node deployment.
# The composition lives in src/lib.rs; src/main.rs is a thin entry point.
[workspace]
# lens-core is absorbed in-tree (CIRISLensCore repo retired); the root package
# composes it as a path dep. node-core folds in here the same way at Server 1.0.
members = ["crates/ciris-lens-core"]
resolver = "2"

[lib]
name = "ciris_server"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ciris-server"
path = "src/main.rs"

[features]
# pkcs11 (the YubiKey / PKCS#11-PIV custody backend) ships in DEFAULT so the
# published wheel + the `ciris-server` binary carry the hardware fed-ID + accord
# custody path out of the box (no special build). `python`/`extension-module` are
# deliberately NOT default — the binary must never link libpython; maturin turns
# them on for the wheel (pyproject [tool.maturin]). TPM/postgres hardware backends
# are auto-on per-target on Linux (see the [target.*] tables below).
default = ["pkcs11"]
# HARNESS-ONLY: forwards to verify-core's test-anchor. Feature unification then
# applies it to the ONE verify instance persist's root_binding uses, so a SW
# test root can anchor the local mesh. NEVER in the prod wheel (CIRISServer#258).
test-anchor = ["ciris-verify-core/test-anchor", "ciris-persist/test-anchor", "ciris-edge/test-anchor"]
# `python` pulls the PyO3 bindings (for the wheel). The binary builds WITHOUT it,
# so a plain `cargo build` never links libpython.
# ONE-WHEEL RE-EXPORT (CIRISServer#4): `python` ALSO turns on the substrate
# crates' OWN pyo3 surfaces (`ciris-persist/pyo3`, `ciris-edge/pyo3`) so their
# `#[pyclass]`es compile into THIS cdylib — one `.so`, one PyO3 type registry,
# so the persist `Engine` handed to edge is the SAME type both sides see (the
# CIRISPersist#109 cross-wheel type-identity bug CANNOT occur). persist names its
# feature `pyo3` (not `python`); edge likewise, and edge's `pyo3` already pulls
# `ciris-persist/pyo3` transitively — both listed for explicitness. verify is
# deliberately ABSENT: it is a ctypes wheel (libciris_verify_ffi.so via
# ctypes.CDLL), not a `#[pymodule]`, so it cannot be a pyo3 submodule.
python = [
    "dep:pyo3",
    # Fold the verify FFI C surface into `_native.so` (CIRISServer#232) — only the
    # wheel the agent loads needs it, so it rides the `python` feature, not the bin.
    "dep:ciris-verify-ffi",
    "ciris-lens-core/python",
    "ciris-persist/pyo3",
    "ciris-edge/pyo3",
]
# `extension-module` is what maturin builds the wheel with (tells PyO3 not to
# link libpython). The bin must NOT enable it. See pyproject.toml [tool.maturin].
# Propagated to the substrate crates so THEIR pyo3 surfaces also skip linking
# libpython (each crate gates `extension-module` as its own feature).
extension-module = [
    "python",
    "pyo3/extension-module",
    "ciris-persist/extension-module",
    "ciris-edge/extension-module",
]
# `pkcs11` turns on the YubiKey (PKCS#11 / PIV) custody backend for the USER
# federation identity (`ciris-server identity create --backend pkcs11`). OFF by
# default: a plain `cargo build` never links `cryptoki`, and the Pkcs11 backend
# honestly returns NotSupported without it. It flips `ciris-keyring/pkcs11` on
# (operator hardware; Linux). The YubiKey path is hardware-validated by the
# operator — there is no token in CI, so it is gated + flagged, not unit-tested.
# Like the per-target `tpm` posture, it is NOT in `default`; build it explicitly
# (`--features pkcs11`) on a Linux box with a token attached.
# `pkcs11` (the YubiKey custody path) pulls `ciris-keyring/pkcs11` directly and
# GLOBALLY: CIRISVerify v6.12.0 made cryptoki build on ALL targets (feature
# parity), so it no longer breaks the macos/android/ios wheels. The ciris-server
# pkcs11 source compiles wherever this feature is on (gated on `feature = "pkcs11"`,
# no target_os restriction). At runtime a target with no PKCS#11 module (e.g.
# android, which reaches a YubiKey over NFC via YubiKit instead) returns
# NotSupported — present everywhere, hardware-validated where a token is attached.
pkcs11 = ["ciris-keyring/pkcs11"]
# NOTE: hardware key custody (TPM/SE/StrongBox) is wired per-TARGET below, not as
# a cargo feature — TPM (tss-esapi) is Linux-only, so a top-level `tpm` feature
# made `--all-features` drag tss-esapi onto Windows/macOS (where it can't build).
# The `[target.'cfg(target_os = "linux")']` table enables keyring/tpm + persist
# postgres on Linux only; runtime auto-detects hardware and degrades to encrypted
# software when absent (`is_hardware_backed()` reports the posture). This mirrors
# the substrate crates' per-target keyring/postgres gating.

# ----------------------------------------------------------------------------
# Dependencies — CIRISServer AUTHORS NO PRIMITIVES. It composes the core
# libraries over ONE shared persist Engine (registry + lens read/write the same
# corpus in-process; per-slice views via Engine::from_shared).
#
# Substrate floor (SHIPPED): persist v8.6.0 / edge v4.5.0 / verify-family v5.11.0
# (ciris-keyring + ciris-crypto + ciris-verify-core), CEG 1.0-RC12. The composition
# root pins the singleton construction; the in-tree ciris-lens-core co-bumps in
# lockstep (MAJOR caret pins persist "8" / edge "4"). edge v4.2.0 ships the relay
# outer-open primitive (`open_av_outer`, CIRISEdge#149) → multi-tier ALM chains
# (benches/alm_chain.rs). All additive; no composition-root API change. pyo3 0.29.
# ----------------------------------------------------------------------------
[dependencies]
# The composed cores (authority + observation; node folds in at Server 1.0).
# ciris-registry-core — re-added at Server 0.5, co-bumped to the 6.6/edge-3.2 floor
# (CIRISRegistry#76). Held OUT of the 0.1 graph: registry-core@main still pins the
# OLD floor (persist 5.5.5 / edge 2.2.2 / verify 5.1.3) and would drag a second
# persist+edge rev into the build. The compose_registry() scaffold stays in
# src/compose.rs; this dep returns once registry co-bumps.
ciris-lens-core     = { path = "crates/ciris-lens-core" } # ABSORBED in-tree (workspace member); CIRISLensCore repo retired
# ciris-node-core   — folds in at Server 1.0 / agent 2.9.10 (a substrate gen behind: persist 4.10).

# The substrate trio (also pulled transitively by the cores; pinned here so the
# composition root owns the singleton construction).
# sqlite on all platforms; postgres is Linux-only (libpq/openssl don't link
# cleanly on the macOS/Windows runners — same posture as persist's own CI). The
# `[target.linux]` table below adds postgres.
# `cirislens_wa_cert` + `cirislens_service_token_revocation` expose the auth
# substrate the fabric absorbs (CIRISServer#9, src/auth): the agent's `wa_cert`
# table (users/WA/OAuth/api-keys) + the `revoked_service_tokens` table.
ciris-persist     = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v24.1.0", features = ["sqlite", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
ciris-edge        = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v15.6.1", features = ["transport-reticulum", "transport-http", "transport-packet-radio", "ffi-uniffi"] }
# Founder-quorum verification + key-id fingerprint at the composition root
# (threshold:: module path — NOT re-exported at the crate root).
# LOCKSTEP: persist v9.4.0 transitively pins verify-core v6.6.x — the whole
# verify family (verify-core/keyring/crypto) MUST ride the SAME tag or cargo
# resolves two ciris_verify_core crates with incompatible ThresholdMember/keyring
# types. v6.6.1 (CIRISVerify#89) adds the create_federation_identity `seal_alias`
# arg the #247 user-key-derived fix consumes. (6.4–6.6 are HUMANITY_ACCORD + STH
# stack — the accord-genesis surface CIRISServer#41 consumes.)
ciris-verify-core = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3" }
# The hybrid crypto primitives (Ed25519 + ML-DSA-65 software signers) — used by
# the portable software identity occurrence to build a `HybridSigningIdentity`
# over two software seeds. Same tag as the rest of the verify family.
ciris-crypto = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["pqc-ml-dsa", "self-enc"] }
# Hardware-backed transport-identity keystore (verify v5.2.0 #68 / edge #99).
# Base = software keystore + byte-identical migration of an existing .rid (works
# everywhere, no libtss2). The real TPM-2.0 / SE / StrongBox backend rides the
# `tpm` feature; runtime auto-detects hardware and falls back to software.
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["software", "pqc-ml-dsa"] }
# The verify FFI (C ABI) — folded into `ciris_server._native.so` (CIRISServer#232)
# so the agent drops its standalone `ciris-verify` wheel and rides us for verify
# too (kills the v9.0.0-vs-v5.1.3 wire/canonical-hash skew, CIRISAgent#917). v9.0.1
# added `rlib` to its crate-type so we can link it; v9.0.2 added
# `ciris_verify_ffi_link_anchor()` (CIRISVerify#189) — we reference it via `#[used]`
# in src/lib.rs so `--gc-sections` cannot dead-strip the ~84 `ciris_verify_*` C
# symbols out of our cdylib. Same tag as the rest of the verify family → the folded
# FFI version == the bundled substrate version by construction (no skew possible).
# Default features (secp256k1, key-grant, hybrid-kex) + the crypto features unify
# with ciris-crypto's above (self-enc, pqc-ml-dsa) across the graph.
ciris-verify-ffi = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", optional = true }

# PyO3 bindings for the abi3 wheel — optional, gated behind the `python` feature
# so the binary never links them. 0.29 matches the persist/edge family floor.
pyo3                = { version = "0.29", features = ["abi3-py310"], optional = true }

tokio   = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
anyhow  = "1"
fs2       = "0.4"   # available-disk check for realistic-minimum feature gating
# GET /v1/identity (the fabric-node identity surface) — merged onto the lens
# read-API listener. axum pinned to lens-core's 0.8 so the merged Router unifies.
axum       = "0.8"
base64     = "0.22"
serde      = { version = "1", features = ["derive"] } # holonomic scoreboard model (benchmarks::)
serde_json = "1"
# Cosmetic v4 attestation-ids (the content hash is the integrity anchor). Direct
# dep at the same major persist already pins transitively — no new resolution.
uuid       = { version = "1", features = ["v4"] }
# Auth subsystem (src/auth, CIRISServer#9): timestamps on the absorbed wa_cert
# rows, SHA-256 for api-key / service-token hashing, hex for the digest wire form.
# All three already in the lock as substrate-transitive deps (no new resolution).
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"
hex        = "0.4"
# Auth gap-close (CIRISServer#9, src/auth): the byte-compatible password KDF +
# the OAuth/native/device-auth outbound-HTTP + JWKS-verify halves. All already in
# the lock as substrate-transitive deps (reqwest/jsonwebtoken via edge+verify;
# pbkdf2/hmac/ed25519-dalek via the crypto family) — pinned here so the auth
# subsystem owns them directly, no new resolution.
# - pbkdf2: reproduce the agent's PBKDF2-HMAC-SHA256(100k) password hash
#   (auth_service.py `_hash_password`/`_verify_password`) byte-for-byte via
#   pbkdf2::pbkdf2_hmac::<Sha256> — the hmac crate is NOT used directly (#152).
# - ed25519-dalek: verify the ROOT mint signature (the agent's `verify_root_signature`).
# - jsonwebtoken: Apple Sign-In RS256 JWKS verification.
# - reqwest (rustls): Google tokeninfo / OAuth code→token / Apple JWKS / Portal HTTP.
# - urlencoding: build the provider authorize-URL query string (matches urlencode).
pbkdf2     = { version = "0.12", default-features = false }
subtle     = "2"     # constant-time password-hash compare (the agent's hmac.compare_digest)
ed25519-dalek = "2"
jsonwebtoken  = "9"
urlencoding   = "2"
async-trait   = "0.1"  # the ProviderClient HTTP seam (async fn in trait)
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Mesh control-plane relay (#128 Phase D, src/mesh_relay.rs): the RNS responder
# dispatches a verified control op into the node's OWN axum Router in-process via
# `tower::ServiceExt::oneshot` (the same-handlers guarantee, RNS_CONTROL_RELAY.md
# §5.4). Already in the lock as axum's own dependency (and a dev-dep) — promoting
# it to a runtime dep adds no new resolution.
tower      = { version = "0.5", features = ["util"] }
# The /v1/federation/events/{channel} SSE bridge (CIRISServer#261,
# src/federation_surface.rs): stream combinators (iter/chain/unfold/map) over
# the edge event-bus broadcast receivers into axum's Sse. Already in the lock
# as axum's own dependency — promoting it adds no new resolution.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2     = "1"     # read the gz'd legacy-trace dump (import-traces subcommand)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking rolling file sink for the node log (so a headless node launched by
# the desktop app logs RELIABLY to <home>/logs/, not just the captured console).
tracing-appender = "0.2"

# Linux-only hardware + Postgres: cargo UNIONS these onto the base deps above.
# - persist `postgres` (libpq/openssl) — Linux deployment + the postgres
#   conformance lane; macOS/Windows stay sqlite-only.
# - keyring `tpm` (tss-esapi / TPM 2.0) — the real hardware backend; needs
#   libtss2 (Linux build dep). Other targets keep the software keystore.
[target.'cfg(target_os = "linux")'.dependencies]
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v24.1.0", features = ["postgres", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
# keyring `tpm` (TPM-at-rest, Linux-only via tss-esapi). `pkcs11` is no longer
# per-target — it rides the global `pkcs11` feature now that cryptoki builds on all
# targets (CIRISVerify v6.12.0).
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["tpm-plugin"] }

# Android (arm64/arm32/x86_64): the keyring `android` backend (JNI → Android
# Keystore/StrongBox); sqlite bundles, no postgres/tpm. Mirrors persist/edge.
[target.'cfg(target_os = "android")'.dependencies]
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["android"] }

# serialport (the RNode LoRa driver dep, src/radio.rs) pulls libudev-sys on Linux,
# which only resolves where libudev exists: desktop/server Linux (gnu, x86_64 or
# aarch64), macOS, Windows. It does NOT cross-compile for armv7 / musl (no libudev
# in the cross sysroot — the release armv7+musl legs panicked on it) and isn't
# usable on android/ios. Gate to exactly the serial-capable targets — the SAME
# predicate guards `pub mod radio` (lib.rs) + the edge attach (compose.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
serialport = "4"

# libsqlite3-sys (pulled by persist's `sqlite` feature) links the SYSTEM libsqlite3
# by default — which the musl / armv7 CROSS sysroots don't provide, so the release
# legs failed at LINK: `unable to find dynamic system library 'sqlite3'`. Compile
# sqlite FROM SOURCE (`bundled`) for exactly those two cross triples — `zig cc`
# builds the C in, statically, no dynamic dependency. Scoped per-triple so every
# mainstream target keeps linking its system sqlite (smaller; matches persist's
# non-mobile default). SAME libsqlite3-sys 0.28 the `sqlite` feature already locks,
# so it UNIFIES to one crate (one `links = "sqlite3"`, no collision).
[target.aarch64-unknown-linux-musl.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[target.armv7-unknown-linux-gnueabihf.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# Test-only — the two-node replication integration test (tests/replication.rs)
# builds + signs CEG batches with the same primitives persist verifies against.
# ed25519-dalek MUST match persist's locked 2.x (the SigningKey type crosses the
# Engine::with_signer / put_public_key API boundary).
[dev-dependencies]
# Generate the mock YubiKey PIV attestation chain (root → f9 → 9c, Ed25519, with
# the Yubico firmware/touch/FIPS extension OIDs) the CC 4.2.2.1 hardware-class
# gate test drives (tests/hardware_class_admission.rs, CIRISServer#159). Nobody
# can mint a cert under the REAL pinned Yubico Attestation Root 1, so proving
# "a valid attestation admits at the claimed class" requires generating a chain
# under a test root — the same way CIRISVerify tests `verify_yubikey_piv_attestation`.
# Already in the locked graph at 0.13.2; dev/test only, no substrate pin touched.
rcgen         = "0.13"
ed25519-dalek = "2"
base64        = "0.22"
chrono        = { version = "0.4", features = ["serde"] }
serde_json    = "1"
criterion     = { version = "0.5", features = ["async_tokio"] }
# Tamper-side raw SQLite handle for the audit hash-chain conformance gate
# (tests/audit_chain.rs): opens the engine's file-backed DB on a SECOND
# connection to corrupt one stored row, the only way to land a tampered entry
# (record_entry validates + rejects, so a broken row can't go in through the
# trait). Pinned to persist's locked 0.31 + same features (NO `bundled` — links
# the platform libsqlite3, matching persist's non-mobile target so the two
# `links = "sqlite3"` crates unify to one symbol set).
rusqlite      = { version = "0.31", features = ["chrono", "serde_json"] }
# Drive the merged axum Router in-process for the HTTP trace-ingest test
# (tests/ingest_http.rs): `ServiceExt::oneshot` + read the response body. tower
# 0.5 / http-body-util 0.1 match axum 0.8's floor (already in-tree transitively).
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
# The PQC primitives the realtime-A/V E2E bench drives directly: hybrid KEX
# (X25519 + ML-KEM-768) for the per-Link transit key, AES-256-GCM for the
# two-layer chunk seal. Same pin/features edge composes (tag parity).
ciris-crypto  = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v10.6.3", version = "10", features = ["hybrid-kex", "aes-gcm", "pqc-ml-dsa", "self-enc"] }
# Enable edge's OWN fountain codec (`codec-fountain`, L1-A) for the survival-floor
# proof — dev/test ONLY (feature unification applies to test/bench builds; the
# shipped wheel stays codec-free, since a relay forwards sealed symbols opaquely
# and never encodes/decodes). This lets tests/chaos_mesh.rs exercise the SUBSTRATE
# codec (`fountain_encode`/`fountain_decode`) directly — a real MEASURED proof,
# not a reference stand-in.
ciris-edge    = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v15.6.1", features = ["codec-fountain"] }
# Enable persist's TEST-ONLY genesis-seam (`test-genesis-seam`, CIRISPersist#387) for the
# accord ceremony tests (tests/accord.rs): `Engine::with_signer_no_genesis_seed` yields a
# clean engine with the baked HUMANITY_ACCORD family seed SKIPPED, so those tests can stand
# up their OWN custom-holder family via the assemble ceremony. Dev/test ONLY — resolver-2
# keeps this feature out of the shipped lib/bin/wheel (prod always seeds the baked family).
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v24.1.0", features = ["test-genesis-seam"] }

# PQC realtime-A/V streaming E2E benchmark (CIRISEdge#62 realtime_av profile).
[[bench]]
name = "pqc_av_streaming"
harness = false

# Replication / corpus-ingest throughput (the CEG-RC5 receive spine).
[[bench]]
name = "replication_ingest"
harness = false

# Multi-tier ALM relay chain (CIRISEdge#149 open_av_outer) — per-hop + per-depth
# cost; the E2E byte-survival invariant is gated in tests/alm_chain.rs.
[[bench]]
name = "alm_chain"
harness = false

# Sustained multi-stream seal throughput — measures the actual core-fraction to
# seal N blob streams @30fps in a real loop (promotes the page's "2,000 blob
# streams ≈ 6-10% of a core" from arithmetic to MEASURED).
[[bench]]
name = "stream_fanout"
harness = false

# N_eff capacity-scoring microbench — the lens constraint eigenspectrum pipeline
# (ciris_server::scorer::n_eff). Feature-matrix build + Jacobi eigendecomposition
# + PR/entropy derivation: the per-agent per-cadence-tick CPU cost of
# `capacity:sustained_coherence:v1`. CI-runnable (pure arithmetic, no network,
# no database).
[[bench]]
name = "n_eff_scoring"
harness = false

# Erasure-survival bench — EMPIRICAL reconstruction rate against the real substrate
# fountain codec (edge codec-fountain / RaptorQ). Encodes a blob into H holders, drops
# holders by a per-availability-tier Bernoulli(q) coin, runs many real decode trials,
# and writes the measured p_reconstruct per tier to target/erasure_survival.json (read
# by the scoreboard). `harness = false` — survival is a rate, not a latency. Codec is
# dev-only, so this measurement lives in a bench. `cargo bench --bench erasure_survival`.
[[bench]]
name = "erasure_survival"
harness = false

# Signature-overhead micro-bench — per-event sign+verify latency for classical
# (Ed25519-only) vs hybrid (Ed25519 + ML-DSA-65, the production provenance signature),
# using the substrate's REAL ciris_crypto primitives. The scoreboard derives the honest
# "+N%" post-quantum overhead from the two criterion medians. `cargo bench --bench sig_overhead`.
[[bench]]
name = "sig_overhead"
harness = false

# Mesh-propagation benchmark — N in-process software-key nodes; ONE group-A
# publisher advertises a synthetic "video" and a FountainSwarmRuntime per node
# converges the holding-claim to its cohort ONLY. Measures propagation latency /
# fan-out / group isolation / throughput over an in-memory bus (swarm LOGIC +
# cohort gate, not wire transport). `cargo run --example mesh_propagation`.
[[example]]
name = "mesh_propagation"
path = "examples/mesh_propagation/main.rs"

[profile.release]
# panic strategy stays "unwind" (the Win7 build-std lane relies on this being
# pinned here, not on the build-std crate list — see release.yml win7 lane).
panic = "unwind"
strip = false   # release workflow strips per-target after build

# ── Build-memory guardrail (do NOT remove without reading this) ───────────────
# `cargo test` does not build one binary — it links the ~32 integration-test
# binaries in tests/*.rs, and EACH statically links the FULL substrate (persist +
# edge + verify + the pyo3 cdylib and all their deps). At the dev/test default of
# full DWARF (`debug = true`) that is ~2-3 GB of peak RSS per link, and cargo runs
# `nproc` jobs by default (32 on this box) → ~32 simultaneous multi-GB links, tens
# of GB over the 31 GiB of RAM. The kernel does not OOM-kill it (no `oom-kill` in
# the log); it swap-THRASHES and the machine goes unresponsive. That is exactly
# what happened once — hence this pin.
#
# `line-tables-only` keeps file:line in panic backtraces (all the suite actually
# needs) while dropping the local-variable DWARF that dominates link memory —
# roughly a 5-10x cut in per-link RSS, so even full-width parallelism fits. It
# also makes CI links faster and lighter, so it is safe on small runners (unlike a
# `[build] jobs` cap, which would OVER-subscribe a 4-core runner).
#
# Stepping through code in a debugger? Override per-invocation, don't edit this:
#   cargo test --config 'profile.dev.debug=2' --config 'profile.test.debug=2'
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"


