ry link. Arc COMPLETE: rootable (#397) → auto-dial (#296 + :4242 #404) → survives-restart (#411/#299) → first-rootable (#301/#413). Follow-on centipede (post-0.6, stronger control — trust-root-blessed build attestation before durable save, software-node-compatible): CIRISVerify#181 → CIRISPersist#415 → CIRISEdge#303 → CIRISServer#219. 0.5.94 = SURVIVES-RESTART + BOOT-UNBRICK (completes the trace-flow substrate arc). Substrate bump persist v13.6.1→v13.8.0 / edge v9.4.1→v9.5.0 (verify v8.10.1 unchanged). Carries the whole line end to end: (1) CIRISPersist#410 (v13.7.0) — the genesis canonical-seed re-bake no longer BRICKS boot on a node that already holds a different anchor-scrubbed record (the :4243→:4242 correction bricked Node A on 0.5.93; seed_canonical_servers now tolerates/upgrades instead of Err-aborting) → NODE A + the whole 0.5.86+ fleet can finally upgrade off 0.5.92. (2) CIRISPersist#411 + CIRISEdge#299 (v13.8.0 / v9.5.0) — SURVIVES-RESTART: the rooted-peer transport binding is now DURABLE. persist's TransportDestination gains transport_x25519_pubkey_base64 (the KEX half, pair to #397's ed25519) + list_all_transport_destinations; edge write-throughs each rooted binding (dest-hash + ed25519 + x25519) to persist on announce-root and BOOT-LOADS all bindings into the transport resolver at startup → a known peer is knows_peer=true and SEALABLE with zero announces after a restart. persist is the source of truth; boot reloads valid rooted state from persist — no re-announce, no re-peer. This is the direct fix for CIRISServer#216 (empty AV-42 registry → resolve_peer_kex_pubkeys=None → 0 envelopes sealed). SERVER wiring: publish_self_transport_destination now saves the X25519 half too (transport_pubkey[0..32]) so THIS node's own binding is fully sealable; the accord canonical address-update (CanonicalAddressUpdate) carries transport_x25519_pubkey_base64 (skip_serializing_if — prior threshold sigs stay byte-identical) so an address move preserves sealability; occurrence-bind + prime-resolve carry the new field. (3) CIRISPersist#405 (overlay honored) rides v13.8.0. NO other server source change. The trace-flow arc: rootable (#397) → auto-dial (#296 + :4242 #404) → address-move (#405/#410) → survives-restart (#299). 0.5.93 = CANONICAL PORT FIX + m-of-n REPLACE (completes the zero-delivery fix end to end). Substrate bump persist v13.6.0→v13.6.1 / edge v9.4.0→v9.4.1 (verify v8.10.1 unchanged). (1) CIRISPersist#404 (v13.6.1): the baked canonical genesis seed (src/federation/genesis/canonical_seed.json) carried the READ-API port in the signed transport hint — `108.61.242.236:4243` (listen+1, the HTTP port) instead of the Reticulum transport port `:4242`. Every fresh node (incl. the agent) auto-seeded its dial (CIRISEdge#296) from that hint → dialed :4243 → spoke RNS at the HTTP API → never rooted. RCA: the read-API port was supplied at the co-scrub ceremony (the client base URL defaults to :4243, so it's the port a human copies) and sealed into the scrub-signed registration_envelope. FIX = re-ran the 2-of-3 co-scrub (A1+B1) over the SAME identity (ciris-canonical-1-d7bdeu223k, pubkeys unchanged) with destination=:4242, persist re-baked the seed. A fresh install now dials :4242 and roots the canonical zero-touch. edge v9.4.1 = coherence re-pin of persist v13.6.1. (2) CLIENT m-of-n replace fix: the Trust Root "Supersede/replace" of an existing canonical routed to the LEGACY 1-of-N addCanonicalServer (CIRISServer#174 migrated Add→co-scrub but left replace behind) — a 1-scrub record FAILS the canonical admission gate (needs distinct_scrub_count ≥ family quorum 2) on fresh installs. Both add AND replace now go through the m-of-n co-scrub (proposeCanonical); the 1-of-N /v1/accord/canonical/add path is now unused from the UI (retire separately). NO server source change (pure substrate adoption + client). Filed CIRISPersist#405 (canonical_bootstrap_hints should honor the mutable transport_destination overlay so a future address move takes effect at runtime without a re-bake). 0.5.92 = TRACE-FLOW UNBLOCK (the release that gets federation traces flowing). Substrate bump persist v13.5.0→v13.6.0 / edge v9.3.0→v9.4.0 (verify v8.10.1 unchanged). CIRISEdge#296: init_edge_runtime now AUTO-SEEDS the canonical TCP dial from persist's baked canonical_bootstrap_hints(). RCA (3-day chase): edge seeded its dial ONLY from the caller-passed bootstrap_peers (pyo3.rs:4741) — rooting was wired + the canonical identity key baked, but the agent-embedded edge (which does NOT run compose::serve) booted with an EMPTY canonical dial → no link to the public canonical → never received its announce → the (already-wired) rooting never fired → knows_peer(canonical)=false → zero delivery. Neither the bake nor edge-init nor rooting was broken; the ONE missing piece was the "read baked hints → seed dial" glue that lived only in ciris-server's compose::serve. Now init_edge_runtime calls the engine's #402 canonical_bootstrap_hints() pyfn cross-wheel, filters kind==ip, unions the TCP dials in (dedup, fail-soft, fully logged) — EVERY direct consumer (the agent) now dials + roots the canonical mesh with zero caller glue, exactly what compose::serve does. CIRISPersist#402 (v13.6.0): canonical_bootstrap_hints() exposed to Python (PyEngine → JSON [{key_id,kind,destination}]) so edge reads a clean hint list instead of parsing signed envelopes. NO server source change — pure substrate adoption; compose::serve's explicit canonical_bootstrap_addrs union is now redundant-but-harmless (dedup covers it), retire next release. ALSO bundles the CI windows-sccache warm (PR #211: warm-release-cache.yml restored, substrate-bump-gated — v0.5.91 windows was 100% cold, proven 0% sccache hits / 445 misses / 21min, because nothing warmed the maturin sccache on main). 0.5.91 = ZERO-TOUCH DELIVERY + CI TRIM (no substrate change; triple stays persist v13.5.0 / edge v9.3.0 / verify v8.10.1). (1) BOOT SELF-PUBLISH (#205 gap #2, the durable close): compose now publi