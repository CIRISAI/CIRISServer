[package]
name = "ciris-server"
version = "0.5.218" # 0.5.218 = ADD A CONTACT BY CODE, AND A SECOND DEVICE THAT CATCHES UP (the maintainer's two flows). CONTACTS: `GET /v1/self/contact-code?nodes=<all|list|none>` returns the person's v3 code (string + QR payload) naming the ANNOUNCED devices they choose, or none (resolved through the public directory) (#673); the device roster is public only for devices the person announced, per device (#655 ruling); `DELETE /v1/contacts/{key_id}` and `POST /v1/federation/peering/revoke` withdraw consent, signed by the person (#657); `GET /v1/admin/self` returns `owner_delegations` (#676). SECOND DEVICE: claim-remote links both devices at once, the device holding the pen re-wraps old self files for the new one, and `POST /v1/self/nodes/{node}/announce` announces another of my devices from the first (#678); replication runs 12 of 17 kinds, every kind routed or excluded by name (#646), so member additions, households and device revocations leave the node. FIXES: OAuth redirect parsed, same-origin path or exact loopback only (#672); a TPM request without a TPM refuses (#639); boot errors carry their whole cause chain (#586); a claimed node finds its consent peers (#601); reproposed chat commits are carried and the chat unopened reason is a token (#602). LADDERS: selffiles in CI (#622, #626), a `devices` scenario (second device joins; old self file opens; family rungs RED-EXPECTED on CIRISPersist#910/#916), ui-chat drives client 0.5.224 with nav derived from the client. Client floor 0.5.224. Known: history from BEFORE a device joined opens only for self files until CIRISPersist#916; restart re-admission waits on CIRISEdge#676 / CIRISPersist#911. PREVIOUS: 0.5.217 = 0.5.217 = A FILE IS WHAT IT SAYS IT IS (CIRISServer#642/#641/#643/#644, for CIRISClient#77 and FSD/MEDIA_EDGE.md): the drive's write gate — every write door (upload, replace, move, notes) requires an RFC 6838 media type whose leading bytes agree with it (`drive.bad_media_type` 400, `drive.format_mismatch` 415 naming declared and sniffed — the same table as the client's RenderTier), and a filename cleaned per RFC 6266 §4.3 (path, control, bidi and zero-width characters removed; `drive.bad_filename` when nothing is left), so a name like `invoice\u202Etxt.exe` no longer replicates as written. The node states the PLAINTEXT digest of what it hands over (CC 5.3.2.5): `content_digest` on `GET /v1/files/{id}` and `/meta`, RFC 9530 `Repr-Digest` on a whole raw read; the edge pointer hash is renamed `at_rest_sha256` (it is the sealed blob's, never the plaintext's; `content_sha256` kept as a deprecated alias). `GET /v1/media/policy` publishes the node's render policy ahead of the ingest pipeline, with `renditions: false`. Notes say `here` like the drive (one word per fact; `drive::BYTE_STATES`). A digest SIGNED into the row, and renditions/placeholders, wait on CIRISEdge#638 and #614. PREVIOUS: 0.5.216 = 0.5.216 = ROSTERS AND FILES, END TO END (FSD/ROSTER_AND_DRIVE_CRUD.md): households (`/v1/families`: create, list, read, add/remove member, role, leave, dissolve, and an envelope → cosign → assemble flow for quorum families — closes CIRISServer#627), N-member communities and affiliations (`/v1/communities`, growth on persist v48's widening plane — CIRISServer#594), the owner's own devices (release a node, relabel a device, revoked devices listed; the self room uses edge's room-keyed handshake so a second device OPENS a file's bytes), and full drive CRUD (replace, rename, withdraw with a 410, move between circles, metadata, raw bytes with Range, a paged drive, notes edit/delete; the split-install viewer key fixed). Every roster read goes through the fold, enforced by a source gate. Known gaps, named in the FSD: a widened community member is refused reads until CIRISPersist#907; roster rows a PEER authors are signature-checked only until CIRISPersist#908; file rows are node-signed until CIRISEdge#675; family changes after creation do not replicate to a peer that already holds the family (CIRISPersist#910); subject take-back deferred. ALSO: ADOPTS EDGE v31.0.0 / PERSIST v48.0.0 (verify v16.1.0 unchanged; CIRISPersist#860/#905, CIRISEdge#672) — THE PROMOTION SWEEP SEES A CLAIMED MACHINE'S CONSENT: persist's `load_active_egress_grants` and the crossing's covering check take a grant by PRINCIPALS (the machine's own, or its bound steward's naming it in `for_key_id`), and V152 keys `consent_peer_set` by `for_key_id` — so an owned agent's sealed traces are promoted by its human's consent, the gate the production-shaped ladder had read as `offerable=0` since the owner's pen went live in 0.5.211. Also #860: a room's roster converges both ways (`CommunityMembershipWidening`, the 17th EnvelopeKind, appended — REPLICATION_POLICY_HASH / CONSENT_GRAMMAR_HASH / edge SERVE_ADVERTISE_POLICY_HASH re-pinned; ABI 5 unchanged); #672: the test-anchor block is persist's to mint (`mint_test_anchor` reproduces our block byte-for-byte; a `_MINTED_BY` line names the pair). EARLIER IN THIS CUT: ALSO ADOPTS EDGE v30.3.1 (CIRISEdge#671 → #673, persist v47.3.0 / verify v16.1.0 unchanged): a peer in no send set is minted a FirstContact recipient confined to exactly this node's allegiance facts (owner-binding, root acceptance, self-charter at federation audience), so a claimed agent Roots a canonical that consents to nobody on first contact — the server's `GET /v1/federation/allegiance` carry stays as the belt. THE ONE REMAINING GATE IS PERSIST'S (CIRISPersist#905): `promote_consented_backlog` loads grants the ENGINE key AUTHORED, and on every claimed install the human authors the grant (FOR the actor, since this cut — the covering door consents once per own key, node written last, and the actor is anchored at claim), so the sealed traces stay at `(self, local)`: the production-shaped ladder on the #636 merge read seal=3 trace_att=3 offerable=0. TAG HELD until persist folds the sweep over principals and edge pins it. PREVIOUSLY IN THIS CUT: THE HEAL LOOKED UP A KEY THAT EXISTS NOWHERE, AND THE TRACE PLANE RELIGHTS ON EDGE v30.3.0 — adopts edge v30.3.0 / persist v47.3.0 (verify v16.1.0 unchanged; CIRISEdge#659/#661/#662 → edge v30.2.0, CIRISPersist#901 → v47.3.0; CIRISServer#632): attribution is not trust (Attributed state; Rooted = a mutual VALID root through the owner-bindings), no baked production dial under a test root, a full responder inbox names its phase and never ends the driver, and `trust_root_valid` gains the holder-hardware leg (a valid root is as attested as its holders — the production seed's three accord holders carry real custody evidence; test roots carry persist's honest `SoftwareOnly_TEST` marker under a live test anchor). Server-side moves: `CallerScope::admits` takes the ROW's room as `cohort_target` (#893/#897), `files::in_room` is persist's gated reader door (caller named, `DrivePage`), `WithholdReason::RecipientNotRooted` classified as a verdict. THE OWNER ACCEPTS THE ROOT (CIRISServer#632 step 2 — the half the adoption alone does not deliver): edge's walk is `∃R ∈ roots_of(owner_of(N)) ∩ roots_of(owner_of(P))`, keyed on the OWNER, and the server had only ever written the NODE's `delegates_to(node → R)` (`accept_trust_root`, bootstrap default trust) — so under edge v30 no owned node was Rooted by any peer. `mesh_genesis::accept_trust_roots_as_owner` writes `delegates_to(owner → R, infra:attest, infra:serve)` at federation with the owner's pen (same envelope shape as the node's, idempotent, never the owner's own key), driven wherever the pen exists: at boot beside the baked-root install (the already-claimed fleet; the production canonical on its one boot with the operator's pen, which now heals the key record AND accepts the root), at both claim arms, and on trust-root import. Under a live TEST anchor the node's own key record carries persist's honest `SoftwareOnly_TEST` marker (a harness node that charters a root is a holder, and v47.3.0 reads an evidence-less holder as an invalid root; never in a production build). Witness: `tests/an_owner_accepts_the_roots_the_node_accepted.rs` — unowned → nothing; claimed → the owner's edge at federation, `trusted_roots_of(owner)` lists it, idempotent, and `trust_root_valid(owner, baked root).valid` by name. Fixture consequences of the persist major: the shared revocation fixture's self-charter signer now carries Layer-A evidence (persist's own remedy), and `trace_round_e2e`'s canonical ACCEPTS the root too — under edge v30 a pair is Rooted only when BOTH accept (it read "AGENT OFFERS 0 ref(s)" with `edge_exists: false` on the canonical). THE HEAL (CIRISServer#606): THE HEAL LOOKED UP A KEY THAT EXISTS NOWHERE (CIRISServer#606, found 2026-09-24 on the production canonical): `auth::ownership::rebind_owner_key_record` located the owner's row by `owner_signer.derived_key_id()`, but production's owner pen is built by `hardware_user_local_signer`, which hands `from_hardware_parts` the DERIVED id — so on that pen `key_id()` IS the registered id and `derived_key_id()` is `<alias>-<fp>-<fp>`, a key registered nowhere (`identity.rs`, CIRISServer#597 §4: "every existing caller reads key_id()"; this door was the one that did not). The canonical is OWNED by the operator's portable fedID and runs the heal on every boot; with the pen placed on disk for one boot the pen resolved (three `responsible-user signer resolved` lines), the heal looked up the doubly-derived id, returned `Absent`, and the `Ok(_) => {}` arm at all three call sites (boot, claim, delivery) swallowed it — no line, row unchanged, and the row stays refused by every verify v15.2 peer. The gate `tests/owner_key_record_rebind.rs` was green throughout because its fixture pen is named by ALIAS, the one shape production never builds. FIX: the CALLER names the row (`owner_of`'s steward at boot/delivery, the binding's `responsible_user_key_id` at claim), the pen must be that key by `key_id()` or `derived_key_id()` and hold the row's pubkeys, and every outcome — `Rebound` / `Bound` / `Absent` / `Unbound{refusal}` / no pen — is logged by name at every site. Gate: a production-shaped pen (named by its derived id) must rebind, a stranger's pen is refused by name, and a source gate pins the key_id() convention. The one-off heal of the canonical's row is the same runbook re-run on this cut (CIRISServer#632 thread). PREVIOUS: 0.5.215 = EVERY IDENTITY THIS NODE IS, AND A FILE AT A CHOSEN COHORT. THE PUBLISH-OWN SET NOW CARRIES EVERY KEY THIS NODE IS (CIRISServer#629): on an actor/node split install (CC 3.4.7.3 Clause A) compose mints a NODE key, MOVES the owner-binding onto it and makes it the wire identity, and the node then attests its identity occurrences AND its `consent:replication:v1` grant with it — while the publish-own set held only `edge.signer_key_id()` (the actor key). Edge publishes a self-plane row only when its attester is in that set, so the node's OWN key record was never offered in a Key round: the far side admitted the actor key, never the node key, and then refused every row the node attested with "attesting_key_id … is not a registered federation key". Measured on the production canonical the same day — five agent keys admitted in one afternoon, ZERO node keys, ZERO rows of any dimension, no trace since 2026-09-18, and the grant authored on the agent and absent on the receiver. The second half of the same bug: `refresh_publish_own_set` asked `owner_of(edge.signer_key_id())`, but the binding had MOVED to the node key, so the owner never entered the set either (`owner_claimed=false` in the agent log). `own_key_ids(edge)` already answered "which keys are us" and two other call sites were gated on consulting it; this one was not. Both halves fixed and the existing gate extended to the publish-own seed — the gate itself had to be fixed twice (a fixed 4 KiB window stopped short of the code, then it matched the doc comment instead of the call), so it now reads whole function bodies with comments stripped. Same actor/node axis as the drive-auth finding below. ALSO: 0.5.215 = A FILE AT A CHOSEN COHORT, AND THE ROW REACHES MY OTHER DEVICE — adopts edge v29.5.0 (persist v46.3.1 / verify v16.1.0 unchanged; CIRISServer#626/#622, CIRISEdge#646): one door writes a file at any cohort and one drive lists everything this person can reach. `POST /v1/files {cohort: self|family|community}` seals through edge's `files::publish` at the ROOM's tier and crosses on a round-trip; `GET /v1/drive` lists it with each row's byte-state NAMED (`not_fetched` = "on another device", 409, vs `not_granted` = "this device holds no grant", 403 — different truths, and only a 200 is done); `GET /v1/files/{id}` opens the bytes. SELF-CHAT IS NOTE-TAKING: `POST /v1/notes` writes an UNNAMED `text/plain` row in the self room, `GET /v1/notes` reads them back, discriminated on type AND absent filename so an uploaded .txt is never reported as something the person wrote. THE SELF ROOM HAS A DRIVER: edge decides (`self_room::decide`), this host drives — `src/self_room_drive.rs` provisions the owner's content-KEM occurrence, then creates / publishes a KeyPackage / adds / removes on a named `loop_cadence` phase, under a watchdog. WHAT IS PROVEN, on a new two-node ladder (`harness/mesh-repro/scenarios/selffiles.sh` — ONE person, TWO devices): rooted=2 one_owner=1 roster=2 room=1 note=1 file=1 **mine_on_b=1** — the file is published, CROSSES, and the owner's second device LISTS it. WHAT IS NOT: `opened_on_b` (the BYTES) is blocked on CIRISEdge#656 — `decide` returns `PublishKeyPackage`/`Add` but edge can only author a KeyPackage or Welcome into a PAIR room, so those rows land in `chat:pair:v1:<hash>`, the creator holds the joiner's KeyPackage and cannot see it (`Added(0)` forever, room stuck at one member), and the second device reads `not_fetched`. The rung stays in the ladder and names that cause; it is promoted back to SUCCESS_STAGE when edge ships `*_attestation_in`. Three defects found by that ladder, none visible in the code containing them: (1) A LOOP CANNOT AUTHORIZE ITSELF WITH A SESSION — `owner_signer_capsule::acquire` reads a bearer, so a daemon could only pass `None` and refused `NotSignedIn` on EVERY tick forever, while the one arm that signs as the NODE (Create) worked, so a node created its self room, logged CREATED and looked healthy; `for_owned_node` is a second AUTHORIZATION (the node's owner binding, as `peer::owner_consent_pen` uses at boot), refusing an unclaimed node by name before opening any seed and verifying the resolved signer derives the key `owner_of` named. (2) THE HANDSHAKE IS NODE-ATTESTED — edge's `rows_in_room` resolves through `list_attestations_by(who)`, written for a chat room where a participant IS a person; a self room's participants are NODES while the person is one owner, so an owner-signed KeyPackage was invisible to the lookup. All four handshake builders take the node signer; the owner's pen stays the crossing ACTOR (the attester names the device, the actor names the authority, CC 3.3.6). (3) A HUNG TICK LOOKED LIKE A HEALTHY QUIET NODE — the loop logged on TRANSITION only, so a non-converging repeat and a wedged await were both silence; `Created`/`Added`/`Removed`/`Failed` now log every time and a tick that overruns 4x its period is abandoned by name. Gates: `tests/a_loop_has_no_bearer.rs`, `tests/the_self_room_handshake_is_node_attested.rs`. Harness: a `self` row needs no GRANT but `send_set_for`'s `nodes_of` is a DIRECTORY read, so the ladder PEERS the devices and waits for the ROSTER before sealing; and `grep -q` under `set -euo pipefail` reports FAILURE on a match (SIGPIPE to the writer, pipefail takes its 141) — it made three rungs read 0 against logs that plainly matched, fixed here and in run_embedded.sh / run_configured.sh. Community files get `comm_file`/`comm_file_on_b` on the chat ladder, the only ladder with two PEOPLE, measured before they gate. FAMILY files are NOT claimed: the consumer side is complete (edge FSD R0-R10, persist's `send_set_for` family arm) but nothing in production can charter a household family or admit a member — `family::create_family` has one caller (the keyless accord, via the trusted-local door) and `family::add_member` has zero (CIRISServer#627). PREVIOUS: 0.5.214 = A CLAIMED NODE READS ITS OWN CONFIG AGAIN — adopts edge v29.3.1 / persist v46.3.1 / verify v16.1.0 (CIRISServer#624 → CIRISPersist#888/#889, CIRISEdge#652): persist's read-side `self` gate compared a RESOLVED caller identity to a RAW row target, so after #873 a claimed node could not read its own `config:*` rows — `GET /v1/config` read `{}` and the second `POST /v1/federation/announce` 500'd on the agent's five-platform gate; v46.3.1 admits the caller's self-collective on both gate twins, and `tests/a_claimed_node_reads_its_own_config.rs` is the witness (red on v46.1.0, green here). Also: edge v29.2.0 `ScopeLifecycle::refresh_members` — `ensure_room_addresses` now REPAIRS a late-resolving member at the same epoch instead of only naming it (CIRISEdge#648); edge v29.3.0 / persist v46.3.0 `send_set_for` — a self row reaches the owner's second device (R2, CIRISPersist#884); verify v16.1.0 `create_federation_identity_in` (CIRISVerify#285) + the orphan `hw_token` stub removed (#283). Also in this cut (CIRISServer#618/#621, PR #620): the ASSOCIATE CUSTODY MATRIX — `POST /v1/self/associate` enrols this host from a hardware-held fed-ID with the two halves custodied independently (classical yubikey|tpm|software × pqc usb|tpm|software, composed through `HardwareRootedIdentity`), arguments validated before any token is touched, and both halves reported from `hardware_type()` rather than the request's words; plus HOME X IS HOME X — a `--home` now seals its own ML-DSA-65 half via verify v16.1.0's `create_federation_identity_in` + `preflight_keys_dir` (CIRISVerify#285), so the database, config, logs, Ed25519 seed AND post-quantum half are all scoped to that home; the 289-line relocation that stood in for the missing parameter is deleted. PREVIOUS: 0.5.213 = THE OWNER RECORD HEALS ITSELF — adopts edge v29.1.0 / persist v46.1.0 (verify v15.2.0 unchanged; CIRISServer#602 update, #606, #609, #612). The version names the NEXT TAG, not the last merge: 0.5.212 is the last tag, and everything since is this cut. Edge v25.2.0 = CIRISEdge#623 (inbound attribution never resolves to this node's own key; no responder is built for ourselves — the defence-in-depth half of #607) + persist v44.7.0 (#864: `Engine::rebind_key_record` — a same-key rebind is an admission). #606 uses that door: a registration record minted before persist #659 carries an envelope of {key_id} only, every verify v15.2.0 peer refuses it, and an OWNER's record rides the first identity round to every node the owner stewards — the production canonical held exactly one such row, the operator's portable identity stewarding nine nodes. auth::ownership::rebind_owner_key_record rebuilds the bound envelope from the row's OWN pubkeys, self-signs it with the owner's pen (refused if the pen does not hold those pubkeys), keeps every other member of the claim, and submits through the door; it runs wherever the owner's pen exists (boot via owner_consent_pen, the fold's author door, both claim-remote arms) and never for a hardware-custodied owner. delivery_status reports owner_key_record = bound | unbound | absent | unknown. Also in this cut: folded_health quiets host-pressure probes (a loaded CI runner made degraded_mode honestly true). THE ROUND SERVES AND THE BINDING CROSSES ON A ROUND-TRIP: the 0.5.212 canonical served zero rounds because edge's replication registry keyed coordinators by (peer, kind) with no role — a peer's inbound frames on a plane we also initiate to queued into the initiator's undrained channel and no responder was ever built (#612 / CIRISEdge#634, found by the in-process probe examples/probe_td_read.rs after three earlier layers: #607 self-prime, CIRISEdge#623 self-attribution, #609/CIRISEdge#624 first-contact carve-out). Edge v25.3.0 fixed the third layer (bootstrap attribution is an equality against the link's proven key, the announce rides the link); edge v26.0.0 fixes the fourth: two role-typed registry tables, CRPL frames carry the round id + direction (wire v3, 0x03 — refused by pre-v26 edges: a v26 node initiates only to v26 peers and answers every older initiator on the legacy path, so a mixed fleet shows one-directional timed_out until it crosses; ship every node on the same edge), and the drop that misdirected this RCA twice is now RouteOutcome::ReplyDropped{reason} + replication_reply_dropped_total / replication_routed_to_{responder,initiator}_total in the snapshot (now folded into GET /v1/federation/metrics `replication_round_routing` and delivery_status().replication_plane.round_routing). MEASURED on the first v26 chat-ladder run (2026-09-19, CIRISServer#612): both role tables build and drain, ReplyDropped 0, responders served on every plane — #634 is closed. On that edge the ladder was STILL red at `bound`, as it had been since v25.3.0 — the fifth layer: the bootstrap door compared a peer's FEDERATION key against the link's TRANSPORT identity (different keypairs on every node, bound by the SignedTransportDestination row), so a node's own record was refused on its own link, the link never attributed, and no Attestation/Community frame from it was admitted; node-a's owner-binding never reached node-b and the joiner withheld its KeyPackage (CIRISEdge#636, proven from the rows). Edge v26.1.0 fixes the door and adds a publish-side kick; the server kicks a coalesced round after the claim, the announce, each consent grant, the fold's author door and every chat row placed in a room (`compose::kick_replication`), so rows cross on a round-trip instead of the next 30 s tick. Persist v44.8.1 (#870): the two blob doors wrote the holds_bytes holder claim WITHOUT a signed_wire_index entry — advertised, never fetchable, so no peer ever learned a holder and every blob-backed body read not_fetched (the chat ladder's arrived=0 on every run since 0.5.207, mis-read as green by the verdict's high-water inference; arrived is REQUIRED now). Under that, three HOST doors the server had never set (found one per ladder run, each behind the last): edge's key-grant engine (ReplicationRuntimeConfig::engine — wraps stored, never projected), the scope-address lifecycle (CIRISEdge#499 — compose ARMED scope-native addressing and never DROVE it; install on Keyed with members = the roster's NODES, advance on epoch, seal on the `scope_seal` cadence) and the blob chunk source (EdgeBuilder::blob_chunk_source — the holder received the scoped BlobChunkFetch and dropped it). All three wired — and edge v27.0.0 (CIRISEdge#640) makes the half-wired node unconstructible: the three receive-side hooks are one type (`SealedContentWiring`: pull_sink ⇒ engine, revocations ⇒ engine) and a scope-native build is refused unless its chunk source declares `answers_scope()`; ours answers from the blob's community-DEK binding, then a referencing row through edge's own BlobMeaning. The last inch is persist's (CIRISPersist#873: `lookup_identity_for_occurrence` is LIMIT 1 with no order, so a node with its owner's login anchor resolves to ITSELF and `would_hold` refuses every community blob a non-author pulls as NotPartyTo); CIRISPersist#876 (the epoch's minter NAMED, not inferred from the author — the adopt wrote (community, person, epoch) while the seal and the key_grant set wrote (community, node, epoch), so authorize_viewer_by_tier missed on the minter member alone and every cross-node community body read NotGranted) is fixed in persist v46.0.0, and the chat ladder is GREEN: rooted=3 peered=2 pulling=1 contact=2 room=1 dark=1 bound=1 sent=1 arrived=1 hamburger=1 — A's bytes landed in B's transcript with their CEG identity intact. The ladder's `arrived` rung is REQUIRED (it had read 0 under `hamburger` since 0.5.207) and its verdict prints the cross-node timeline. Also: GET /v1/contacts rows carry the grant's envelope (#616). Tagged only on a green `bound` + `sent` + `arrived` + `served`. Persist v44.8.0 = the consent scope grammar (#866/#867): the envelope scope member is the normative carrier; one parser + one covering rule; the door refuses a malformed canonical token by name; retain:<window> is honoured (ScopedStance.retain_until, expiry sweep emits consent:state:expired); the transfer grant's principle is read (only share/publish propagate). The server's bare analyze / share / view tokens parse unchanged; resolve_scoped_consent(_by_principals) keep their names. Client floor 0.5.203. SUBSTRATE: persist v49.0.0 / edge v32.1.0 / verify v17.1.0 (roster co-signatures and quorum proofs, the engine as blob evictor so a holds_bytes claim is retracted before its bytes go, Android generation custody credited as persist measures it (#339), the self-room Rejoin arm). FILE TRANSFER: a 25-file corpus over every supported type and size class, round-tripped on Linux/macOS/Windows and accepted by the first device; opening it on a second device waits on CIRISPersist#919 (the consent sweep widens self-room rows) and one size band on CIRISEdge#687.
edition = "2021"
# MSRV floor is set by the substrate: ciris-verify v5.2.0 requires 1.86
# (persist v6.0.1 is 1.83). Build with the higher of the two.
rust-version = "1.86"
authors = ["Eric Moore <eric@ciris.ai>"]
description = "The fabric node — the federation's headless cohabitation runtime (registry + lens [+ node] over one shared substrate). agent = fabric node + brain. Shipped as both the ciris-server binary and a PyO3 abi3 wheel CIRISAgent consumes. See MISSION.md."
license = "AGPL-3.0-or-later"
repository = "https://github.com/CIRISAI/CIRISServer"
readme = "README.md"
publish = false

# CIRISServer is ONE cohabitation composition in TWO shapes (MISSION.md §1.2/§6):
#   - [lib] cdylib  → the PyO3 abi3 wheel CIRISAgent pip-installs (the agent is
#                     pure Python; it consumes ciris-server, not the cores).
#   - [lib] rlib    → so the ciris-server binary links the same composition.
#   - [[bin]]       → the headless fabric node deployment.
# The composition lives in src/lib.rs; src/main.rs is a thin entry point.
[workspace]
# lens-core is absorbed in-tree (CIRISLensCore repo retired); the root package
# composes it as a path dep. node-core folds in here the same way at Server 1.0.
members = ["crates/ciris-lens-core"]
resolver = "2"

[lib]
name = "ciris_server"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "ciris-server"
path = "src/main.rs"

[features]
# pkcs11 (the YubiKey / PKCS#11-PIV custody backend) ships in DEFAULT so the
# published wheel + the `ciris-server` binary carry the hardware fed-ID + accord
# custody path out of the box (no special build). `python`/`extension-module` are
# deliberately NOT default — the binary must never link libpython; maturin turns
# them on for the wheel (pyproject [tool.maturin]). TPM/postgres hardware backends
# are auto-on per-target on Linux (see the [target.*] tables below).
default = ["pkcs11"]
# HARNESS-ONLY: forwards to verify-core's test-anchor. Feature unification then
# applies it to the ONE verify instance persist's root_binding uses, so a SW
# test root can anchor the local mesh. NEVER in the prod wheel (CIRISServer#258).
test-anchor = ["ciris-verify-core/test-anchor", "ciris-persist/test-anchor", "ciris-edge/test-anchor"]
# `python` pulls the PyO3 bindings (for the wheel). The binary builds WITHOUT it,
# so a plain `cargo build` never links libpython.
# ONE-WHEEL RE-EXPORT (CIRISServer#4): `python` ALSO turns on the substrate
# crates' OWN pyo3 surfaces (`ciris-persist/pyo3`, `ciris-edge/pyo3`) so their
# `#[pyclass]`es compile into THIS cdylib — one `.so`, one PyO3 type registry,
# so the persist `Engine` handed to edge is the SAME type both sides see (the
# CIRISPersist#109 cross-wheel type-identity bug CANNOT occur). persist names its
# feature `pyo3` (not `python`); edge likewise, and edge's `pyo3` already pulls
# `ciris-persist/pyo3` transitively — both listed for explicitness. verify is
# deliberately ABSENT: it is a ctypes wheel (libciris_verify_ffi.so via
# ctypes.CDLL), not a `#[pymodule]`, so it cannot be a pyo3 submodule.
python = [
    "dep:pyo3",
    # Fold the verify FFI C surface into `_native.so` (CIRISServer#232) — only the
    # wheel the agent loads needs it, so it rides the `python` feature, not the bin.
    "dep:ciris-verify-ffi",
    "ciris-lens-core/python",
    "ciris-persist/pyo3",
    "ciris-edge/pyo3",
]
# `extension-module` is what maturin builds the wheel with (tells PyO3 not to
# link libpython). The bin must NOT enable it. See pyproject.toml [tool.maturin].
# Propagated to the substrate crates so THEIR pyo3 surfaces also skip linking
# libpython (each crate gates `extension-module` as its own feature).
extension-module = [
    "python",
    "pyo3/extension-module",
    "ciris-persist/extension-module",
    "ciris-edge/extension-module",
]
# `pkcs11` turns on the YubiKey (PKCS#11 / PIV) custody backend for the USER
# federation identity (`ciris-server identity create --backend pkcs11`). OFF by
# default: a plain `cargo build` never links `cryptoki`, and the Pkcs11 backend
# honestly returns NotSupported without it. It flips `ciris-keyring/pkcs11` on
# (operator hardware; Linux). The YubiKey path is hardware-validated by the
# operator — there is no token in CI, so it is gated + flagged, not unit-tested.
# Like the per-target `tpm` posture, it is NOT in `default`; build it explicitly
# (`--features pkcs11`) on a Linux box with a token attached.
# `pkcs11` (the YubiKey custody path) pulls `ciris-keyring/pkcs11` directly and
# GLOBALLY: CIRISVerify v6.12.0 made cryptoki build on ALL targets (feature
# parity), so it no longer breaks the macos/android/ios wheels. The ciris-server
# pkcs11 source compiles wherever this feature is on (gated on `feature = "pkcs11"`,
# no target_os restriction). At runtime a target with no PKCS#11 module (e.g.
# android, which reaches a YubiKey over NFC via YubiKit instead) returns
# NotSupported — present everywhere, hardware-validated where a token is attached.
pkcs11 = ["ciris-keyring/pkcs11"]
# NOTE: hardware key custody (TPM/SE/StrongBox) is wired per-TARGET below, not as
# a cargo feature — TPM (tss-esapi) is Linux-only, so a top-level `tpm` feature
# made `--all-features` drag tss-esapi onto Windows/macOS (where it can't build).
# The `[target.'cfg(target_os = "linux")']` table enables keyring/tpm + persist
# postgres on Linux only; runtime auto-detects hardware and degrades to encrypted
# software when absent (`is_hardware_backed()` reports the posture). This mirrors
# the substrate crates' per-target keyring/postgres gating.

# ----------------------------------------------------------------------------
# Dependencies — CIRISServer AUTHORS NO PRIMITIVES. It composes the core
# libraries over ONE shared persist Engine (registry + lens read/write the same
# corpus in-process; per-slice views via Engine::from_shared).
#
# Substrate floor (SHIPPED): persist v8.6.0 / edge v4.5.0 / verify-family v5.11.0
# (ciris-keyring + ciris-crypto + ciris-verify-core), CEG 1.0-RC12. The composition
# root pins the singleton construction; the in-tree ciris-lens-core co-bumps in
# lockstep (MAJOR caret pins persist "8" / edge "4"). edge v4.2.0 ships the relay
# outer-open primitive (`open_av_outer`, CIRISEdge#149) → multi-tier ALM chains
# (benches/alm_chain.rs). All additive; no composition-root API change. pyo3 0.29.
# ----------------------------------------------------------------------------
[dependencies]
# Pinned to the SAME minor persist uses (its Cargo.toml: h3o = "0.7") so the
# lockfile resolves ONE h3o. Two versions would mean two CellIndex types and a
# cell this crate mints could fail persist's own parse — the duplicate-dep
# shape the 2026-07-03 audit flagged, in the one place where it would surface
# as a signed row persist refuses.
h3o = "0.7"
# The composed cores (authority + observation; node folds in at Server 1.0).
# ciris-registry-core — re-added at Server 0.5, co-bumped to the 6.6/edge-3.2 floor
# (CIRISRegistry#76). Held OUT of the 0.1 graph: registry-core@main still pins the
# OLD floor (persist 5.5.5 / edge 2.2.2 / verify 5.1.3) and would drag a second
# persist+edge rev into the build. The compose_registry() scaffold stays in
# src/compose.rs; this dep returns once registry co-bumps.
ciris-lens-core     = { path = "crates/ciris-lens-core" } # ABSORBED in-tree (workspace member); CIRISLensCore repo retired
# ciris-node-core   — folds in at Server 1.0 / agent 2.9.10 (a substrate gen behind: persist 4.10).

# The substrate trio (also pulled transitively by the cores; pinned here so the
# composition root owns the singleton construction).
# sqlite on all platforms; postgres is Linux-only (libpq/openssl don't link
# cleanly on the macOS/Windows runners — same posture as persist's own CI). The
# `[target.linux]` table below adds postgres.
# `cirislens_wa_cert` + `cirislens_service_token_revocation` expose the auth
# substrate the fabric absorbs (CIRISServer#9, src/auth): the agent's `wa_cert`
# table (users/WA/OAuth/api-keys) + the `revoked_service_tokens` table.
ciris-persist     = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v49.0.0", features = ["sqlite", "scrub", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
ciris-edge        = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v32.1.0", features = ["transport-reticulum", "transport-http", "transport-packet-radio", "ffi-uniffi"] }
# Founder-quorum verification + key-id fingerprint at the composition root
# (threshold:: module path — NOT re-exported at the crate root).
# LOCKSTEP: persist v9.4.0 transitively pins verify-core v6.6.x — the whole
# verify family (verify-core/keyring/crypto) MUST ride the SAME tag or cargo
# resolves two ciris_verify_core crates with incompatible ThresholdMember/keyring
# types. v6.6.1 (CIRISVerify#89) adds the create_federation_identity `seal_alias`
# arg the #247 user-key-derived fix consumes. (6.4–6.6 are HUMANITY_ACCORD + STH
# stack — the accord-genesis surface CIRISServer#41 consumes.)
#
# ── THIS PIN IS NOT OURS TO MOVE (CIRISServer#340, measured 2026-08-02) ──────
# The LOCKSTEP note above is stronger than it reads: it is not advice, it is a
# CEILING. persist v24.2.0 and edge v15.9.1 — the LATEST tag of each — both pin
# verify at `tag = "v10.6.3"`, and a cargo git `tag` is part of the SOURCE ID,
# not a semver range. Bumping the verify pins (seven here, three more in
# crates/ciris-lens-core) to v10.9.0 therefore does not upgrade verify; it FORKS
# it — one of them alone is enough. The graph carries two `ciris_keyring` +
# `ciris_verify_core` crates, and every substrate type that crosses the seam
# (`HardwareType`, `PlatformAttestation`, `ThresholdMember`, `SignedCegObject`)
# becomes two incompatible types. Measured: 19 lib + 24 lib-test type-mismatch
# errors, all of the form "expected `ciris_keyring::types::HardwareType`, found
# `ciris_keyring::HardwareType`".
#
# There is no in-repo escape. `[patch."https://github.com/CIRISAI/CIRISVerify"]`
# is rejected by cargo 1.97 — "patches must point to different sources" — for
# ANY entry on the same canonical URL, `tag` or `rev` alike (probed, not
# assumed). `[replace]` requires an identical version and 10.9.0 != 10.6.3. The
# only honest fixes are upstream: persist and edge repin verify, then we follow.
# Until then this line moves ONLY as part of a persist+edge co-bump.
#
# What that ceiling costs us is recorded where it bites, not here:
# src/hardware_attestation.rs (CIRISServer#339 / CIRISVerify#199).
ciris-verify-core = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0" }
# The hybrid crypto primitives (Ed25519 + ML-DSA-65 software signers) — used by
# the portable software identity occurrence to build a `HybridSigningIdentity`
# over two software seeds. Same tag as the rest of the verify family.
ciris-crypto = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", features = ["pqc-ml-dsa", "self-enc"] }
# Hardware-backed transport-identity keystore (verify v5.2.0 #68 / edge #99).
# Base = software keystore + byte-identical migration of an existing .rid (works
# everywhere, no libtss2). The real TPM-2.0 / SE / StrongBox backend rides the
# `tpm` feature; runtime auto-detects hardware and falls back to software.
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", features = ["software", "pqc-ml-dsa"] }
# The verify FFI (C ABI) — folded into `ciris_server._native.so` (CIRISServer#232)
# so the agent drops its standalone `ciris-verify` wheel and rides us for verify
# too (kills the v9.0.0-vs-v5.1.3 wire/canonical-hash skew, CIRISAgent#917). v9.0.1
# added `rlib` to its crate-type so we can link it; v9.0.2 added
# `ciris_verify_ffi_link_anchor()` (CIRISVerify#189) — we reference it via `#[used]`
# in src/lib.rs so `--gc-sections` cannot dead-strip the ~84 `ciris_verify_*` C
# symbols out of our cdylib. Same tag as the rest of the verify family → the folded
# FFI version == the bundled substrate version by construction (no skew possible).
# Default features (secp256k1, key-grant, hybrid-kex) + the crypto features unify
# with ciris-crypto's above (self-enc, pqc-ml-dsa) across the graph.
ciris-verify-ffi = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", optional = true }

# PyO3 bindings for the abi3 wheel — optional, gated behind the `python` feature
# so the binary never links them. 0.29 matches the persist/edge family floor.
pyo3                = { version = "0.29", features = ["abi3-py310"], optional = true }

tokio   = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
anyhow  = "1"
fs2       = "0.4"   # available-disk check for realistic-minimum feature gating
# GET /v1/identity (the fabric-node identity surface) — merged onto the lens
# read-API listener. axum pinned to lens-core's 0.8 so the merged Router unifies.
axum       = "0.8"
base64     = "0.22"
serde      = { version = "1", features = ["derive"] } # holonomic scoreboard model (benchmarks::)
serde_json = "1"
# glibc's own allocator accounting (`mallinfo2`), for the one question no read
# of /proc/<pid> can answer: live (`uordblks`) vs freed-but-held (`fordblks`).
# Runtime-gated behind `--diagnostics` and loopback-only; the same instrument
# CIRISStatus ships (its src/diag.rs, CIRISStatus#69) so the two nodes on the
# canonical host are comparable. See `src/diag.rs` / CIRISServer#550.
libc = "0.2"
# The OS-level SIGTERM hook behind `node_control::install_terminate_broker`
# (CIRISServer#555/#556). tokio's own signal streams are bound to the runtime
# that created them and drained by whichever runtime's driver wakes first —
# fine inside one runtime, not for a receiver that must outlive every serve
# call and be observable from any of them. This is the crate tokio itself
# registers through; the handler writes one byte to a socketpair and a plain
# thread does the rest. Unix only in practice (no-op elsewhere).
signal-hook-registry = "1"
# Cosmetic v4 attestation-ids (the content hash is the integrity anchor). Direct
# dep at the same major persist already pins transitively — no new resolution.
uuid       = { version = "1", features = ["v4"] }
# Auth subsystem (src/auth, CIRISServer#9): timestamps on the absorbed wa_cert
# rows, SHA-256 for api-key / service-token hashing, hex for the digest wire form.
# All three already in the lock as substrate-transitive deps (no new resolution).
chrono     = { version = "0.4", features = ["serde"] }
sha2       = "0.10"
hex        = "0.4"
# Auth gap-close (CIRISServer#9, src/auth): the byte-compatible password KDF +
# the OAuth/native/device-auth outbound-HTTP + JWKS-verify halves. All already in
# the lock as substrate-transitive deps (reqwest/jsonwebtoken via edge+verify;
# pbkdf2/hmac/ed25519-dalek via the crypto family) — pinned here so the auth
# subsystem owns them directly, no new resolution.
# - pbkdf2: reproduce the agent's PBKDF2-HMAC-SHA256(100k) password hash
#   (auth_service.py `_hash_password`/`_verify_password`) byte-for-byte via
#   pbkdf2::pbkdf2_hmac::<Sha256> — the hmac crate is NOT used directly (#152).
# - ed25519-dalek: verify the ROOT mint signature (the agent's `verify_root_signature`).
# - jsonwebtoken: Apple Sign-In RS256 JWKS verification.
# - reqwest (rustls): Google tokeninfo / OAuth code→token / Apple JWKS / Portal HTTP.
# - urlencoding: build the provider authorize-URL query string (matches urlencode).
pbkdf2     = { version = "0.12", default-features = false }
hmac       = "0.12"  # CIRISServer#394 — the session-token MAC (the agent bcrypt-verifies its API keys; a self-verifying MAC is the stateless analogue)
subtle     = "2"     # constant-time password-hash compare (the agent's hmac.compare_digest)
ed25519-dalek = "2"
# Already in the locked graph transitively (ed25519-dalek, the ML-KEM/DSA stack and
# rustls all pull it); a DIRECT dep so the transient authorizer open in identity.rs
# can WIPE the portable seeds it read rather than trusting the optimizer not to
# elide a hand-written overwrite. Zero new supply-chain surface — same crate, same
# version the lock already pins.
zeroize       = "1"
jsonwebtoken  = "9"
urlencoding   = "2"
async-trait   = "0.1"  # the ProviderClient HTTP seam (async fn in trait)
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Mesh control-plane relay (#128 Phase D, src/mesh_relay.rs): the RNS responder
# dispatches a verified control op into the node's OWN axum Router in-process via
# `tower::ServiceExt::oneshot` (the same-handlers guarantee, RNS_CONTROL_RELAY.md
# §5.4). Already in the lock as axum's own dependency (and a dev-dep) — promoting
# it to a runtime dep adds no new resolution.
tower      = { version = "0.5", features = ["util"] }
# The /v1/federation/events/{channel} SSE bridge (CIRISServer#261,
# src/federation_surface.rs): stream combinators (iter/chain/unfold/map) over
# the edge event-bus broadcast receivers into axum's Sse. Already in the lock
# as axum's own dependency — promoting it adds no new resolution.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
flate2     = "1"     # read the gz'd legacy-trace dump (import-traces subcommand)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Non-blocking rolling file sink for the node log (so a headless node launched by
# the desktop app logs RELIABLY to <home>/logs/, not just the captured console).
tracing-appender = "0.2"

# Linux-only hardware + Postgres: cargo UNIONS these onto the base deps above.
# - persist `postgres` (libpq/openssl) — Linux deployment + the postgres
#   conformance lane; macOS/Windows stay sqlite-only.
# - keyring `tpm` (tss-esapi / TPM 2.0) — the real hardware backend; needs
#   libtss2 (Linux build dep). Other targets keep the software keystore.
[target.'cfg(target_os = "linux")'.dependencies]
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v49.0.0", features = ["postgres", "scrub", "cirisgraph", "cirislens_wa_cert", "cirislens_service_token_revocation", "cirisaudit", "cirislens_tasks", "cirislens_thoughts", "cirislens_tickets", "cirislens_correlations", "cirislens_deferral_reports", "cirislens_maintenance_locks", "cirislens_creation_ceremonies", "cirislens_legacy_migration", "cirisincident", "telemetry", "secrets"] }
# keyring `tpm` (TPM-at-rest, Linux-only via tss-esapi). `pkcs11` is no longer
# per-target — it rides the global `pkcs11` feature now that cryptoki builds on all
# targets (CIRISVerify v6.12.0).
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", features = ["tpm-plugin"] }

# Android (arm64/arm32/x86_64): the keyring `android` backend (JNI → Android
# Keystore/StrongBox); sqlite bundles, no postgres/tpm. Mirrors persist/edge.
[target.'cfg(target_os = "android")'.dependencies]
ciris-keyring = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", features = ["android"] }

# serialport (the RNode LoRa driver dep, src/radio.rs) pulls libudev-sys on Linux,
# which only resolves where libudev exists: desktop/server Linux (gnu, x86_64 or
# aarch64), macOS, Windows. It does NOT cross-compile for armv7 / musl (no libudev
# in the cross sysroot — the release armv7+musl legs panicked on it) and isn't
# usable on android/ios. Gate to exactly the serial-capable targets — the SAME
# predicate guards `pub mod radio` (lib.rs) + the edge attach (compose.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows", all(target_os = "linux", target_env = "gnu", any(target_arch = "x86_64", target_arch = "aarch64"))))'.dependencies]
# scrub-ner (persist) lives HERE and not in [dependencies], because it pulls
# `tokenizers` -> `onig_sys` (oniguruma, a C library) and that fails to link on
# iOS arm64: `Undefined symbols: ___chkstk_darwin, referenced from _match_at in
# libonig_sys`. The wheel-size cost was measured (+4.18 MiB) and the LINK was
# not — the iOS lane found it.
#
# The absence is already handled rather than fatal: `crate::scrub::EgressScrubber`
# checks `ner::is_configured()` per batch, so a platform without NER scrubs
# `full_traces` at Detailed and RELABELS the trace `detailed`, loudly. A mobile
# node therefore never ships content claiming a scrub it did not receive; it
# simply cannot offer the NER tier.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v49.0.0", features = ["scrub-ner"] }
serialport = "4"

# libsqlite3-sys (pulled by persist's `sqlite` feature) links the SYSTEM libsqlite3
# by default — which the musl / armv7 CROSS sysroots don't provide, so the release
# legs failed at LINK: `unable to find dynamic system library 'sqlite3'`. Compile
# sqlite FROM SOURCE (`bundled`) for exactly those two cross triples — `zig cc`
# builds the C in, statically, no dynamic dependency. Scoped per-triple so every
# mainstream target keeps linking its system sqlite (smaller; matches persist's
# non-mobile default). SAME libsqlite3-sys 0.28 the `sqlite` feature already locks,
# so it UNIFIES to one crate (one `links = "sqlite3"`, no collision).
[target.aarch64-unknown-linux-musl.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

[target.armv7-unknown-linux-gnueabihf.dependencies]
libsqlite3-sys = { version = "0.28", features = ["bundled"] }

# Test-only — the two-node replication integration test (tests/replication.rs)
# builds + signs CEG batches with the same primitives persist verifies against.
# ed25519-dalek MUST match persist's locked 2.x (the SigningKey type crosses the
# Engine::with_signer / put_public_key API boundary).
[dev-dependencies]
# Generate the mock YubiKey PIV attestation chain (root → f9 → 9c, Ed25519, with
# the Yubico firmware/touch/FIPS extension OIDs) the CC 4.2.2.1 hardware-class
# gate test drives (tests/hardware_class_admission.rs, CIRISServer#159). Nobody
# can mint a cert under the REAL pinned Yubico Attestation Root 1, so proving
# "a valid attestation admits at the claimed class" requires generating a chain
# under a test root — the same way CIRISVerify tests `verify_yubikey_piv_attestation`.
# Already in the locked graph at 0.13.2; dev/test only, no substrate pin touched.
rcgen         = "0.13"
ed25519-dalek = "2"
base64        = "0.22"
chrono        = { version = "0.4", features = ["serde"] }
serde_json    = "1"
criterion     = { version = "0.5", features = ["async_tokio"] }
# Tamper-side raw SQLite handle for the audit hash-chain conformance gate
# (tests/audit_chain.rs): opens the engine's file-backed DB on a SECOND
# connection to corrupt one stored row, the only way to land a tampered entry
# (record_entry validates + rejects, so a broken row can't go in through the
# trait). Pinned to persist's locked 0.31 + same features (NO `bundled` — links
# the platform libsqlite3, matching persist's non-mobile target so the two
# `links = "sqlite3"` crates unify to one symbol set).
rusqlite      = { version = "0.31", features = ["chrono", "serde_json"] }
# Drive the merged axum Router in-process for the HTTP trace-ingest test
# (tests/ingest_http.rs): `ServiceExt::oneshot` + read the response body. tower
# 0.5 / http-body-util 0.1 match axum 0.8's floor (already in-tree transitively).
tower            = { version = "0.5", features = ["util"] }
http-body-util   = "0.1"
# The PQC primitives the realtime-A/V E2E bench drives directly: hybrid KEX
# (X25519 + ML-KEM-768) for the per-Link transit key, AES-256-GCM for the
# two-layer chunk seal. Same pin/features edge composes (tag parity).
ciris-crypto  = { git = "https://github.com/CIRISAI/CIRISVerify", tag = "v17.1.0", version = "17", features = ["hybrid-kex", "aes-gcm", "pqc-ml-dsa", "self-enc"] }
# Enable edge's OWN fountain codec (`codec-fountain`, L1-A) for the survival-floor
# proof — dev/test ONLY (feature unification applies to test/bench builds; the
# shipped wheel stays codec-free, since a relay forwards sealed symbols opaquely
# and never encodes/decodes). This lets tests/chaos_mesh.rs exercise the SUBSTRATE
# codec (`fountain_encode`/`fountain_decode`) directly — a real MEASURED proof,
# not a reference stand-in.
ciris-edge    = { git = "https://github.com/CIRISAI/CIRISEdge", tag = "v32.1.0", features = ["codec-fountain"] }
# Enable persist's TEST-ONLY genesis-seam (`test-genesis-seam`, CIRISPersist#387) for the
# accord ceremony tests (tests/accord.rs): `Engine::with_signer_pre_genesis` yields a clean
# engine with the HUMANITY_ACCORD genesis seed SKIPPED, so those tests can stand up their OWN
# custom-holder family via the assemble ceremony.
#
# persist v31.0.0 REMOVED the `test-genesis-seam` feature that used to fence this (it was
# `with_signer_no_genesis_seed`). Not a relaxation — the reverse: v31 is the binary that RUNS
# the genesis ceremony producing the root a later cut bakes, so it must be able to start
# without one. Pre-genesis is now a supported boot mode, not a test seam, and an Engine built
# that way reports `GenesisPosture::PreGenesis` while every ROOT_REQUIRING_GATES gate refuses
# with `NoConstitutionalRootYet`. A node that trusts nothing is not a node that checks nothing.
ciris-persist = { git = "https://github.com/CIRISAI/CIRISPersist", tag = "v49.0.0" }

# The QA runner exercises the family/accord ceremony surfaces against a
# CONTROLLABLE roster — holders it can sign as. persist v31.0.0 made roster growth
# require an `AdmitSpec`: hybrid signatures over the GROWN record, by a registered
# authority. Producing one needs persist's `cohort::test_support` signing helpers,
# which live behind `test-anchor`.
#
# So the example is gated rather than softened. The alternative — an unsigned or
# stubbed spec — would make the QA runner exercise a path production cannot take,
# which is worse than not building it by default.
[[example]]
name = "qa_runner"
required-features = ["test-anchor"]

# PQC realtime-A/V streaming E2E benchmark (CIRISEdge#62 realtime_av profile).
[[bench]]
name = "pqc_av_streaming"
harness = false

# Replication / corpus-ingest throughput (the CEG-RC5 receive spine).
[[bench]]
name = "replication_ingest"
harness = false

# Multi-tier ALM relay chain (CIRISEdge#149 open_av_outer) — per-hop + per-depth
# cost; the E2E byte-survival invariant is gated in tests/alm_chain.rs.
[[bench]]
name = "alm_chain"
harness = false

# Sustained multi-stream seal throughput — measures the actual core-fraction to
# seal N blob streams @30fps in a real loop (promotes the page's "2,000 blob
# streams ≈ 6-10% of a core" from arithmetic to MEASURED).
[[bench]]
name = "stream_fanout"
harness = false

# N_eff capacity-scoring microbench — the lens constraint eigenspectrum pipeline
# (ciris_server::scorer::n_eff). Feature-matrix build + Jacobi eigendecomposition
# + PR/entropy derivation: the per-agent per-cadence-tick CPU cost of
# `capacity:sustained_coherence:v1`. CI-runnable (pure arithmetic, no network,
# no database).
[[bench]]
name = "n_eff_scoring"
harness = false

# Erasure-survival bench — EMPIRICAL reconstruction rate against the real substrate
# fountain codec (edge codec-fountain / RaptorQ). Encodes a blob into H holders, drops
# holders by a per-availability-tier Bernoulli(q) coin, runs many real decode trials,
# and writes the measured p_reconstruct per tier to target/erasure_survival.json (read
# by the scoreboard). `harness = false` — survival is a rate, not a latency. Codec is
# dev-only, so this measurement lives in a bench. `cargo bench --bench erasure_survival`.
[[bench]]
name = "erasure_survival"
harness = false

# Signature-overhead micro-bench — per-event sign+verify latency for classical
# (Ed25519-only) vs hybrid (Ed25519 + ML-DSA-65, the production provenance signature),
# using the substrate's REAL ciris_crypto primitives. The scoreboard derives the honest
# "+N%" post-quantum overhead from the two criterion medians. `cargo bench --bench sig_overhead`.
[[bench]]
name = "sig_overhead"
harness = false

# Chat throughput + MEMORY PRESSURE — the four-phase bench behind
# .github/workflows/chat-bench.yml, modelled on CIRISAgent's memory-benchmark.yml
# (cold start / 100-message warm / 1000-message burst / idle tail, RSS sampled at
# every boundary). Drives the REAL `contacts_chat::router` over a bound listener
# against an in-memory engine — no criterion, because what is being measured is a
# SHAPE across phases, not a distribution around one operation. `harness = false`
# and one JSON object per phase on stdout (jsonl).
# `cargo bench --bench chat_throughput`.
[[bench]]
name = "chat_throughput"
harness = false

# Mesh-propagation benchmark — N in-process software-key nodes; ONE group-A
# publisher advertises a synthetic "video" and a FountainSwarmRuntime per node
# converges the holding-claim to its cohort ONLY. Measures propagation latency /
# fan-out / group isolation / throughput over an in-memory bus (swarm LOGIC +
# cohort gate, not wire transport). `cargo run --example mesh_propagation`.
[[example]]
name = "mesh_propagation"
path = "examples/mesh_propagation/main.rs"

[profile.release]
# panic strategy stays "unwind" (the Win7 build-std lane relies on this being
# pinned here, not on the build-std crate list — see release.yml win7 lane).
panic = "unwind"
strip = false   # release workflow strips per-target after build

# ── CIRISServer#378 — thin LTO + one codegen unit ────────────────────────────
# This cdylib statically links the ENTIRE substrate (persist + edge + verify),
# so the default 16 codegen units duplicate and under-inline across a very large
# graph. Thin LTO plus `codegen-units = 1` is the standard fix.
#
# It was tried once in 0.5.158 and reverted, for a reason worth keeping: the
# measurement compared a CI `extension-module` build against a plain
# `cargo build --lib`. Different feature sets, not comparable, so the reported
# win was meaningless. This time both sides are the SAME `maturin build
# --release --strip` wheel, same features, same box, same command:
#
#   before  97.32 MiB      after  90.13 MiB      -7.19 MiB (-7.4%)
#
# Against the 99 MB CI gate that binds hardest on Windows (98 MB at 0.5.165 —
# one megabyte of room), that buys back roughly seven releases of the ~1 MB-per-
# cut drift the gate exists to catch. It does NOT retire #379: 45.95 MiB of
# identical .class still ships in all nine wheels.
#
# THE REAL HAZARD IS NOT SIZE, IT IS SILENCE. Everything reachable only through
# FFI — the ~88 `ciris_verify_*` C symbols and the five `PyInit_*` entry points
# — is, to the linker, correctly unreachable: nothing in Rust calls them. An
# optimizer given more freedom can conclude exactly that. The failure then ships
# GREEN: the wheel builds, it is smaller, it imports fine, and the missing symbol
# surfaces at a call site on whichever platform inlined hardest.
#
# So the gate is symbol SURVIVAL, not the size number:
# `tests/release_gates/ffi_symbols.rs` asserts the full exported inventory, and
# build-wheels.yml re-asserts it against the built artifact on every target.
# `#[no_mangle] pub extern "C"` already implies `used`, and cdylib exports are
# GC roots — this is belt-and-braces against a future flag (`--gc-sections`,
# `-Zbuild-std`) that changes what the linker considers a root.
#
# "thin" rather than "fat" deliberately: near-identical results on a graph this
# size, without fat LTO's single-threaded whole-program link, which on this
# 31 GiB box is a memory risk (see the [profile.dev] guardrail below).
lto = "thin"
codegen-units = 1

# ── Build-memory guardrail (do NOT remove without reading this) ───────────────
# `cargo test` does not build one binary — it links the ~32 integration-test
# binaries in tests/*.rs, and EACH statically links the FULL substrate (persist +
# edge + verify + the pyo3 cdylib and all their deps). At the dev/test default of
# full DWARF (`debug = true`) that is ~2-3 GB of peak RSS per link, and cargo runs
# `nproc` jobs by default (32 on this box) → ~32 simultaneous multi-GB links, tens
# of GB over the 31 GiB of RAM. The kernel does not OOM-kill it (no `oom-kill` in
# the log); it swap-THRASHES and the machine goes unresponsive. That is exactly
# what happened once — hence this pin.
#
# `line-tables-only` keeps file:line in panic backtraces (all the suite actually
# needs) while dropping the local-variable DWARF that dominates link memory —
# roughly a 5-10x cut in per-link RSS, so even full-width parallelism fits. It
# also makes CI links faster and lighter, so it is safe on small runners (unlike a
# `[build] jobs` cap, which would OVER-subscribe a 4-core runner).
#
# Stepping through code in a debugger? Override per-invocation, don't edit this:
#   cargo test --config 'profile.dev.debug=2' --config 'profile.test.debug=2'
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"


