name: iOS LogTail

# PATH-FILTERED, per the scarce-lane policy's intent: the macOS pool is
# org-wide, so this fires only when the iOS sources (or this harness) actually
# change — Swift cannot be verified anywhere else, which is the one justified
# claim on a mac minute. (workflow_dispatch alone cannot be used until the file
# exists on the default branch, which is how this trigger got chosen.)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "client/iosApp/**"
      - ".github/workflows/ios-logtail-test.yml"

jobs:
  logtail:
    name: LogTail standalone (macOS toolchain)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract, compile, and exercise LogTail
        run: client/iosApp/scripts/test_logtail.sh
