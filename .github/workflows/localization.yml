name: Localization

on:
  # PR-only — the squash-merge is identical to the passed PR; no main-only side effect.
  pull_request:

jobs:
  localization:
    name: Localization guard (vendored client)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # A green step here means nothing unless this gate can go red, so it
      # proves it first: --self-test builds a synthetic bundle, breaks it 20
      # ways (flat-vs-nested key, desynced mirror, corrupted placeholder,
      # invalid JSON, …) and asserts every check fires with a true message.
      # It is a required step: if the guard has lost the ability to fail, the
      # job is red BEFORE the real bundle is ever looked at. See CIRISServer#366.
      - name: Prove the guard can fail (mutation self-test)
        run: python3 client/tools/check_localization_sync.py --self-test

      # Stdlib-only guard, no deps required. ERROR-level checks block:
      #   - every *.json in all FOUR runtime bundles parses,
      #   - all four bundles (shared/ + desktopApp/ + androidApp/ + iosApp/)
      #     stay byte-identical — any that goes stale ships raw keys,
      #   - the manifest language list and the shipped locale files agree,
      #   - every localizedString/getString key in commonMain Kotlin RESOLVES
      #     in en.json under LocalizationManager.resolveKey semantics,
      #   - every key in every locale is REACHABLE by that same resolver — a
      #     flat dotted key ("a.b.c": …) is dead in every language including
      #     English, which is how 53 ids shipped dead in 0c728b1 (#366),
      #   - a translated value carries exactly en.json's placeholders.
      # `--strict` ALSO blocks on cross-language drift (missing/empty keys).
      #
      # #366 recommended leaving drift a warning, on the sound reasoning that a
      # lagging locale degrades to English by design. That reasoning rested on
      # translation being slow and manual. It is not: 53 ids went into 28
      # languages in ~14 minutes of `localize-ui` agent time, and again for 56
      # more. The cost that justified a warning is gone, and what the warning
      # actually bought was 24 locales sitting 53 keys short for two days with
      # nobody noticing — the same shape as the RCA in
      # FSD/RCA_INGEST_REJECTION_2026-08-05.md, one layer up.
      #
      # If this ever blocks inconveniently: drop the flag. It is one word, and
      # the tree passed `--strict` on the day it was added.
      - name: Localization guard (mirror, resolvability, placeholders, drift)
        run: python3 client/tools/check_localization_sync.py --strict
