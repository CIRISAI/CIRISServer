name: warm-release-cache

# Warm the maturin (Windows/macOS) sccache on `main` so the v* TAG publish
# restores it warm instead of compiling cold.
#
# WHY THIS EXISTS (proven on v0.5.91, windows-x64 job):
#   sccache is wired correctly (ghac backend, SCCACHE_GHA_ENABLED, RUSTC_WRAPPER),
#   but the tag build showed `Cache hits 0 / misses 445 / 0.00%` → 21 min of cold
#   rustc. GitHub Actions caches are ref-scoped: a tag run can only READ entries
#   saved on the DEFAULT BRANCH (main). Nothing else builds the Windows wheel on
#   main, so its sccache is never populated on main → every tag is 100% cold.
#   (The CIRISCache GHCR blob restores in ~1 min but does NOT feed sccache — the
#   two are independent; the blob's tar mtimes also predate the fresh checkout so
#   cargo rebuilds regardless. sccache, being content-addressed, is the right
#   cache for the maturin legs — it just needs warming on main.)
#
# WHY IT'S GATED TO SUBSTRATE BUMPS (cheap):
#   sccache keys each unit on its own source + flags + rustc + dep hashes. A
#   version-only release changes only ciris-server's own handful of units and
#   HITS the 440+ warmed dependency units. So we only need to re-warm when the
#   persist/edge/verify pins move. A version-only bump rides the existing warm.
#
# WHY IT REUSES build-wheels.yml verbatim:
#   the warmer and the release MUST build byte-identically or the sccache they
#   share never hits. build-wheels.yml is the single source of truth; calling it
#   here (rather than a second copy) guarantees no drift.

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml   # the substrate pins live here; detect-job filters further

permissions:
  contents: read
  packages: write   # build-wheels saves the CIRISCache GHCR blob on main

concurrency:
  group: warm-release-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only warm when the persist/edge/verify pins actually changed — a plain
  # version bump (which also touches Cargo.toml) rides the already-warm deps.
  detect-substrate-bump:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.d.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: d
        shell: bash
        run: |
          if git diff HEAD~1 HEAD -- Cargo.toml \
             | grep -qE '^[+-].*(ciris-persist|ciris-edge|ciris-verify).*(tag|rev)[[:space:]]*='; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "::notice::substrate pin(s) changed — warming the release cache"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no substrate pin change — skipping warm (version-only bump rides warm deps)"
          fi

  warm:
    needs: detect-substrate-bump
    if: needs.detect-substrate-bump.outputs.bumped == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-wheels.yml
