name: Mesh harness (E2E stage ladder)

# The live two-node mesh E2E, run as a real gate rather than by hand.
#
# WHY THIS EXISTS AS CI, not just a local script: every stage of the carrier
# chain (seal → consent → converge → ship → arrive → summarize → SCORE) failed
# at least once while it was being built, and none of those failures were caught
# by unit tests — they lived in the seams between two repos. The in-process round
# harness (`tests/trace_round_e2e.rs`) uses a loopback transport and structurally
# cannot reach the attribution layer, so it is not a substitute.
#
# NOT on every push: it builds a release wheel and runs docker compose, so it is
# ~15-25 min. It runs on demand, nightly, and on PRs that touch the carrier path
# or the substrate pins — which is where a regression would come from.
#
# SUCCESS means a capacity attestation was AUTHORED about the agent BY the
# canonical. Arrival is not success: the constitution refuses self-attestation
# (anti-Goodhart), so a distinct sovereign identity must have scored it.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "scenario to run: traceflow | genesis_seed | chat (see harness/mesh-repro/scenarios/)"
        type: string
        default: traceflow
      window:
        description: "ladder window in seconds"
        type: string
        default: "780"
  schedule:
    # Nightly 04:20 UTC — catches substrate drift without gating every PR.
    - cron: "20 4 * * *"
  pull_request:
    paths:
      - "Cargo.toml"           # the substrate pins
      - "Cargo.lock"
      - "src/compose.rs"
      - "src/federation_delivery.rs"
      - "src/federation_peers.rs"
      - "src/test_bless.rs"
      - "src/scorer.rs"
      # The chat ladder's subject: the owner-gated surface, the consent grant it
      # rides, and the composition root that decides which planes replicate.
      - "src/contacts_chat.rs"
      - "src/peer.rs"
      - "src/federation_admin.rs"
      - "src/auth/**"
      - "harness/mesh-repro/**"
      - ".github/workflows/mesh-harness.yml"

# A newer commit supersedes an in-flight run: a 25-minute job should never queue
# behind a stale one.
concurrency:
  group: mesh-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ladder:
    name: ${{ matrix.scenario }} ladder
    # TWO LADDERS, IN PARALLEL, not one after the other. They are independent
    # stacks on independent compose projects and the release gates on both, so
    # serializing them would add ~20 min to every PR for no isolation the
    # separate projects do not already give. `fail-fast: false` because a red
    # chat ladder must not cancel traceflow — the two answer different questions
    # and "we never found out about the other one" is the worst outcome here.
    #
    # On workflow_dispatch the matrix collapses to the ONE scenario asked for
    # (the input has a default, so it is never empty); on pull_request and the
    # nightly schedule it is both. genesis_seed stays dispatch-only: it is an
    # AUDIT of unfinished genesis, red by design, and gating PRs on it would be
    # gating on work nobody has claimed yet.
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenario && format('["{0}"]', inputs.scenario) || '["traceflow","chat"]') }}
    runs-on: ubuntu-latest
    # 0.5.166 raised this from 45: this ladder builds a test-anchor wheel, and
    # `lto = "thin"` + `codegen-units = 1` (CIRISServer#378) roughly doubles the
    # final link. (The note used to live in client-artifacts.yml, deleted with
    # `client/` in CIRISServer#471.)
    timeout-minutes: 75
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      # BEFORE any tool install. The release build plus two docker images is tight
      # on a stock runner, and an ENOSPC mid-run looks exactly like a harness
      # failure. NOTE: do NOT delete $AGENT_TOOLSDIRECTORY — that is where the
      # rust toolchain and sccache get installed, and removing it after setup
      # makes the build fail with a bare "could not execute process `sccache`".
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/share/swift || true
          df -h / | tail -1

      # The release wheel keeps DEFAULT features, so `pkcs11` pulls libudev-sys and
      # the TPM path pulls tss2 — both need system libs or the build dies in a
      # build script with a pkg-config error that looks nothing like a harness
      # failure. Same set (and the same Microsoft-repo workaround) as ci.yml.
      - name: System deps for the release build
        run: |
          # Drop the preinstalled Microsoft/azure-cli apt repo: it intermittently
          # 403s and tanks apt-get update (its packages are not needed here).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/azure-cli.sources
          # Drop the AZURE UBUNTU MIRROR (CIRISServer#449) — the runner image makes
          # it the PRIMARY mirror via /etc/apt/apt-mirrors.txt, and a stalled
          # azure mirror wedges the whole job (68 min, 75 min, and a re-run that
          # hung again, all on one PR).
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' \
            /etc/apt/apt-mirrors.txt /etc/apt/sources.list 2>/dev/null || true
          sudo find /etc/apt/sources.list.d -type f -exec \
            sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' {} + 2>/dev/null || true
          sudo timeout 300 apt-get update \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo apt-get install -y libtss2-dev libsqlite3-dev libudev-dev

      - uses: dtolnay/rust-toolchain@1.97.0

      - name: Set up sccache (compiler cache over GHA)
        uses: mozilla-actions/sccache-action@v0.0.9

      - uses: Swatinem/rust-cache@v2
        with:
          # Read-only from PRs; main populates. Matches ci.yml's posture.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: mesh-harness

      # This was the ONLY Rust-building workflow in the repo off the shared
      # centipede — Swatinem's GHA L1 alone, so every run recompiled the whole
      # substrate from source at ~26 min a PR. The build below is a plain linux
      # release build, exactly what the L2 layers already hold.
      - name: Compute CIRISCache keys (4-layer centipede, CIRISServer#99)
        id: cachekey
        shell: bash
        run: |
          PLAT=linux-x86_64
          RUSTC=$(rustc -V | awk '{print $2}')
          S=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          P=$(grep -m1 'CIRISPersist.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          V=$(grep -m1 'CIRISVerify.*tag = "v'  Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          # tag-pin OR rev-pin (an adoption branch rides a rev until upstream tags —
          # a grep matching nothing must not kill the step: the 0.5.181 lesson).
          EDGE=$(grep -m1 'CIRISEdge.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/' || true)
          if [ -z "$EDGE" ]; then
            EDGE=$(grep -m1 'CIRISEdge.*rev = "' Cargo.toml | sed -E 's/.*rev = "([0-9a-f]+)".*/r\1/' || true)
          fi
          BASE="ciris-substrate-v1-${PLAT}-release-rustc${RUSTC}"
          {
            echo "key-verify=${BASE}-pnone-enone-v${V:-none}"
            echo "key-persist=${BASE}-p${P:-none}-enone-v${V:-none}"
            echo "key-edge=${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}"
            echo "key=${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s${S:-none}"
            echo "key-server-prefix=${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::CIRISCache (${PLAT}): S=${S:-NONE} P=${P:-NONE} V=${V:-NONE} EDGE=${EDGE:-NONE}"
      - name: CIRISCache restore (server→edge→persist→verify, first hit)
        uses: CIRISAI/CIRISCache/restore@v2
        continue-on-error: true
        with:
          keys: |
            ${{ steps.cachekey.outputs.key }}
            ${{ steps.cachekey.outputs.key-server-prefix }}*
            ${{ steps.cachekey.outputs.key-edge }}
            ${{ steps.cachekey.outputs.key-persist }}
            ${{ steps.cachekey.outputs.key-verify }}

      - name: Build the test-anchor wheel once
        run: |
          cargo build --release --features test-anchor,python
          python3 harness/mesh-repro/pack_wheel.py
          ls -la harness/mesh-repro/wheels/

      - name: Pre-pull base image
        # Buildkit's DNS has flaked here before; a pre-pull with the daemon's
        # resolver makes a genuine network failure distinguishable from a
        # harness bug (and DOCKER_BUILDKIT=0 avoids the flaky path entirely).
        run: docker pull python:3.12-slim

      # Each scenario owns its own compose file set and its own service names, and
      # the two steps AFTER the ladder (logs, teardown) need both. Resolve them
      # ONCE here rather than restating the traceflow pair in three places — a
      # teardown pointed at the wrong compose files leaves the stack running and
      # the next run inherits it.
      - name: Resolve the scenario's compose topology
        id: topo
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          case "$SCENARIO" in
            # THREE ciris-server nodes, no python agent role — the cross-node chat
            # topology is standalone, not an overlay (CIRISServer#455).
            chat)
              echo 'files=-f docker-compose.chat.yml' >> "$GITHUB_OUTPUT"
              echo 'services=canonical node-a node-b'  >> "$GITHUB_OUTPUT" ;;
            genesis_seed)
              echo 'files=-f docker-compose.yml -f docker-compose.traceflow.yml -f docker-compose.genesis.yml' >> "$GITHUB_OUTPUT"
              echo 'services=canonical agent' >> "$GITHUB_OUTPUT" ;;
            *)
              echo 'files=-f docker-compose.yml -f docker-compose.traceflow.yml' >> "$GITHUB_OUTPUT"
              echo 'services=canonical agent' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run the stage ladder
        id: ladder
        env:
          DOCKER_BUILDKIT: "0"
          SKIP_BUILD: "1"          # reuse the wheel built above
        working-directory: harness/mesh-repro
        run: |
          ./run_scenario.sh "${{ matrix.scenario }}" \
                            "${{ inputs.window || '780' }}"

      - name: Collect logs on failure
        if: failure()
        working-directory: harness/mesh-repro
        run: |
          for svc in ${{ steps.topo.outputs.services }}; do
            echo "════════ $svc ════════"
            docker compose -p "ciris-${{ matrix.scenario }}" \
              ${{ steps.topo.outputs.files }} \
              logs "$svc" 2>/dev/null | tail -400 || true
          done > harness-logs.txt
          tail -120 harness-logs.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesh-harness-${{ matrix.scenario }}-logs
          path: harness/mesh-repro/harness-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        working-directory: harness/mesh-repro
        run: |
          docker compose -p "ciris-${{ matrix.scenario }}" \
            ${{ steps.topo.outputs.files }} \
            down -v --remove-orphans || true
