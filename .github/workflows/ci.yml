name: CI

on:
  # The main run is NOT a redundant gate — it is the CACHE WARMER. Swatinem below
  # is `save-if: main`, and GHA caches are only cross-readable from the default
  # branch, so a PR can only restore a warm cache if this workflow has RUN + SAVED
  # on main. Dropping the main trigger (the earlier "redundancy trim") left every
  # PR's clippy+test fully COLD (no base cache to restore). Keep push:main so main
  # populates the shared Swatinem cache the PR matrix restores; paths-ignore keeps
  # doc-only churn off both. (The gate value of the main re-run is incidental; the
  # cache warm is the point.)
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "FSD/**"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "FSD/**"
      - "docs/**"
  # Manual trigger — the recovery path for the iOS release asset. `release.yml`
  # publishes the `ciris-server-ios` artifact THIS workflow produces, looked up
  # by commit SHA. A commit that matched paths-ignore above (a docs-only release
  # commit) has no CI run and therefore no artifact, and the release job says so
  # by name. Re-running CI on that SHA from here fixes it without a re-tag.
  workflow_dispatch:

# Cancel a superseded run on the same ref (PR re-push / newer main commit). A tag
# ref is distinct, so this never cancels a release pipeline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # CIRISCache save (GHCR) on main — CIRISServer#99

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - name: Set up sccache (compiler cache over GHA)
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        # libtss2-dev: the Linux-only keyring/tpm backend (cfg(target_os=linux)).
        # libsqlite3-dev: persist's sqlite. macOS/Windows pull NEITHER tss-esapi
        # nor openssl (postgres+tpm are Linux-only per Cargo.toml [target.linux]).
        run: |
          # Drop the preinstalled Microsoft/azure-cli apt repo: it intermittently
          # 403s and tanks apt-get update (its packages are not needed here).
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update
          sudo apt-get install -y libtss2-dev libsqlite3-dev libudev-dev
      # CIRISCache (CIRISServer#99) — 4-layer centipede over the Swatinem GHA L1.
      # PLAT from the NATIVE target of each runner (macos-latest = arm64). Restore
      # verify→persist→edge→server; SAVE under the server-specific -s key on main.
      - name: Compute CIRISCache keys (4-layer centipede, CIRISServer#99)
        id: cachekey
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)  PLAT=linux-x86_64 ;;
            macos-latest)   PLAT=macos-aarch64 ;;
            windows-latest) PLAT=windows-x64 ;;
            *)              PLAT=unknown ;;
          esac
          RUSTC=$(rustc -V | awk '{print $2}')
          S=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          P=$(grep -m1 'CIRISPersist.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          V=$(grep -m1 'CIRISVerify.*tag = "v'  Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          EDGE=$(grep -m1 'CIRISEdge.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          BASE="ciris-substrate-v1-${PLAT}-release-rustc${RUSTC}"
          KEY_VERIFY="${BASE}-pnone-enone-v${V:-none}"
          KEY_PERSIST="${BASE}-p${P:-none}-enone-v${V:-none}"
          KEY_EDGE="${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}"
          KEY_SERVER="${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s${S:-none}"
          {
            echo "key-verify=${KEY_VERIFY}"
            echo "key-persist=${KEY_PERSIST}"
            echo "key-edge=${KEY_EDGE}"
            echo "key=${KEY_SERVER}"
            echo "key-server-prefix=${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::CIRISCache (${PLAT}): S=${S:-NONE} P=${P:-NONE} V=${V:-NONE} EDGE=${EDGE:-NONE} RUSTC=${RUSTC}"
          echo "::notice::${KEY_VERIFY}"
          echo "::notice::${KEY_PERSIST}"
          echo "::notice::${KEY_EDGE}"
          echo "::notice::${KEY_SERVER}"
      # Deepest-first, first-hit-wins (CIRISCache restore@v2): the layers are
      # cumulative supersets, so one restore of the deepest available blob beats
      # extracting verify→persist→edge→server in sequence (the edge layer alone
      # measured 452s/7.5min on v1 — redundant overwrite I/O).
      - name: CIRISCache restore (server→edge→persist→verify, first hit)
        uses: CIRISAI/CIRISCache/restore@v2
        continue-on-error: true
        with:
          keys: |
            ${{ steps.cachekey.outputs.key }}
            ${{ steps.cachekey.outputs.key-server-prefix }}*
            ${{ steps.cachekey.outputs.key-edge }}
            ${{ steps.cachekey.outputs.key-persist }}
            ${{ steps.cachekey.outputs.key-verify }}
      # Default features build everywhere (sqlite + the binary path); postgres +
      # tpm are Linux-only (per-target). NOT --all-features: that drags
      # `extension-module` (libpython-no-link) into the test binary.
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # CIRISServer#373 — `cargo test` above tests the ROOT PACKAGE ONLY. With a
      # root package present and no `default-members`, the workspace member is
      # never built as a test target, so ciris-lens-core's 364 unit tests — the
      # hybrid seal, the batch round-trip, tamper detection for the trace plane —
      # had NEVER run in CI. The gap proved itself: those targets did not compile
      # against persist v29.0.0 on main, and CI was green through the whole
      # adoption. Test code that does not compile is the loudest possible
      # failure, and nothing heard it.
      #
      # Deliberately a SEPARATE step rather than `--workspace` or a
      # `default-members` entry: both of those also change what a bare local
      # `cargo test` builds, and on the maintainer's box a workspace-wide build
      # OOMs. This keeps the local command untouched and names the package.
      - run: cargo test -p ciris-lens-core --lib
      # The NOISE FLOOR proof (CIRISServer#14, CEG §19.7 / §19.3 N5) — provable
      # individual-unrecoverability for erasure compliance, run explicitly so the
      # MEASURED residual-fidelity numbers land in the CI log (Linux only — one
      # canonical record; the test also runs on every OS via `cargo test` above).
      # The three gated cases: (a) revocation ⇒ EjectHardDelete leaves NO
      # recoverable tier, (b) the measured noise floor below n_source symbols,
      # (c) N→1 aggregation erases the individual below the 1/N gist bound.
      - name: Noise floor proof (MEASURED, Linux)
        if: runner.os == 'Linux'
        run: cargo test --test noise_floor -- --nocapture
      # The PyO3 wheel surface (Linux only; libpython linked, no extension-module).
      # --lib, NOT --all-targets: the `python` feature is used ONLY in the lib
      # (src/lib.rs + src/federation_delivery.rs) — no test/bin/example gates on it —
      # so --all-targets recompiled the entire test surface (and the binary, which
      # must never link libpython) with python for ZERO added lint coverage. --lib
      # is faster and strictly more correct.
      - name: clippy (python surface, Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --lib --features python -- -D warnings
      # The test-anchor surface. NOT covered by the two clippy runs above, which
      # build default + python only — so a struct-shape change that breaks
      # `--features test-anchor` compiled green here and shipped, and the break
      # only surfaced when someone built the QA wheel. A cut that does not
      # compile under test-anchor breaks the mesh harness for every downstream
      # consumer, which is exactly the audience least able to diagnose it.
      #
      # Caught in the wild: v24.0.0 added `Attestation.additional_scrubs`, and
      # the one initializer behind this feature gate was invisible to CI. The
      # agent team hit it building their harness wheel and flagged it before we
      # tagged. Build, not clippy: compilation is the failure mode.
      # --all-targets, NOT --lib: the break that motivated this lives in a
      # test-only initializer (tests/trust_root_qa.rs — a `src/` module until
      # CIRISServer#362 moved it out of the --lib binary), which a --lib build
      # cannot see. Shipped past the --lib version of this very step once — the
      # gate has to compile the same targets the QA wheel and the test suite do,
      # and --all-targets is what reaches tests/.
      - name: clippy (test-anchor surface, Linux)
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --features test-anchor -- -D warnings
      # ...and RUN them. The step above compiles the test-anchor surface; it does
      # not execute it, and two whole test files live behind this feature gate:
      #
      #   tests/trace_round_e2e.rs   4 tests — an agent-shaped node's sealed
      #                              `trace:*` crossing to a canonical over a real
      #                              anti-entropy round. THE acceptance proof that
      #                              traces flow.
      #   tests/trust_root_qa.rs     7 tests — the trust-root QA roster.
      #
      # Both begin `#![cfg(feature = "test-anchor")]`, so without the feature the
      # binary contains ZERO tests and cargo prints `test result: ok. 0 passed`.
      # A green line, an empty instrument. Eleven tests — including the one that
      # proves the thing this whole release is for — were never run by CI, and a
      # full 65-target local sweep counted `trace_round_e2e` as passing.
      #
      # Same shape as CIRISServer#373 (bare `cargo test` tests the ROOT PACKAGE
      # only, so a workspace member's 364 tests never ran). Twice now the gap has
      # been in CI's SELECTION — which targets, which features — rather than in
      # any assertion. Compilation coverage is not execution coverage.
      - name: test (test-anchor surface, Linux)
        if: runner.os == 'Linux'
        run: cargo test --features test-anchor --test trace_round_e2e --test trust_root_qa
      # Evidence registry (CIRISServer#155 / CIRISConstitution#17): every impl:
      # pointer in evidence/cc_impl.tsv MUST resolve at the pinned crate version —
      # a moved/renamed symbol is a spec-regression failure. Runs here because the
      # cargo git checkouts (needed to resolve the substrate symbols) are populated
      # by the build above. Linux-only (one canonical run).
      - name: "Evidence manifest resolves (CC impl: tier)"
        if: runner.os == 'Linux'
        run: python3 tools/check_evidence.py
      - name: sccache stats
        if: always()
        run: sccache --show-stats
      # NB: CI does NOT save a cache blob. It builds DEBUG (clippy+test); saving a
      # debug `target/` measured ~586s (10 min) on main to spare only the ~30s
      # debug ciris-server recompile next run — a net loss — and it collided with
      # conformance's RELEASE `-s<version>` blob (same key). The release `-s` is
      # populated by conformance (on main) + build-wheels (on tags); CI only
      # RESTORES (the centipede above) and lets cargo do the cheap debug delta.
      # (The `ios-build` job below is the ONE exception — see its save step.)

  # ══════════════════════════════════════════════════════════════════════════
  # iOS — device + simulator PyO3 abi3 slices.
  #
  # PORTED FROM CIRISPersist `.github/workflows/ci.yml` (`ios-build` +
  # `ios-package`, persist v2.0.4+). All three substrate siblings build these
  # two targets in their OWN ci.yml — CIRISVerify, CIRISPersist, CIRISEdge —
  # and CIRISServer built neither. That gap is why the client's iOS substrate
  # refresh has been red since June: CIRISAgent's
  # `.github/workflows/refresh-ios-substrate.yml` greps a release's
  # `.assets[].name` for /ios/i before refreshing, found no match on
  # CIRISAI/CIRISServer, and correctly refused to refresh from an asset that
  # does not exist. The workflow was right; the asset was missing.
  #
  # ── THE PUBLISHED CONTRACT (the consumer is in ANOTHER REPO) ──────────────
  # Consumer: CIRISAgent `tools/update_substrate_libs.py` (its CIRISServer
  # entry) + `client/iosApp/scripts/embed_native_frameworks.sh`. Tracking
  # issue for the client half: CIRISAI/CIRISAgent#1011. Everything below is
  # load-bearing on the OTHER side of that repo boundary — change one, change
  # both:
  #
  #   release asset   ciris-server-v<version>-ios.tar.gz
  #                   ← `{tarball_prefix}-v{version}-ios.tar.gz`; <version> is
  #                     the Cargo.toml/PyPI version, which is what the client
  #                     resolves from its requirements.txt pin.
  #   tar layout      ios-device/_native.abi3.so
  #                   ios-simulator/_native.abi3.so
  #                   ← `{device_dir}/{dylib_filename}` and
  #                     `{simulator_dir}/{dylib_filename}`.
  #   slice filename  _native.abi3.so   NOT ciris_server.abi3.so.
  #                   ← our PyO3 module is the IN-PACKAGE submodule
  #                     `ciris_server._native` (pyproject
  #                     `module-name = "ciris_server._native"`, `#[pymodule] fn
  #                     _native`), so the only init symbol in the cdylib is
  #                     `PyInit__native`. A file named `ciris_server.abi3.so`
  #                     would need `PyInit_ciris_server` and fail to import.
  #                     This is where we differ from persist/edge, whose
  #                     modules are top-level and same-named as their package.
  #   install_name    @rpath/ciris_server._native.framework/ciris_server._native
  #                   ← `embed_native_frameworks.sh` derives the framework name
  #                     from the path under `app_packages_native`: strip
  #                     `.abi3.so`, then `/` → `.`. The client lays the slice
  #                     down at `app_packages_native/ciris_server/_native.abi3.so`,
  #                     so the framework it builds is `ciris_server._native`.
  #                     (CIRISAgent#1011 fixes the matching `.fwork` redirect,
  #                     which is currently hardcoded to `{pkg}.{pkg}`.)
  #
  # ── Why cargo build and not maturin ───────────────────────────────────────
  # maturin 1.13's platform check rejects a darwin→iOS cross-compile outright
  # (persist's lane records the same). So: plain `cargo build` with the PyO3
  # cross-compilation env vars, plus BeeWare's Python-Apple-support for the
  # target libpython and `_sysconfigdata` — PyO3 PR #5605 requires libpython
  # LINKING on iOS, so `extension-module` does not suppress it there the way it
  # does on desktop.
  # ══════════════════════════════════════════════════════════════════════════
  ios-build:
    name: ios PyO3 abi3 (${{ matrix.dir }})
    runs-on: macos-14
    # The two targets are a 2-entry MATRIX, not one job building both: cargo's
    # target-dir lock prevents in-job parallelism, so a matrix is the only way
    # to overlap them (persist measured a ~20m sequential job before the split).
    # `ios-package` below recombines the slices into the single tar.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-ios,     dir: ios-device,    lib_dir_out: device_lib_dir }
          - { target: aarch64-apple-ios-sim, dir: ios-simulator, lib_dir_out: sim_lib_dir }
    env:
      # 3.10 is not arbitrary: the client's iOS app embeds CPython 3.10
      # (client/iosApp Resources carry `python3.10` +
      # `_sysconfigdata__ios_arm64-iphoneos.py`, and its native modules are
      # `*.cpython-310-iphoneos.so`). Same pin as persist's lane.
      PYTHON_IOS_VER: "3.10"
      PYTHON_IOS_BUILD: "b13"
      # DEVIATION from persist, deliberate: persist passes a long explicit
      # feature list because ITS pyproject `[tool.maturin] features` is long.
      # Ours is exactly `["extension-module"]` — so this mirrors OUR wheel, per
      # the same rule. `extension-module` implies `python` (pyo3 +
      # ciris-verify-ffi + the persist/edge/lens pyo3 surfaces), and cargo's
      # default features stay ON (`default = ["pkcs11"]`), which is precisely
      # what `maturin build` compiles for the published wheel.
      IOS_PYO3_FEATURES: extension-module
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      # DEVIATION from persist in FORM, not in key: persist calls its local
      # `./.github/actions/ciriscache` composite; this repo has no
      # `.github/actions/` at all and inlines the 4-layer centipede in every
      # job (ci.yml above, build-wheels.yml, release.yml). Inlined here too, so
      # the iOS lane looks like every other CIRISServer cache block.
      #
      # PLAT=ios-<target triple> is byte-identical to verify's and persist's
      # token (`ios-${{ matrix.target }}` → ios-aarch64-apple-ios /
      # ios-aarch64-apple-ios-sim). Persist's #316 comment records why this
      # matters: its earlier `ios-aarch64` NEVER matched verify's
      # `ios-aarch64-apple-ios` blob, so the cross-repo restore always missed.
      # (CIRISEdge still uses the short `ios-aarch64` form in its ios-pyo3
      # matrix — persist and verify are the aligned pair; follow those.)
      - name: Compute CIRISCache keys (4-layer centipede, CIRISServer#99)
        id: cachekey
        shell: bash
        run: |
          PLAT="ios-${{ matrix.target }}"
          RUSTC=$(rustc -V | awk '{print $2}')
          S=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          P=$(grep -m1 'CIRISPersist.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          V=$(grep -m1 'CIRISVerify.*tag = "v'  Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          EDGE=$(grep -m1 'CIRISEdge.*tag = "v' Cargo.toml | sed -E 's/.*tag = "v([0-9.]+)".*/\1/')
          BASE="ciris-substrate-v1-${PLAT}-release-rustc${RUSTC}"
          KEY_VERIFY="${BASE}-pnone-enone-v${V:-none}"
          KEY_PERSIST="${BASE}-p${P:-none}-enone-v${V:-none}"
          KEY_EDGE="${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}"
          KEY_SERVER="${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s${S:-none}"
          {
            echo "key-verify=${KEY_VERIFY}"
            echo "key-persist=${KEY_PERSIST}"
            echo "key-edge=${KEY_EDGE}"
            echo "key=${KEY_SERVER}"
            echo "key-server-prefix=${BASE}-p${P:-none}-e${EDGE:-none}-v${V:-none}-s"
            echo "key-any=${BASE}-p"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::CIRISCache (${PLAT}): S=${S:-NONE} P=${P:-NONE} V=${V:-NONE} EDGE=${EDGE:-NONE} RUSTC=${RUSTC}"
          echo "::notice::${KEY_VERIFY}"
          echo "::notice::${KEY_PERSIST}"
          echo "::notice::${KEY_EDGE}"
          echo "::notice::${KEY_SERVER}"
      - name: CIRISCache restore (server→edge→persist→verify, first hit)
        uses: CIRISAI/CIRISCache/restore@v2
        continue-on-error: true
        with:
          keys: |
            ${{ steps.cachekey.outputs.key }}
            ${{ steps.cachekey.outputs.key-server-prefix }}*
            ${{ steps.cachekey.outputs.key-edge }}
            ${{ steps.cachekey.outputs.key-persist }}
            ${{ steps.cachekey.outputs.key-verify }}
            ${{ steps.cachekey.outputs.key-any }}*
      # Ported verbatim from persist's lane. macOS runners can restore a
      # `~/.cargo/bin/cargo` that IS the rustup-init shim: it passes
      # `cargo --version` through (any CLI accepts --version) but fails
      # `cargo build` with "unexpected argument 'build' found". Probe via
      # `cargo build --help`, then nuke + reinstall. Kept because this job
      # restores the same CIRISCache blobs persist's does.
      - name: Repair toolchain if rustup-init shadow (cache-poison heal)
        shell: bash
        run: |
          if cargo build --help 2>&1 | grep -q "rustup-init"; then
            echo "::warning::Detected rustup-init shadow in ~/.cargo/bin; reinstalling toolchain"
            rm -rf "$HOME/.cargo/bin"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain 1.97.0 --profile minimal --no-modify-path
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup default 1.97.0
          cargo --version
          cargo build --help >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: download Python-Apple-support (iOS)
        id: python-ios
        run: |
          set -euo pipefail
          SUPPORT_URL="https://github.com/beeware/Python-Apple-support/releases/download/${PYTHON_IOS_VER}-${PYTHON_IOS_BUILD}/Python-${PYTHON_IOS_VER}-iOS-support.${PYTHON_IOS_BUILD}.tar.gz"
          mkdir -p "${RUNNER_TEMP}/python-ios"
          curl -sL "${SUPPORT_URL}" -o "${RUNNER_TEMP}/python-ios-support.tar.gz"
          tar xzf "${RUNNER_TEMP}/python-ios-support.tar.gz" -C "${RUNNER_TEMP}/python-ios"

          XCFW="${RUNNER_TEMP}/python-ios/Python.xcframework"

          # PyO3 cross-compilation wants libpython + _sysconfigdata in ONE
          # directory (PYO3_CROSS_LIB_DIR). Stage them out of the xcframework.
          DEVICE_DIR="${RUNNER_TEMP}/pyo3-ios-device"
          mkdir -p "$DEVICE_DIR"
          cp "$XCFW/ios-arm64/Python.framework/Python" \
             "$DEVICE_DIR/libpython${PYTHON_IOS_VER}.dylib"
          cp "$XCFW/ios-arm64/lib-arm64/python${PYTHON_IOS_VER}/_sysconfigdata__ios_arm64-iphoneos.py" \
             "$DEVICE_DIR/"
          echo "device_lib_dir=${DEVICE_DIR}" >> "$GITHUB_OUTPUT"

          SIM_DIR="${RUNNER_TEMP}/pyo3-ios-sim"
          mkdir -p "$SIM_DIR"
          cp "$XCFW/ios-arm64_x86_64-simulator/Python.framework/Python" \
             "$SIM_DIR/libpython${PYTHON_IOS_VER}.dylib"
          cp "$XCFW/ios-arm64_x86_64-simulator/lib-arm64/python${PYTHON_IOS_VER}/_sysconfigdata__ios_arm64-iphonesimulator.py" \
             "$SIM_DIR/"
          echo "sim_lib_dir=${SIM_DIR}" >> "$GITHUB_OUTPUT"

          echo "✓ Python-Apple-support ${PYTHON_IOS_VER}-${PYTHON_IOS_BUILD} staged"
          ls -la "$DEVICE_DIR/" "$SIM_DIR/"
      # DEVIATION from persist: `--lib`. persist's crate has no `[[bin]]`; ours
      # does (`ciris-server`, src/main.rs), and Cargo.toml is explicit that the
      # BINARY must never link libpython. A bare `cargo build --features
      # extension-module` would also build that bin for iOS — meaningless on
      # the platform and the one link configuration this crate forbids. `--lib`
      # builds exactly the cdylib the wheel/app loads.
      - name: cargo build (ios — ${{ matrix.target }})
        env:
          PYO3_CROSS: "1"
          # Tied to PYTHON_IOS_VER above (kept literal, as persist does).
          PYO3_CROSS_PYTHON_VERSION: "3.10"
          PYO3_CROSS_LIB_DIR: ${{ steps.python-ios.outputs[matrix.lib_dir_out] }}
        run: >-
          cargo build --release --lib
          --target ${{ matrix.target }}
          --features "$IOS_PYO3_FEATURES"
      - name: strip + stage ios cdylib (${{ matrix.dir }})
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.dir }}"
          # cdylib output is libciris_server.dylib → _native.abi3.so (see THE
          # PUBLISHED CONTRACT above for why the name is `_native`, not
          # `ciris_server`). The install-name fix matters: cargo embeds the
          # runner's absolute path, and the iOS app resolves the module through
          # an @rpath framework built by embed_native_frameworks.sh.
          SRC="target/${{ matrix.target }}/release/libciris_server.dylib"
          DST="dist/${{ matrix.dir }}/_native.abi3.so"
          if [ ! -f "$SRC" ]; then
            echo "::error::${SRC} not found"
            ls -la "target/${{ matrix.target }}/release/" | grep ciris || true
            exit 1
          fi
          strip -x "$SRC"
          install_name_tool -id \
            "@rpath/ciris_server._native.framework/ciris_server._native" \
            "$SRC"
          cp "$SRC" "$DST"
          echo "✓ ${{ matrix.dir }}: $(ls -la "$DST" | awk '{print $5}') bytes"
          otool -D "$DST"
          file "$DST"
          # The import surface is the whole point of shipping this slice: if
          # PyInit__native is absent the app gets a framework that dlopens and
          # then fails `from ._native import *` at launch — the exact silent-
          # until-device failure this lane exists to prevent.
          if ! nm -gU "$DST" | grep -q "_PyInit__native"; then
            echo "::error::${DST} does not export PyInit__native — the module would not import on device"
            nm -gU "$DST" | grep -i pyinit || true
            exit 1
          fi
          echo "✓ exports PyInit__native"
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-server-ios-${{ matrix.dir }}
          path: dist/${{ matrix.dir }}/_native.abi3.so
          if-no-files-found: error
      # The ONE CI job that SAVES a CIRISCache blob, and it does not contradict
      # the "CI does NOT save" note on clippy-test above: that note is about
      # DEBUG target/ dirs colliding with conformance's RELEASE `-s<version>`
      # blob under the same key. This job builds RELEASE, and no other
      # CIRISServer job uses an `ios-*` PLAT token — so there is nothing to
      # collide with, and the next run (and CIRISAgent's refresh) restores a
      # warm iOS target/ instead of cold-compiling the substrate. Persist saves
      # from its iOS lane for exactly this reason. continue-on-error, so a
      # missing package scope can never turn the build red.
      - uses: CIRISAI/CIRISCache/save@v1
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          key: ${{ steps.cachekey.outputs.key }}
          token: ${{ secrets.GITHUB_TOKEN }}
          # LRU-prune target/ to 4GB before tar (persist v1/ff52ca3): breaks the
          # fat-blob ratchet where superseded dep generations are re-saved forever.
          max-size-mb: "4096"

  # Recombine the two parallel slices into the single tar the release publishes.
  # Mirrors persist's `ios-package`. Runs on EVERY push/PR, not just releases:
  # the recombine is validated long before a tag needs it, and `release.yml`
  # consumes this artifact rather than rebuilding on a second macOS runner.
  ios-package:
    name: package ios artifacts
    runs-on: ubuntu-latest
    needs: [ios-build]
    steps:
      - uses: actions/checkout@v4
      - name: extract version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/^version = "([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: download both iOS target artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ciris-server-ios-*
          path: artifacts/
      - name: package ios tarball
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist/ios-device dist/ios-simulator
          cp artifacts/ciris-server-ios-ios-device/_native.abi3.so    dist/ios-device/
          cp artifacts/ciris-server-ios-ios-simulator/_native.abi3.so dist/ios-simulator/
          echo "=== ios-device ===";    ls -la dist/ios-device/;    file dist/ios-device/_native.abi3.so
          echo "=== ios-simulator ==="; ls -la dist/ios-simulator/; file dist/ios-simulator/_native.abi3.so
          # THE asset name the client resolves — see THE PUBLISHED CONTRACT above.
          tar -czf "dist/ciris-server-v${VERSION}-ios.tar.gz" -C dist ios-device ios-simulator
          echo "✓ packaged ciris-server-v${VERSION}-ios.tar.gz"
          ls -la "dist/ciris-server-v${VERSION}-ios.tar.gz"
          # Prove the layout the client indexes into (`{device_dir}/{dylib_filename}`)
          # actually exists inside the tar, here, where a mistake is cheap.
          # List ONCE into a variable, then match against that.
          #
          # `tar -tzf … | grep -qx …` looks obvious and is wrong under
          # `set -o pipefail`: grep -q exits on its FIRST match, tar is killed by
          # SIGPIPE writing to the closed pipe, and pipefail propagates tar's
          # non-zero status — so the check reports the member MISSING at the
          # exact moment it is PRESENT. The first CI run failed this way over a
          # tarball whose own listing, printed two lines above the error, showed
          # both members. A false negative in a verification gate is worse than
          # no gate: it sends you looking for a defect in a correct artifact.
          #
          # Mechanism INFERRED, not reproduced: an 8,003-entry / 335 KB listing
          # locally would not induce tar's death, so this is read off CI's log
          # (`tar: stdout: write error` on the line before the verdict) plus the
          # shape of `if ! (tar | grep -q)`, which treats ANY non-zero pipeline —
          # tar dying included — as "no match". Listing once removes the pipeline,
          # so the fix holds whichever component actually died.
          IOS_TAR_LISTING="$(tar -tzf "dist/ciris-server-v${VERSION}-ios.tar.gz")"
          printf '%s\n' "$IOS_TAR_LISTING" | sort
          for MEMBER in ios-device/_native.abi3.so ios-simulator/_native.abi3.so; do
            if ! printf '%s\n' "$IOS_TAR_LISTING" | grep -qx "$MEMBER"; then
              echo "::error::tarball is missing ${MEMBER} — CIRISAgent update_substrate_libs.py indexes exactly this path"
              exit 1
            fi
          done
          echo "✓ tar layout matches the published contract"
      # NO retention-days override: release.yml downloads this artifact from the
      # CI run of the tagged commit, which can be days later. The 90-day default
      # is the window that makes that possible.
      - uses: actions/upload-artifact@v4
        with:
          name: ciris-server-ios
          path: dist/ciris-server-v*-ios.tar.gz
          if-no-files-found: error
