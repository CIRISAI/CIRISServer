      # its #[no_mangle] fns (the agent reaches them via ctypes at runtime), so
      # --gc-sections would happily dead-strip all ~84 ciris_verify_* symbols —
      # PER-PLATFORM-SILENTLY. Assert the surface actually survived into the wheel.
      #
      # ── Wheel size gate (CIRISServer#378) ────────────────────────────────
      # PyPI enforces a per-project file limit (100 MB for `ciris-server`) at
      # UPLOAD — the last step of a tag run, after every wheel has built and the
      # conformance gate has passed. v0.5.157 died there: macosx_10_12_x86_64 at
      # 100.4 MB, rejected, with the Linux/Android wheels already published.
