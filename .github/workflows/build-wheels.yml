          # v0.5.157's macosx_10_12_x86_64 wheel was REJECTED by PyPI at 100.4 MB
          # against a 100 MB project limit. Dropping the unused dylib takes it to
          # 91.4 MB — measured on the rejected artifact itself, not projected.
