          # Compose's macOS uber-jar bundles BOTH Skiko renderers — 19.8 MB of
          # arm64 plus 20.6 MB of x64 — and a wheel loads exactly one. Linux and
          # Windows ship a single native and are already correct; this is a
          # macOS-only surgery, so the loop is a no-op elsewhere by construction
          # rather than by an `if`.
