          # This also retires the KNOWN LIMITATION documented on the macos job:
          # the x86_64 wheel is built on an Apple-Silicon runner so its JAR is
          # named `-arm64`, and the note warned an Intel user might hit a Skiko
          # load error. They would not have — the JAR carried both natives — but
          # after this step the payload is genuinely single-arch and matches the
          # wheel tag, so the name is the only arm64 thing left about it.
          python3 - "${{ matrix.target }}" <<'SKIKO'
          import os, sys, zipfile, glob, shutil
          want = "arm64" if sys.argv[1] in ("aarch64", "arm64") else "x64"
          drop = "arm64" if want == "x64" else "x64"
          for jar in glob.glob("../python/ciris_server/desktop_app/CIRIS-macos-*.jar"):
              victims = {f"libskiko-macos-{drop}.dylib", f"libskiko-macos-{drop}.dylib.sha256"}
              src = zipfile.ZipFile(jar)
              names = {i.filename for i in src.infolist()}
              if not (victims & names):
                  print(f"  {os.path.basename(jar)}: no {drop} native present — nothing to drop")
                  src.close(); continue
              # Fail loudly if the native we intend to KEEP is missing: shipping a
              # JAR with neither renderer is worse than shipping one with both.
              keep = f"libskiko-macos-{want}.dylib"
              assert keep in names, f"{jar}: would drop {drop} but {keep} is ABSENT — refusing"
              tmp = jar + ".tmp"
              before = sum(i.file_size for i in src.infolist())
              with zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED) as out:
                  for i in src.infolist():
                      if i.filename in victims:
                          continue
                      out.writestr(i, src.read(i.filename))
              src.close(); shutil.move(tmp, jar)
              after = sum(i.file_size for i in zipfile.ZipFile(jar).infolist())
              print(f"  {os.path.basename(jar)}: kept {want}, dropped {drop} — "
                    f"{before/1048576:.1f} MB -> {after/1048576:.1f} MB")
